<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPX Exception Handling</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--spx:#ee4d2d;--bg:#f5f5f5;--card:#fff;--mut:#757575}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Roboto,Arial;background:var(--bg);color:#222}
header{position:sticky;top:0;background:#fff;border-bottom:1px solid #eee;display:flex;gap:8px;align-items:center;padding:10px 12px;z-index:5}
header h1{font-size:17px;margin:0;flex:1}
button{cursor:pointer;border:1px solid #ddd;background:#fff;border-radius:8px;padding:9px 12px;font-size:14px}
button.primary{background:var(--spx);border-color:var(--spx);color:#fff;font-weight:700}
button:disabled{opacity:.45;cursor:not-allowed}
main{padding:12px;max-width:980px;margin:0 auto}
.toolbar{display:flex;gap:8px;margin-bottom:10px}
.toolbar input{flex:1;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:15px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.card{background:var(--card);border-radius:10px;overflow:hidden;border:1px solid #eee}
.card img{width:100%;height:130px;object-fit:cover;display:block;background:#eee}
.card .body{padding:8px}
.code{font-weight:700;font-size:13px;word-break:break-all}
.days{display:inline-block;background:#fff3e0;color:#e65100;border-radius:12px;padding:1px 8px;font-size:12px;margin-left:4px}
.st{display:inline-block;margin-top:6px;font-size:12px;padding:2px 8px;border-radius:12px;background:#e8f5e9}
.st.Resolve{background:#e3f2fd}.st.thanhly{background:#fce4ec}
.meta{color:var(--mut);font-size:12px;margin-top:4px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-start;justify-content:center;padding:14px;z-index:20;overflow:auto}
.modal.open{display:flex}
.sheet{background:#fff;border-radius:12px;max-width:640px;width:100%;padding:14px}
.sheet h2{margin:0 0 8px;font-size:17px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{border:1px solid #eee;padding:7px;text-align:left;vertical-align:top}
th{background:#fafafa;width:130px}
.sheet img.big{width:100%;max-height:260px;object-fit:contain;background:#f6f6f6;border:1px solid #eee;border-radius:8px;margin:6px 0}
.field{margin:8px 0}.field label{display:block;font-weight:600;margin-bottom:4px;font-size:14px}
.field input,.field textarea{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:14px}
.row{display:flex;gap:8px}.row>*{flex:1}
.hist{background:#fafafa;border:1px solid #eee;border-radius:8px;padding:8px;font-size:13px;margin-top:8px}
.msg{min-height:20px;font-size:13px;margin:6px 0}.msg.ok{color:#2e7d32}.msg.err{color:#c62828}
#liqList{list-style:none;padding:0;margin:8px 0}#liqList li{background:#fff;border:1px solid #eee;border-radius:8px;padding:8px;margin-bottom:6px;display:flex;gap:8px;align-items:center}
#reader{width:100%;max-width:420px;margin:8px auto}
#printArea{display:none}
@media print{body>*{display:none!important}#printArea{display:block!important;text-align:center;padding-top:60px}#printArea .pcode{font-size:28px;font-weight:800;margin-top:16px}}
.tabs{display:flex;gap:8px;margin:8px 0}
.tabs button.flex{flex:1}
.photoBox{border:1px dashed #bbb;border-radius:8px;padding:8px;text-align:center}
.photoBox img{max-width:100%;max-height:180px;display:none;margin-top:6px}
</style>
</head>
<body>
<header>
<h1>SPX Ngoại Lệ</h1>
<button id="navMain">Chính</button>
<button id="navLiq">Thanh Lý</button>
<button id="btnCreate" class="primary">Create</button>
</header>

<main id="viewMain">
<div class="toolbar">
<input id="scanMain" placeholder="Scan mã / súng quét rồi Enter…" inputmode="text">
<button id="camMain">Quét</button>
</div>
<div id="reader" style="display:none"></div>
<div class="msg" id="msgMain"></div>
<div id="grid"></div>
</main>

<main id="viewLiq" style="display:none">
<h2 style="margin:4px 0">Thanh Lý</h2>
<div class="toolbar">
<input id="scanLiq" placeholder="Scan mã đơn…" inputmode="text">
<button id="camLiq">Quét</button>
</div>
<div class="msg" id="msgLiq"></div>
<ul id="liqList"></ul>
<div class="row">
<button id="btnNext" class="primary" disabled>Next</button>
</div>
<div id="liqCodeWrap" style="display:none">
<div class="field"><label>Mã Thanh Lý</label>
<input id="liqCode" placeholder="Scan mã Thanh Lý SPXVN...">
</div>
<button id="btnLiqDone" class="primary">Hoàn Thành</button>
</div>
</main>

<div class="modal" id="detailModal"><div class="sheet">
<h2>Chi tiết đơn hàng</h2>
<div id="detailBody"></div>
<div class="hist" id="detailHist"></div>
<div class="field"><label>Resolve</label>
<input id="resolveBill" placeholder="Vui lòng nhập mã bill xử lý...">
</div>
<div class="row">
<button id="btnPrintDetail">In Mã</button>
<button id="btnResolve" class="primary">Hoàn Thành</button>
<button id="btnCloseDetail">Đóng</button>
</div>
<div class="msg" id="msgDetail"></div>
</div></div>

<div class="modal" id="createModal"><div class="sheet">
<h2>Create</h2>
<div class="tabs">
<button id="tabNonAwb" class="primary flex">+Non-AWB</button>
<button id="tabLiqGo" class="flex">Thanh Lý</button>
</div>
<div id="paneNonAwb">
<div class="tabs"><button id="tabBox" class="primary flex">Box</button><button id="tabItem" class="flex">Item</button></div>
<div id="formBox">
<div class="field"><label>Mã Box</label><input id="boxCode" readonly placeholder="Box.(ngày-tháng-năm).(số tự sinh)"></div>
<div class="field"><label>Ảnh Ngoại Quan</label><div class="photoBox"><input type="file" id="boxOuter" accept="image/*" capture="environment"><img id="boxOuterPrev"></div></div>
<div class="field"><label>Ảnh Sản Phẩm</label><div class="photoBox"><input type="file" id="boxProduct" accept="image/*" capture="environment"><img id="boxProductPrev"></div></div>
<div class="field"><label>Mô tả sản phẩm</label><textarea id="boxDesc" rows="2"></textarea></div>
<div class="field"><label>Ghi chú</label><input id="boxNote" placeholder="Nơi để, bù đơn hàng..."></div>
<div class="row"><button id="btnBoxPrint">In Mã</button><button id="btnBoxDone" class="primary">Hoàn Thành</button></div>
</div>
<div id="formItem" style="display:none">
<div class="field"><label>Mã Item</label><input id="itemCode" readonly placeholder="Item.(ngày-tháng-năm).(số tự sinh)"></div>
<div class="field"><label>Ảnh Sản Phẩm</label><div class="photoBox"><input type="file" id="itemProduct" accept="image/*" capture="environment"><img id="itemProductPrev"></div></div>
<div class="field"><label>Mô tả sản phẩm</label><textarea id="itemDesc" rows="2"></textarea></div>
<div class="row"><button id="btnItemDone" class="primary">Hoàn Thành</button></div>
</div>
<div class="msg" id="msgCreate"></div>
</div>
<div class="row" style="margin-top:8px"><button id="btnCloseCreate">Đóng</button></div>
</div></div>

<div id="printArea"><div id="qrBox"></div><div class="pcode" id="printCode"></div></div>

<script>
var DEMO=[
{code:'Box.01-10-2026.21',kind:'Box',createdAt:'01/10/2026 09:00:00',createdBy:'demo@spx.vn',imgOuter:'',imgProduct:'',description:'Demo box',note:'',status:'chua_xu_ly',statusLabel:'Lưu kho',bill:'',days:5},
{code:'Item.01-10-2026.3',kind:'Item',createdAt:'01/10/2026 10:00:00',createdBy:'demo@spx.vn',imgOuter:'',imgProduct:'',description:'Demo item',note:'',status:'da_tim_bill',statusLabel:'Resolve',bill:'SPXVN1',days:5}
];
var state={items:[],detail:null,liq:[],kind:'Box',lastCreated:''};
function hasGs(){return typeof google!=='undefined'&&google.script&&google.script.run;}
function gs(fn,args){return new Promise(function(res,rej){
if(!hasGs()){rej(new Error('LOCAL'));return;}
try{google.script.run.withSuccessHandler(res).withFailureHandler(function(e){rej(new Error(e&&e.message||'GAS lỗi'));}))[fn].apply(null,args||[]);}catch(e){rej(e);}});}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function msg(id,t,ok){var e=document.getElementById(id);e.textContent=t||'';e.className='msg '+(t?(ok?'ok':'err'):'');}
function todayPart(){try{return new Intl.DateTimeFormat('vi-VN',{timeZone:'Asia/Ho_Chi_Minh',day:'2-digit',month:'2-digit',year:'numeric'}).format(new Date()).replace(/\//g,'-');}catch(e){var d=new Date();return('0'+d.getDate()).slice(-2)+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+d.getFullYear();}}
function parseCreated(s){var m=String(s||'').match(/(\d{2})\/(\d{2})\/(\d{4})(?: (\d{2}):(\d{2})(?::(\d{2}))?)?/);if(!m)return null;return new Date(+m[3],+m[2]-1,+m[1],+(m[4]||0),+(m[5]||0));}
function daysOf(c){var d=parseCreated(c);if(!d)return 0;return Math.max(0,Math.floor((Date.now()-d.getTime())/86400000));}
function thumb(it){return it.imgProduct||it.imgOuter||'';}
function stClass(s){return s==='da_tim_bill'?'Resolve':(s==='thanh_ly'?'thanhly':'');}

async function loadGrid(){
msg('msgMain','Đang tải…',true);
try{
var r=await gs('listItems',[300]);
if(!r.ok)throw new Error(r.error);
state.items=r.data;
}catch(e){state.items=DEMO.slice();}
state.items.forEach(function(it){if(it.days==null)it.days=daysOf(it.createdAt);});
renderGrid();msg('msgMain','',true);
}
function renderGrid(){
var g=document.getElementById('grid');g.innerHTML='';
state.items.forEach(function(it){
var d=document.createElement('div');d.className='card';
var src=thumb(it);
d.innerHTML='<img alt="" src="'+esc(src)+'"><div class="body"><div class="code">'+esc(it.code)+'<span class="days">'+esc(it.days)+' ngày</span></div><div><span class="st '+stClass(it.status)+'">'+esc(it.statusLabel||it.status)+'</span></div><div class="meta">'+esc(it.createdAt||'')+'</div></div>';
var im=d.querySelector('img');im.onerror=function(){im.style.display='none';};
im.onclick=function(){openDetail(it.code);};
g.appendChild(d);
});
}

async function openDetail(code){
msg('msgDetail','Đang tải…',true);
document.getElementById('detailModal').classList.add('open');
try{
var r=await gs('getItem',[code]);
if(!r.ok)throw new Error(r.error);
state.detail=r.data;
}catch(e){
var f=state.items.filter(function(x){return x.code===code;})[0]||{code:code};
state.detail={item:f,history:[]};
}
var it=state.detail.item;
var h='<table>'+
'<tr><th>Mã đơn</th><td>'+esc(it.code)+'</td></tr>'+
'<tr><th>Loại</th><td>'+esc(it.kind||'')+'</td></tr>'+
'<tr><th>Ngày tạo</th><td>'+esc(it.createdAt||'')+' ('+esc(daysOf(it.createdAt)+' ngày lưu kho')+')</td></tr>'+
'<tr><th>Người tạo</th><td>'+esc(it.createdBy||'')+'</td></tr>'+
'<tr><th>Mô tả</th><td>'+esc(it.description||'')+'</td></tr>'+
'<tr><th>Ghi chú</th><td>'+esc(it.note||'')+'</td></tr>'+
'<tr><th>Trạng thái</th><td>'+esc(it.statusLabel||it.status||'')+'</td></tr></table>';
if(it.imgOuter)h+='<div>Ảnh Ngoại Quan</div><img class="big" src="'+esc(it.imgOuter)+'">';
if(it.imgProduct)h+='<div>Ảnh Sản Phẩm</div><img class="big" src="'+esc(it.imgProduct)+'">';
document.getElementById('detailBody').innerHTML=h;
var hs=state.detail.history||[];
var hh='<b>Resolve / Thanh Lý (riêng, không đè người tạo):</b>';
if(!hs.length)hh+='<div>Chưa có.</div>';
hs.forEach(function(x){hh+='<div>'+esc(x.at)+' · '+esc(x.from)+' → '+esc(x.to)+' · '+esc(x.by)+' · '+esc(x.note||'')+'</div>';});
document.getElementById('detailHist').innerHTML=hh;
document.getElementById('resolveBill').value='';
msg('msgDetail','',true);
}

async function doResolve(){
var code=state.detail&&state.detail.item&&state.detail.item.code;
var bill=document.getElementById('resolveBill').value.trim();
if(!bill){msg('msgDetail','Vui lòng nhập mã bill xử lý.');return;}
msg('msgDetail','Đang xử lý…',true);
try{
var r=await gs('resolveItem',[code,bill]);
if(!r.ok)throw new Error(r.error);
msg('msgDetail','Đã chuyển '+code+' sang Resolve.',true);
await loadGrid();await openDetail(code);
}catch(e){msg('msgDetail',e.message||'Lỗi resolve');}
}

function doPrint(code){
document.getElementById('printCode').textContent=code;
var q=document.getElementById('qrBox');q.innerHTML='';
try{if(typeof QRCode!=='undefined'){new QRCode(q,{text:code,width:220,height:220});}else{q.textContent=code;}}catch(e){q.textContent=code;}
setTimeout(function(){window.print();},150);
}

function bindFile(inputId,prevId,store){
var inp=document.getElementById(inputId);
inp.onchange=function(){
var f=inp.files&&inp.files[0];if(!f)return;
var img=new Image();
var url=URL.createObjectURL(f);
img.onload=function(){
var max=1280,sc=Math.min(1,max/Math.max(img.width,img.height));
var c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
c.getContext('2d').drawImage(img,0,0,c.width,c.height);
var du=c.toDataURL('image/jpeg',0.82);
store.dataUrl=du;
var p=document.getElementById(prevId);p.src=du;p.style.display='block';
URL.revokeObjectURL(url);
};
img.src=url;
};
}
var boxOuter={dataUrl:''},boxProduct={dataUrl:''},itemProduct={dataUrl:''};

async function refreshPreview(){
var dp=todayPart();
try{
var r=await gs('previewCode',['Box']);
document.getElementById('boxCode').value=r.ok?r.data.code:('Box.'+dp+'.(tự sinh)');
var r2=await gs('previewCode',['Item']);
document.getElementById('itemCode').value=r2.ok?r2.data.code:('Item.'+dp+'.(tự sinh)');
}catch(e){
document.getElementById('boxCode').value='Box.'+dp+'.(tự sinh)';
document.getElementById('itemCode').value='Item.'+dp+'.(tự sinh)';
}
}

async function submitCreate(){
var isBox=state.kind==='Box';
var payload;
if(isBox){payload={description:document.getElementById('boxDesc').value.trim(),note:document.getElementById('boxNote').value.trim(),outerDataUrl:boxOuter.dataUrl,productDataUrl:boxProduct.dataUrl};}
else{payload={description:document.getElementById('itemDesc').value.trim(),note:'',productDataUrl:itemProduct.dataUrl};}
if(!payload.description){msg('msgCreate','Vui lòng nhập mô tả sản phẩm.');return;}
if(isBox&&!payload.outerDataUrl){msg('msgCreate','Box cần Ảnh Ngoại Quan.');return;}
if(!payload.productDataUrl){msg('msgCreate',isBox?'Box cần Ảnh Sản Phẩm.':'Item cần Ảnh Sản Phẩm.');return;}
msg('msgCreate','Đang tạo…',true);
try{
var r=await gs(isBox?'createBox':'createItem',[payload]);
if(!r.ok)throw new Error(r.error);
state.lastCreated=r.data.code;
msg('msgCreate','Đã tạo '+r.data.code,true);
await loadGrid();await refreshPreview();
doPrint(r.data.code);
}catch(e){msg('msgCreate',e.message||'Lỗi tạo mã');}
}

function renderLiq(){
var ul=document.getElementById('liqList');ul.innerHTML='';
state.liq.forEach(function(c,i){
var li=document.createElement('li');
li.innerHTML='<span style="flex:1">'+esc(c)+'</span>';
var b=document.createElement('button');b.textContent='Xóa';
b.onclick=function(){state.liq.splice(i,1);renderLiq();};
li.appendChild(b);ul.appendChild(li);
});
document.getElementById('btnNext').disabled=!state.liq.length;
}
function liqStatusOf(code){
var f=state.items.filter(function(x){return x.code===code;})[0];
return f?f.status:'';
}
async function liqAdd(code){
code=String(code||'').trim();if(!code)return;
var found=null;
try{var r=await gs('getItem',[code]);if(r.ok)found=r.data.item;}catch(e){}
if(!found)found=state.items.filter(function(x){return x.code===code;})[0];
if(!found){msg('msgLiq','Không Có: '+code);return;}
var st=found.status||'chua_xu_ly';
if(st==='thanh_ly'){msg('msgLiq','Đã Thanh Lý: '+code);return;}
if(st==='da_tim_bill'){msg('msgLiq','Đã Resolve: '+code);return;}
if(st!=='chua_xu_ly'){msg('msgLiq','Không cho thanh lý ('+(found.statusLabel||st)+'): '+code);return;}
if(state.liq.indexOf(code)>=0){msg('msgLiq','Trùng (đã có trong danh sách): '+code);return;}
state.liq.push(code);renderLiq();
msg('msgLiq','Thành công: '+code,true);
}
async function liqDone(){
var liqCode=document.getElementById('liqCode').value.trim();
if(!liqCode){msg('msgLiq','Bắt buộc phải có mã thanh lý mới có thể Hoàn Thành.');return;}
msg('msgLiq','Đang xử lý…',true);
try{
var r=await gs('liquidateBatch',[state.liq,liqCode]);
if(!r.ok)throw new Error(r.error);
msg('msgLiq','Đã thanh lý '+r.data.count+' mã ('+r.data.liqCode+').',true);
state.liq=[];renderLiq();
document.getElementById('liqCodeWrap').style.display='none';
document.getElementById('liqCode').value='';
await loadGrid();
}catch(e){msg('msgLiq',e.message||'Lỗi thanh lý');}
}

var qr=null;
function toggleCam(inputId){
var rd=document.getElementById('reader');
var show=rd.style.display==='none';
rd.style.display=show?'block':'none';
if(!show){try{qr&&qr.stop();}catch(e){}return;}
if(typeof Html5Qrcode==='undefined'){msg('msgMain','Không tải được camera lib.');rd.style.display='none';return;}
qr=new Html5Qrcode('reader');
qr.start({facingMode:'environment'},{fps:10,qrbox:250},
function(txt){document.getElementById(inputId).value=txt;
if(inputId==='scanLiq')liqAdd(txt);else openDetail(txt);
try{qr.stop();}catch(e){}rd.style.display='none';},
function(){}).catch(function(){msg('msgMain','Không mở được camera (cần HTTPS). Nhập tay hoặc dùng súng.');});
}

window.addEventListener('DOMContentLoaded',function(){
loadGrid();
bindFile('boxOuter','boxOuterPrev',boxOuter);
bindFile('boxProduct','boxProductPrev',boxProduct);
bindFile('itemProduct','itemProductPrev',itemProduct);
document.getElementById('btnCreate').onclick=function(){document.getElementById('createModal').classList.add('open');refreshPreview();};
document.getElementById('btnCloseCreate').onclick=function(){document.getElementById('createModal').classList.remove('open');};
document.getElementById('tabBox').onclick=function(){state.kind='Box';document.getElementById('formBox').style.display='block';document.getElementById('formItem').style.display='none';};
document.getElementById('tabItem').onclick=function(){state.kind='Item';document.getElementById('formBox').style.display='none';document.getElementById('formItem').style.display='block';};
document.getElementById('tabNonAwb').onclick=function(){document.getElementById('paneNonAwb').style.display='block';};
document.getElementById('tabLiqGo').onclick=function(){document.getElementById('createModal').classList.remove('open');showLiq(true);};
document.getElementById('btnBoxDone').onclick=submitCreate;
document.getElementById('btnItemDone').onclick=function(){state.kind='Item';submitCreate();};
document.getElementById('btnBoxPrint').onclick=function(){if(state.lastCreated)doPrint(state.lastCreated);};
document.getElementById('btnCloseDetail').onclick=function(){document.getElementById('detailModal').classList.remove('open');};
document.getElementById('btnResolve').onclick=doResolve;
document.getElementById('btnPrintDetail').onclick=function(){if(state.detail)doPrint(state.detail.item.code);};
document.getElementById('navMain').onclick=function(){showLiq(false);};
document.getElementById('navLiq').onclick=function(){showLiq(true);};
document.getElementById('scanMain').addEventListener('keydown',function(e){if(e.key==='Enter')openDetail(e.target.value.trim());});
document.getElementById('scanLiq').addEventListener('keydown',function(e){if(e.key==='Enter'){liqAdd(e.target.value.trim());e.target.value='';}});
document.getElementById('btnNext').onclick=function(){document.getElementById('liqCodeWrap').style.display='block';};
document.getElementById('btnLiqDone').onclick=liqDone;
document.getElementById('camMain').onclick=function(){toggleCam('scanMain');};
document.getElementById('camLiq').onclick=function(){toggleCam('scanLiq');};
function showLiq(on){document.getElementById('viewLiq').style.display=on?'block':'none';document.getElementById('viewMain').style.display=on?'none':'block';}
});
</script>
</body>
</html>
