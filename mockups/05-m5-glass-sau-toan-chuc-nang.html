<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPX Exception Handling — Mẫu 5 · Glass sâu + FAB — đủ mọi chức năng, bảng kính mờ redesign</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Be Vietnam Pro',system-ui,-apple-system,sans-serif;background:#12151b;color:#dde3ee;-webkit-font-smoothing:antialiased}
#bar{position:sticky;top:0;z-index:99;background:rgba(18,21,27,.94);backdrop-filter:blur(12px);border-bottom:1px solid #262b35;padding:9px 14px 8px}
#bar .row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
#bar .lab{font-size:10px;font-weight:800;letter-spacing:.06em;color:#7e8798;text-transform:uppercase}
.tchip{border:1px solid #2b313d;background:#1a1f28;color:#b9c2d4;font-size:10.5px;font-weight:700;padding:5px 10px;border-radius:99px;cursor:pointer;font-family:inherit}
.tchip.on{background:#43506a;color:#fff;border-color:#5b6c92}
.tchip:hover{border-color:#54637c}
#devBox{margin-left:auto}
.dbtn{border:1px solid #2b313d;background:#1a1f28;color:#b9c2d4;font-size:10.5px;font-weight:700;padding:5px 12px;cursor:pointer;font-family:inherit}
.dbtn:first-of-type{border-radius:99px 0 0 99px}.dbtn:last-of-type{border-radius:0 99px 99px 0;border-left:none}
.dbtn.on{background:#dfe4f2;color:#12151b;border-color:#dfe4f2}
#mockNote{width:100%;font-size:11px;color:#8b93a6;margin-top:2px}
#mockNote b{color:#fff}
#stageWrap{padding:20px 14px 36px;display:flex;justify-content:center}

/* ===== stage — Glass sâu (Mẫu 5, chốt 1 chủ đề) ===== */
/* token cũng đặt ở :root để modal/popover/toast (nằm ngoài .stage) kế thừa đúng màu */
:root{--bg:transparent;--card:rgba(255,255,255,.5);--panel:rgba(255,255,255,.55);--line:rgba(255,255,255,.85);--txt:#172b48;--mut:#8b94a6;--ink:#303844;--brand:#172b48;--acc:#ee4d2d;--inp:rgba(255,255,255,.78);--r:34px;--r2:24px;--lineW:1px;--blur:26px;--shadow:0 8px 32px rgba(35,42,69,.10);
 --sideBg:rgba(23,43,72,.82);--sideTxt:#c3cfe4;--stO:#ee4d2d;--stOb:rgba(255,245,240,.9);--stR:#0d9a50;--stRb:rgba(233,250,240,.92);--stL:#3274f7;--stLb:rgba(238,244,255,.92);--stA:#f79009;--stAb:rgba(255,244,229,.95);--phBox:rgba(240,241,244,.9);--phItem:rgba(237,241,247,.9)}
.stage{position:relative;width:100%;max-width:1440px;
 --bg:transparent;--card:rgba(255,255,255,.5);--panel:rgba(255,255,255,.55);--line:rgba(255,255,255,.85);--txt:#172b48;--mut:#8b94a6;--ink:#303844;--brand:#172b48;--acc:#ee4d2d;--inp:rgba(255,255,255,.78);--r:34px;--r2:24px;--lineW:1px;--blur:26px;--shadow:0 8px 32px rgba(35,42,69,.10);
 --sideBg:rgba(23,43,72,.82);--sideTxt:#c3cfe4;--stO:#ee4d2d;--stOb:rgba(255,245,240,.9);--stR:#0d9a50;--stRb:rgba(233,250,240,.92);--stL:#3274f7;--stLb:rgba(238,244,255,.92);--stA:#f79009;--stAb:rgba(255,244,229,.95);--phBox:rgba(240,241,244,.9);--phItem:rgba(237,241,247,.9);
 --pageBg:radial-gradient(1000px 560px at 12% -8%,#dfe4ff,transparent),radial-gradient(860px 520px at 95% 6%,#ffe3f1,transparent),radial-gradient(980px 640px at 60% 112%,#d9f8ef,transparent),#f2f4fa;color:var(--txt)}
.app{position:relative;overflow:hidden;background:transparent;height:calc(100vh - 108px);min-height:640px;display:flex;border-radius:var(--r);border:1px solid rgba(23,43,72,.1);isolation:isolate}
.app::before{content:"";position:absolute;inset:0;background:var(--pageBg);z-index:-1;filter:saturate(1.15)}
.glassy{backdrop-filter:blur(var(--blur)) saturate(1.35);-webkit-backdrop-filter:blur(var(--blur)) saturate(1.35)}
.card,.panelBox,.gcard,.fs .fbtn,.drawer,.gtw,.gtbar,.gpop,.jobrow,.carttot,.legend{backdrop-filter:blur(var(--blur)) saturate(1.4);-webkit-backdrop-filter:blur(var(--blur)) saturate(1.4)}
.panelBox,.gcard,.gtw,.jobrow,.carttot{border:1.5px solid rgba(255,255,255,.9);position:relative}
.panelBox::after,.gtw::after{content:"";position:absolute;inset:0 0 auto;height:130px;border-radius:inherit;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,0));opacity:.7}
.gcard:hover{transform:translateY(-3px);box-shadow:0 16px 40px rgba(238,77,45,.14)}
.inp:focus{outline:none;border-color:rgba(238,77,45,.55);box-shadow:0 0 0 4px rgba(238,77,45,.10)}
.btn{backdrop-filter:blur(10px);transition:transform .12s,box-shadow .15s}
.btn:hover{transform:translateY(-1px)}
.btn.pri{box-shadow:0 8px 22px rgba(238,77,45,.32);position:relative;overflow:hidden}
.btn.pri::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-20deg);animation:sheen 4.5s ease-in-out infinite}
@keyframes sheen{0%,72%{left:-60%}100%{left:130%}}
.drawer{background:linear-gradient(180deg,rgba(255,255,255,.8),rgba(255,255,255,.6));border-left:1px solid rgba(255,255,255,.9)}
.srch{backdrop-filter:blur(12px);box-shadow:0 4px 18px rgba(35,42,69,.08)}
.side{backdrop-filter:blur(18px) saturate(1.3)}
.stage[data-device=mobile]{max-width:430px}
.stage[data-device=mobile] .app{width:390px;height:844px;border-radius:40px;border:10px solid #0b0e13;box-shadow:0 30px 80px rgba(0,0,0,.5)}

/* ===== shell ===== */
.side{flex:none;width:218px;background:var(--sideBg);color:var(--sideTxt);display:flex;flex-direction:column;padding:12px 9px;gap:2px;position:relative;z-index:6;overflow:auto}
.side .brand{display:flex;gap:9px;align-items:center;padding:4px 8px 12px}
.side .logo{width:28px;height:28px;flex:none;border-radius:9px;background:var(--acc);color:#fff;font-weight:800;font-size:10.5px;display:grid;place-items:center}
.side .bt{font-size:11.5px;font-weight:800;color:#fff;line-height:1.2}
.side .bt small{display:block;font-size:8.5px;font-weight:600;color:var(--sideTxt);letter-spacing:.05em;text-transform:uppercase}
.side .sec{margin-top:9px;padding:4px 10px;font-size:8.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:rgba(255,255,255,.35)}
.navi{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:10px;color:var(--sideTxt);font-size:11px;font-weight:700;cursor:pointer;border:none;background:transparent;width:100%;text-align:left;font-family:inherit}
.navi i{font-style:normal;width:17px;text-align:center;font-size:12.5px}
.navi:hover{color:#fff;background:rgba(255,255,255,.06)}
.navi.on{color:#fff;background:rgba(255,255,255,.13)}
.navi .nb{margin-left:auto;font-size:8.5px;background:rgba(255,255,255,.12);padding:1px 6px;border-radius:99px}
.sreset{margin-top:6px;border:1px dashed rgba(255,255,255,.28);background:transparent;color:var(--sideTxt);border-radius:10px;padding:7px;font-size:10px;font-weight:800;cursor:pointer;font-family:inherit}
.sreset:hover{color:#fff;border-color:rgba(255,255,255,.6)}
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.hdr{display:grid;grid-template-columns:1fr minmax(0,440px) 1fr;align-items:center;gap:10px;padding:9px 14px;background:var(--panel);border-bottom:var(--lineW) solid var(--line);backdrop-filter:blur(var(--blur));z-index:5}
.hdr .hh{font-size:12.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:7px;color:var(--brand)}
.hdr .hh .lg{width:23px;height:23px;flex:none;border-radius:7px;background:var(--acc);color:#fff;font-weight:800;font-size:9px;display:grid;place-items:center}
.srch{display:flex;align-items:center;gap:8px;background:var(--inp);border:1.5px solid var(--line);border-radius:99px;padding:3px 5px 3px 12px}
.srch input{flex:1;min-width:0;border:none;background:transparent;font-size:12px;font-weight:600;color:var(--txt);font-family:inherit;padding:6px 0}
.srch input:focus{outline:none}
.acts{display:flex;gap:6px;justify-content:flex-end;align-items:center}
.abtn{width:32px;height:32px;border-radius:99px;border:var(--lineW) solid var(--line);background:var(--panel);font-size:13px;cursor:pointer;position:relative;color:var(--ink)}
.uchip{display:flex;align-items:center;gap:6px;border:var(--lineW) solid var(--line);background:var(--panel);border-radius:99px;padding:3px 10px 3px 3px;font-size:10.5px;font-weight:800;color:var(--ink)}
.uchip .av{width:23px;height:23px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:9px;font-weight:800}
/* Display Range bar */
.rbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;padding:8px 14px;font-size:10.5px;font-weight:700;color:var(--mut);border-bottom:var(--lineW) solid var(--line);background:rgba(255,255,255,.34);backdrop-filter:blur(14px);z-index:4}
.rbar b{color:var(--brand);font-size:11px}
.rbar .cap{flex:1;min-width:180px;font-size:9.5px;font-weight:600;color:var(--mut);line-height:1.35}
.content{flex:1;overflow:auto;position:relative;display:flex;flex-direction:column;min-height:0}
.view{flex:1;overflow:auto;padding:14px 16px 26px;display:none;flex-direction:column;gap:10px}
.view.on{display:flex}

/* ===== shared bits ===== */
.btn{border:var(--lineW) solid var(--line);background:var(--panel);color:var(--ink);border-radius:99px;padding:8px 14px;font-size:11px;font-weight:800;cursor:pointer;font-family:inherit;white-space:nowrap}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.navy{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.green{background:var(--stR);border-color:var(--stR);color:#fff}
.btn:disabled{opacity:.45;cursor:default;transform:none!important;box-shadow:none}
.btn.mini{padding:5px 10px;font-size:10px}
.pill{border:var(--lineW) solid var(--line);background:var(--panel);color:var(--mut);border-radius:99px;padding:6px 12px;font-size:10.5px;font-weight:800;cursor:pointer;font-family:inherit;display:inline-flex;gap:5px;align-items:center}
.pill .dt{width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.pill .cnt{font-size:9px;opacity:.75}
.panelBox{background:var(--card);border-radius:var(--r2);padding:15px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:11px;color:var(--txt)}
.panelBox h3{font-size:13px;font-weight:800}
.ctx{font-size:10px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;line-height:1.5}
.inp{border:1.5px solid var(--line);border-radius:99px;background:var(--inp);color:var(--txt);padding:11px 16px;font-size:13px;font-family:inherit;font-weight:700;width:100%}
.inp.mono{font-family:ui-monospace,'JetBrains Mono',monospace;letter-spacing:.02em}
.chip{font-size:9.5px;font-weight:800;padding:4px 9px;border-radius:99px;white-space:nowrap}
.sO{background:var(--stOb);color:var(--stO)}.sR{background:var(--stRb);color:var(--stR)}.sL{background:var(--stLb);color:var(--stL)}.sA{background:var(--stAb);color:var(--stA)}
.scanrow{display:flex;gap:8px}
.empty{padding:34px 16px;text-align:center;color:var(--mut);font-size:12px;font-weight:700;line-height:1.7}
.pills{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.pills .sep{width:1px;height:18px;background:var(--line);margin:0 3px}
.msg{font-size:10.5px;font-weight:800;color:var(--stR);line-height:1.5}
.msg.er{color:var(--stO)}
.mtxWrap{max-width:1080px;margin:0 auto;width:100%}
.label46{background:#fff;color:#111;border:1px solid #d8dce3;border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:5px;align-items:center;width:170px}
.label46 .cd{font-size:12px;font-weight:800}
.label46 .sub{font-size:8px;text-transform:uppercase;letter-spacing:.1em;color:#667}
.labelsGrid{display:flex;gap:9px;flex-wrap:wrap}
textarea.inp{border-radius:20px;min-height:80px;resize:vertical;font-size:12px;padding:12px 15px}

/* ===== HỆ BẢNG KÍNH MỜ — redesign ===== */
.gtw{background:linear-gradient(165deg,rgba(255,255,255,.74),rgba(255,255,255,.44) 55%,rgba(255,255,255,.58));border-radius:26px;box-shadow:0 18px 50px rgba(35,42,69,.15),inset 0 1px 0 rgba(255,255,255,.9);overflow:hidden;color:var(--txt)}
.gtw.compact{border-radius:20px}
.blsrch{display:flex;justify-content:center;margin:0 auto 10px}
.blsrch .srch{width:min(680px,100%);background:rgba(255,255,255,.62)}
.gtbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.7);background:rgba(255,255,255,.3);position:relative;z-index:3}
.gtbar .lab{font-size:9px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--mut)}
.cpill{border:1px solid rgba(255,255,255,.8);background:rgba(255,255,255,.5);color:var(--mut);border-radius:99px;padding:4px 10px;font-size:9.5px;font-weight:800;cursor:pointer;font-family:inherit;display:inline-flex;gap:5px;align-items:center;white-space:nowrap}
.cpill.on{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 4px 12px rgba(23,43,72,.22)}
.cpill.on::before{content:"✓";font-size:8px}
.cpill.hid{opacity:.55;text-decoration:line-through}
.gtb{overflow:auto;position:relative;z-index:1;max-height:var(--gth,none);overscroll-behavior-x:contain}
table.gt{width:100%;border-collapse:separate;border-spacing:0;font-size:11.5px}
.gt thead th{position:sticky;top:0;z-index:4;text-align:left;padding:11px 12px;font-size:9px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);white-space:nowrap;
 background:linear-gradient(180deg,rgba(255,255,255,.94),rgba(255,255,255,.72));backdrop-filter:blur(22px) saturate(1.4);border-bottom:1px solid rgba(255,255,255,.95);box-shadow:0 8px 18px rgba(35,42,69,.07);cursor:pointer;user-select:none}
.gt thead th:hover{color:var(--brand)}
.gt thead th.act{color:var(--brand);background:linear-gradient(180deg,rgba(255,255,255,.98),rgba(238,244,255,.85))}
.gt thead th.num{text-align:right}
.gt .sd{font-size:9px;opacity:.5;margin-left:3px}
.gt th.act .sd,.gt th.sorted .sd{opacity:1;color:var(--acc)}
.gt .fdot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--stL);margin-left:4px;box-shadow:0 0 0 3px rgba(50,116,247,.2)}
.gt tbody td{padding:11px 12px;border-bottom:1px solid rgba(255,255,255,.42);white-space:nowrap;color:var(--txt);background:transparent}
.gt tbody tr:nth-child(even) td{background:rgba(255,255,255,.3)}
.gt tbody tr{cursor:pointer;transition:background .12s}
.gt tbody tr:hover td{background:rgba(255,255,255,.68);box-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.6)}
.gt tbody tr.sel td{background:linear-gradient(90deg,rgba(238,77,45,.14),rgba(255,255,255,.55))}
.gt tbody tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--acc)}
.gt td.pin,.gt th.pin{position:sticky;left:0;z-index:3;background:linear-gradient(90deg,rgba(255,255,255,.92),rgba(255,255,255,.7));backdrop-filter:blur(18px) saturate(1.3);box-shadow:6px 0 14px rgba(35,42,69,.06)}
.gt th.pin{z-index:6}
.gt tbody tr.sel td.pin{background:linear-gradient(90deg,rgba(255,228,220,.95),rgba(255,255,255,.7))}
.gt td.sid{font-weight:800;color:var(--brand);font-family:ui-monospace,monospace;font-size:11px}
.gt td.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:800}
.gt td.wrapw{white-space:normal;max-width:230px;overflow:hidden;text-overflow:ellipsis;line-height:1.4}
.gt .mut{color:var(--mut);font-weight:600}
.gt .mini2{font-size:9px;font-weight:800;color:var(--mut)}
.aging{display:inline-flex;align-items:center;gap:5px;font-weight:800;font-size:10px;padding:3px 9px;border-radius:99px}
.aging .bar{width:26px;height:4px;border-radius:99px;background:rgba(23,43,72,.12);overflow:hidden}
.aging .bar i{display:block;height:100%;border-radius:99px}
.gtfoot{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:11px 14px;border-top:1px solid rgba(255,255,255,.85);background:linear-gradient(180deg,rgba(255,255,255,.42),rgba(255,255,255,.62));font-size:11px;font-weight:800;color:var(--brand);position:relative;z-index:2}
.gtfoot .sp{margin-left:auto;color:var(--mut);font-weight:700}
.pg{display:flex;gap:5px;align-items:center;justify-content:center;padding:9px 12px;flex-wrap:wrap}
.pg button{min-width:26px;height:26px;border-radius:9px;border:1px solid rgba(255,255,255,.8);background:rgba(255,255,255,.5);font-size:10px;font-weight:800;color:var(--ink);cursor:pointer;font-family:inherit}
.pg button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.pg button:disabled{opacity:.4;cursor:default}
.gpop{position:fixed;z-index:300;width:250px;background:rgba(255,255,255,.86);backdrop-filter:blur(24px) saturate(1.5);border:1.5px solid rgba(255,255,255,.95);border-radius:20px;box-shadow:0 26px 60px rgba(23,43,72,.28);padding:12px;display:none;flex-direction:column;gap:8px;color:var(--txt)}
.gpop.on{display:flex}
.gpop h4{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.gpop .opt{display:flex;align-items:center;gap:8px;padding:6px 7px;border-radius:10px;font-size:11px;font-weight:700;cursor:pointer}
.gpop .opt:hover{background:rgba(255,255,255,.8)}
.gpop .opt .bx{width:16px;height:16px;border-radius:5px;border:1.5px solid rgba(23,43,72,.25);display:grid;place-items:center;font-size:9px;color:#fff;background:rgba(255,255,255,.7);flex:none}
.gpop .opt.on .bx{background:var(--acc);border-color:var(--acc)}
.gpop .opt .c{margin-left:auto;font-size:9px;color:var(--mut);font-weight:800}
.gpop .lst{max-height:210px;overflow:auto;display:flex;flex-direction:column;gap:1px}
.gpop .row2{display:flex;gap:6px}
.hiddenTag{font-size:8.5px;font-weight:800;color:var(--stA);background:var(--stAb);padding:2px 6px;border-radius:99px}

/* ===== danh sách: lưới card 4:5 + sidebar lọc ===== */
.split2{flex:1;display:flex;min-height:0;overflow:hidden}
.fs{width:222px;flex:none;padding:14px;display:flex;flex-direction:column;gap:7px;border-right:var(--lineW) solid var(--line);background:var(--panel);overflow:auto}
.fs .sec2{font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-top:7px}
.fbtn{display:flex;align-items:center;gap:8px;border:var(--lineW) solid var(--line);background:var(--card);border-radius:14px;padding:8px 11px;font-size:11px;font-weight:700;cursor:pointer;color:var(--txt);font-family:inherit;width:100%;text-align:left}
.fbtn.on{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc);background:var(--stOb);color:var(--stO)}
.fbtn .nb{margin-left:auto;font-size:9px;font-weight:800;color:var(--mut)}
.dotst{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:11px}
.dotst i{width:8px;height:8px;border-radius:50%;font-style:normal}
.fgwrap{flex:1;min-width:0;overflow:auto;padding:14px 16px 26px;display:flex;flex-direction:column;gap:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:13px}
.gcard{background:var(--card);border-radius:var(--r2);overflow:hidden;cursor:pointer;box-shadow:var(--shadow);transition:transform .14s;border:1px solid rgba(255,255,255,.75)}
.gcard .ph{aspect-ratio:4/5;display:grid;place-items:center;font-size:56px;position:relative;background:var(--ph)}
.gcard .ph .chip{position:absolute;top:9px;left:9px}
.gcard .ph .kd{position:absolute;top:9px;right:9px;font-size:8.5px;font-weight:800;background:rgba(23,43,72,.55);color:#fff;padding:3px 8px;border-radius:99px;letter-spacing:.05em;backdrop-filter:blur(8px)}
.gcard .ct{padding:10px 12px;display:flex;flex-direction:column;gap:3px;position:relative;z-index:1}
.gcard .ct b{font-size:10.5px;color:var(--brand);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

function calGrid(y,m){var first=new Date(y,m,1),wd=(first.getDay()+6)%7,dim=new Date(y,m+1,0).getDate(),cells='';

  cells+='<button class="'+cls+'" data-act="calDay" data-id="'+y+'-'+m+'-'+d+'">'+d+'</button>'}

var STATION='PC-KHO-'+('0'+(7)).slice(-2),stTimer=null;
function pushJob(codes){var j={id:'J-'+(4025+PRINTQ.length),codes:codes,status:S.pn.station?'printing':'pending',station:S.pn.station?STATION:'—',at:nowT().slice(0,16)};
 PRINTQ.push(j);return j}
function printFeed(code){code=String(code||'').trim();
 if(!can('print')){S.pn.hint='Staff chưa được tích quyền In Mã — bảng Role do ADMIN mở.';render();return}
 if(!/^(Box|Item)\.\d{2}-\d{2}-\d{4}\.\d+$/.test(code)){S.pn.hint='Chưa đúng định dạng — cần Box.… hoặc Item.… (ngày-tháng-năm.số).';render();return}
 var j=pushJob([code]);
 S.pn.hint='Đúng định dạng — đã gửi '+code+' tới trạm in…';S.pn.job=j;
 if(S.pn.station){setTimeout(function(){j.status='done';S.pn.hint='Đã in: <b>'+code+'</b> (khổ 4×6in).';S.pn.last=code;render()},1100)}
 else setTimeout(function(){S.pn.hint='Đã gửi: <b>'+code+'</b> tới trạm in (laptop mở tab In Mã sẽ tự in). — chờ laptop in.';render()},500);
 render()}
function printBulkGo(kind){var codes=[];for(var i=0;i<10;i++)codes.push(kind+'.13-10-2026.'+(seq++));
 S.pn.kind=kind;S.pn.mode='bulk';S.pn.codes=codes;S.pn.hint='Server đang sinh 10 mã '+kind+'…';$('maskKind').classList.remove('on');
 var j=pushJob(codes);
 if(S.pn.station){setTimeout(function(){j.status='done';S.pn.hint='Đã in 10 mã: <b>'+codes[0]+' → '+codes[9]+'</b>.';S.pn.last=codes[0];render()},1400)}
 else setTimeout(function(){S.pn.hint='Đã giữ chỗ 10 mã '+kind+' — tự in '+codes[0]+' → '+codes[9]+' (1 lệnh in, khổ 4×6in).';render()},700);
 render()}
function startStation(){if(stTimer)return;stTimer=setInterval(stationTick,3000)}
function stationTick(){var p=PRINTQ.filter(function(j){return j.status==='pending'});
 if(!p.length)return;var j=p[0];j.status='printing';j.station=STATION;
 S.pn.hint='Nhận lệnh từ điện thoại — đang in '+j.codes.length+' mã…';render();
 setTimeout(function(){j.status='done';
  S.pn.hint='Trạm đã in xong: <b>'+j.codes[0]+(j.codes.length>1?' → '+j.codes[j.codes.length-1]:'')+'</b>.';S.pn.last=j.codes[0];render()},1300)}

 toggleRole:function(el){if(!(isAdm()&&can('role'))){toast('Staff không đổi được vai trò');return}
  USERS[+el.dataset.id].role=USERS[+el.dataset.id].role==='ADMIN'?'STAFF':'ADMIN';render();toast('Đã đổi vai trò '+USERS[+el.dataset.id].email)},
 addUserForm:function(){var i=$('newEmail');if(i)i.focus()},
 addUser:function(){var i=$('newEmail'),v=i?i.value.trim().toLowerCase():'';
  if(!v){toast('Nhập email cần thêm.');return}
  if(USERS.filter(function(u){return u.email===v}).length){toast('Email đã có trong danh sách.');return}
  USERS.push({email:v,role:'ADMIN',fine:{create:true,photo:true,note:true,resolve:true,editFull:true,blView:true,blExport:true,liqAdd:true,liq:true,print:true,printBulk:true,role:true,adminReply:true}});
  render();toast('Đã thêm '+v+' (ADMIN).')},
 delUser:function(el){var u=USERS[+el.dataset.id];if(!u)return;
  if(u.email===ME()){toast('Không tự xóa chính mình.');return}
  if(u.role==='ADMIN'&&USERS.filter(function(x){return x.role==='ADMIN'}).length<=1){toast('Không thể xóa ADMIN cuối cùng.');return}
  USERS.splice(+el.dataset.id,1);render();toast('Đã xóa '+u.email+'.')}
};
function openEditFor(code,presetSt){var it=find(code);if(!it)return;
 EM={code:code,st:presetSt||null,bill:it.bill||'',reason:'',photos:0,desc:it.desc,note:it.note||''};
 renderEdit();if(presetSt){var r=$('emReason');if(r)setTimeout(function(){r.focus()},120)}}

/* ================= EVENTS ================= */
document.addEventListener('click',function(e){var el=e.target.closest('[data-act]');
 if(!el){if(!$('gpop').contains(e.target))$('gpop').classList.remove('on');return}
 var fn=A[el.dataset.act];if(!fn)return;e.stopPropagation();fn(el,e)});
document.addEventListener('input',function(e){var t=e.target;
 if(t.id==='q'){S.q=t.value;S.shown=12;render();
  var i=$('q');if(i&&i!==document.activeElement){i.focus();i.setSelectionRange(i.value.length,i.value.length)}}
 if(t.id==='cartIn')return});
document.addEventListener('keydown',function(e){
 if(e.key==='Escape'){closeDetail();$('gpop').classList.remove('on');
  ['maskCreate','maskEdit','maskRange','maskCam','maskFb','maskIntro','maskLeave','maskKind','maskPerms'].forEach(function(m){$(m).classList.remove('on')});
  $('lb').classList.remove('on');return}
 var t=e.target;if(e.key!=='Enter'||!/INPUT|TEXTAREA/.test(t.tagName))return;
 if(t.id==='blQ'){A.blKwGo();return}
if(t.id==='billIn'){A.resolveConfirm();return}
 if(t.id==='scanPrint'){A.printFeed();return}
 if(t.id==='scanLiq'||t.id==='cartIn'){var v=t.value.trim();t.value='';if(v)A.cartScanVal(v);return}
 if(t.id==='liqCode'){A.cartConfirm();return}
 if(t.id==='newEmail'){A.addUser();return}
 if(t.id==='fbIn'){A.fbSend();return}
 if(t.id==='popQ'&&$('gpop').dataset.kind==='search'){A.blOkS({dataset:{id:$('gpop').dataset.key}});return}});
$('lb').addEventListener('wheel',function(e){e.preventDefault();lbZoom(e.deltaY<0?1.15:1/1.15)});

setDevice('pc');S.tab='list';render();
