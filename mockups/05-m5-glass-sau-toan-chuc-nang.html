<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPX Exception Handling — Mẫu 5 · Liquid Glass — đúng nút, đúng logic, đúng dữ liệu của app thật</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Be Vietnam Pro',system-ui,-apple-system,sans-serif;background:#12151b;color:#dde3ee;-webkit-font-smoothing:antialiased}
#bar{position:sticky;top:0;z-index:99;background:rgba(18,21,27,.94);backdrop-filter:blur(12px);border-bottom:1px solid #262b35;padding:9px 14px 8px}
#bar .row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
#bar .lab{font-size:10px;font-weight:800;letter-spacing:.06em;color:#7e8798;text-transform:uppercase}
.tchip{border:1px solid #2b313d;background:#1a1f28;color:#b9c2d4;font-size:10.5px;font-weight:700;padding:5px 10px;border-radius:99px;cursor:pointer;font-family:inherit}
.tchip.on{background:#43506a;color:#fff;border-color:#5b6c92}
.tchip:hover{border-color:#54637c}
#devBox{margin-left:auto}
.dbtn{border:1px solid #2b313d;background:#1a1f28;color:#b9c2d4;font-size:10.5px;font-weight:700;padding:5px 12px;cursor:pointer;font-family:inherit}
.dbtn:first-of-type{border-radius:99px 0 0 99px}.dbtn:last-of-type{border-radius:0 99px 99px 0;border-left:none}
.dbtn.on{background:#dfe4f2;color:#12151b;border-color:#dfe4f2}
#mockNote{width:100%;font-size:11px;color:#8b93a6;margin-top:2px}
#mockNote b{color:#fff}
#stageWrap{padding:20px 14px 36px;display:flex;justify-content:center}

/* ===== stage — Glass sâu (Mẫu 5, chốt 1 chủ đề) ===== */
/* token cũng đặt ở :root để modal/popover/toast (nằm ngoài .stage) kế thừa đúng màu */
:root{--bg:transparent;--card:rgba(255,255,255,.5);--panel:rgba(255,255,255,.55);--line:rgba(255,255,255,.85);--txt:#172b48;--mut:#8b94a6;--ink:#303844;--brand:#172b48;--acc:#ee4d2d;--inp:rgba(255,255,255,.78);--r:34px;--r2:24px;--lineW:1px;--blur:26px;--shadow:0 8px 32px rgba(35,42,69,.10);
 --sideBg:rgba(23,43,72,.82);--sideTxt:#c3cfe4;--stO:#ee4d2d;--stOb:rgba(255,245,240,.9);--stR:#0d9a50;--stRb:rgba(233,250,240,.92);--stL:#3274f7;--stLb:rgba(238,244,255,.92);--stA:#f79009;--stAb:rgba(255,244,229,.95);--phBox:rgba(240,241,244,.9);--phItem:rgba(237,241,247,.9)}
.stage{position:relative;width:100%;max-width:1440px;
 --bg:transparent;--card:rgba(255,255,255,.5);--panel:rgba(255,255,255,.55);--line:rgba(255,255,255,.85);--txt:#172b48;--mut:#8b94a6;--ink:#303844;--brand:#172b48;--acc:#ee4d2d;--inp:rgba(255,255,255,.78);--r:34px;--r2:24px;--lineW:1px;--blur:26px;--shadow:0 8px 32px rgba(35,42,69,.10);
 --sideBg:rgba(23,43,72,.82);--sideTxt:#c3cfe4;--stO:#ee4d2d;--stOb:rgba(255,245,240,.9);--stR:#0d9a50;--stRb:rgba(233,250,240,.92);--stL:#3274f7;--stLb:rgba(238,244,255,.92);--stA:#f79009;--stAb:rgba(255,244,229,.95);--phBox:rgba(240,241,244,.9);--phItem:rgba(237,241,247,.9);
 --pageBg:radial-gradient(1000px 560px at 12% -8%,#dfe4ff,transparent),radial-gradient(860px 520px at 95% 6%,#ffe3f1,transparent),radial-gradient(980px 640px at 60% 112%,#d9f8ef,transparent),#f2f4fa;color:var(--txt)}
.app{position:relative;overflow:hidden;background:transparent;height:calc(100vh - 108px);min-height:640px;display:flex;border-radius:var(--r);border:1px solid rgba(23,43,72,.1);isolation:isolate}
.app::before{content:"";position:absolute;inset:0;background:var(--pageBg);z-index:-1;filter:saturate(1.15)}
.glassy{backdrop-filter:blur(var(--blur)) saturate(1.35);-webkit-backdrop-filter:blur(var(--blur)) saturate(1.35)}
.card,.panelBox,.gcard,.fs .fbtn,.drawer,.gtw,.gtbar,.gpop,.carttot,.legend{backdrop-filter:blur(var(--blur)) saturate(1.4);-webkit-backdrop-filter:blur(var(--blur)) saturate(1.4)}
.panelBox,.gcard,.gtw,.carttot{border:1.5px solid rgba(255,255,255,.9);position:relative}
.panelBox::after,.gtw::after{content:"";position:absolute;inset:0 0 auto;height:130px;border-radius:inherit;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,0));opacity:.7}
.gcard:hover{transform:translateY(-3px);box-shadow:0 16px 40px rgba(238,77,45,.14)}
.inp:focus{outline:none;border-color:rgba(238,77,45,.55);box-shadow:0 0 0 4px rgba(238,77,45,.10)}
.btn{backdrop-filter:blur(10px);transition:transform .12s,box-shadow .15s}
.btn:hover{transform:translateY(-1px)}
.btn.pri{box-shadow:0 8px 22px rgba(238,77,45,.32);position:relative;overflow:hidden}
.btn.pri::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-20deg);animation:sheen 4.5s ease-in-out infinite}
@keyframes sheen{0%,72%{left:-60%}100%{left:130%}}
.drawer{background:linear-gradient(180deg,rgba(255,255,255,.8),rgba(255,255,255,.6));border-left:1px solid rgba(255,255,255,.9)}
.srch{backdrop-filter:blur(12px);box-shadow:0 4px 18px rgba(35,42,69,.08)}
.side{backdrop-filter:blur(18px) saturate(1.3)}
.stage[data-device=mobile]{max-width:430px}
.stage[data-device=mobile] .app{width:390px;height:844px;border-radius:40px;border:10px solid #0b0e13;box-shadow:0 30px 80px rgba(0,0,0,.5)}

/* ===== shell ===== */
.side{flex:none;width:218px;transition:width .22s ease;background:var(--sideBg);color:var(--sideTxt);display:flex;flex-direction:column;padding:12px 9px;gap:2px;position:relative;z-index:6;overflow:auto}
.side .brand{display:flex;gap:9px;align-items:center;padding:4px 8px 12px}
.side .logo{width:28px;height:28px;flex:none;border-radius:9px;background:var(--acc);color:#fff;font-weight:800;font-size:10.5px;display:grid;place-items:center}
.side .bt{font-size:11.5px;font-weight:800;color:#fff;line-height:1.2}
.side .bt small{display:block;font-size:8.5px;font-weight:600;color:var(--sideTxt);letter-spacing:.05em;text-transform:uppercase}
.side .sec{margin-top:9px;padding:4px 10px;font-size:8.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:rgba(255,255,255,.35)}
.navi{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:10px;color:var(--sideTxt);font-size:11px;font-weight:700;cursor:pointer;border:none;background:transparent;width:100%;text-align:left;font-family:inherit}
.navi i{font-style:normal;width:17px;text-align:center;font-size:12.5px}
.navi:hover{color:#fff;background:rgba(255,255,255,.06)}
.navi.on{color:#fff;background:rgba(255,255,255,.13)}
.navi .nb{margin-left:auto;font-size:8.5px;background:rgba(255,255,255,.12);padding:1px 6px;border-radius:99px}
.sreset{margin-top:6px;border:1px dashed rgba(255,255,255,.28);background:transparent;color:var(--sideTxt);border-radius:10px;padding:7px;font-size:10px;font-weight:800;cursor:pointer;font-family:inherit}
.sreset:hover{color:#fff;border-color:rgba(255,255,255,.6)}
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.hdr{display:grid;grid-template-columns:1fr minmax(0,440px) 1fr;align-items:center;gap:10px;padding:9px 14px;background:var(--panel);border-bottom:var(--lineW) solid var(--line);backdrop-filter:blur(var(--blur));z-index:5}
.hdr .hh{font-size:12.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:7px;color:var(--brand)}
.hdr .hh .lg{width:23px;height:23px;flex:none;border-radius:7px;background:var(--acc);color:#fff;font-weight:800;font-size:9px;display:grid;place-items:center}
.srch{display:flex;align-items:center;gap:8px;background:var(--inp);border:1.5px solid var(--line);border-radius:99px;padding:3px 5px 3px 12px}
.srch input{flex:1;min-width:0;border:none;background:transparent;font-size:12px;font-weight:600;color:var(--txt);font-family:inherit;padding:6px 0}
.srch input:focus{outline:none}
.acts{display:flex;gap:6px;justify-content:flex-end;align-items:center}
.abtn{width:32px;height:32px;border-radius:99px;border:var(--lineW) solid var(--line);background:var(--panel);font-size:13px;cursor:pointer;position:relative;color:var(--ink)}
.uchip{display:flex;align-items:center;gap:6px;border:var(--lineW) solid var(--line);background:var(--panel);border-radius:99px;padding:3px 10px 3px 3px;font-size:10.5px;font-weight:800;color:var(--ink)}
.uchip .av{width:23px;height:23px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:9px;font-weight:800}
/* Display Range bar */
.rbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;padding:8px 14px;font-size:10.5px;font-weight:700;color:var(--mut);border-bottom:var(--lineW) solid var(--line);background:rgba(255,255,255,.34);backdrop-filter:blur(14px);z-index:4}
.rbar b{color:var(--brand);font-size:11px}
.rbar .cap{flex:1;min-width:180px;font-size:9.5px;font-weight:600;color:var(--mut);line-height:1.35}
.content{flex:1;overflow:auto;position:relative;display:flex;flex-direction:column;min-height:0}
.view{flex:1;overflow:auto;padding:14px 16px 26px;display:none;flex-direction:column;gap:10px}
.view.on{display:flex}

/* ===== shared bits ===== */
.btn{border:var(--lineW) solid var(--line);background:var(--panel);color:var(--ink);border-radius:99px;padding:8px 14px;font-size:11px;font-weight:800;cursor:pointer;font-family:inherit;white-space:nowrap}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.navy{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.green{background:var(--stR);border-color:var(--stR);color:#fff}
.btn:disabled{opacity:.45;cursor:default;transform:none!important;box-shadow:none}
.btn.mini{padding:5px 10px;font-size:10px}
.pill{border:var(--lineW) solid var(--line);background:var(--panel);color:var(--mut);border-radius:99px;padding:6px 12px;font-size:10.5px;font-weight:800;cursor:pointer;font-family:inherit;display:inline-flex;gap:5px;align-items:center}
.pill .dt{width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.pill .cnt{font-size:9px;opacity:.75}
.panelBox{background:var(--card);border-radius:var(--r2);padding:15px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:11px;color:var(--txt)}
.panelBox h3{font-size:13px;font-weight:800}
.ctx{font-size:10px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;line-height:1.5}
.inp{border:1.5px solid var(--line);border-radius:99px;background:var(--inp);color:var(--txt);padding:11px 16px;font-size:13px;font-family:inherit;font-weight:700;width:100%}
.inp.mono{font-family:ui-monospace,'JetBrains Mono',monospace;letter-spacing:.02em}
.chip{font-size:9.5px;font-weight:800;padding:4px 9px;border-radius:99px;white-space:nowrap}
.sO{background:var(--stOb);color:var(--stO)}.sR{background:var(--stRb);color:var(--stR)}.sL{background:var(--stLb);color:var(--stL)}.sA{background:var(--stAb);color:var(--stA)}
.scanrow{display:flex;gap:8px}
.empty{padding:34px 16px;text-align:center;color:var(--mut);font-size:12px;font-weight:700;line-height:1.7}
.pills{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.pills .sep{width:1px;height:18px;background:var(--line);margin:0 3px}
.msg{font-size:10.5px;font-weight:800;color:var(--stR);line-height:1.5}
.msg.er{color:var(--stO)}
.mtxWrap{max-width:1080px;margin:0 auto;width:100%}
.label46{background:#fff;color:#111;border:1px solid #d8dce3;border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:5px;align-items:center;width:170px}
.label46 .cd{font-size:12px;font-weight:800}
.label46 .sub{font-size:8px;text-transform:uppercase;letter-spacing:.1em;color:#667}
.labelsGrid{display:flex;gap:9px;flex-wrap:wrap}
textarea.inp{border-radius:20px;min-height:80px;resize:vertical;font-size:12px;padding:12px 15px}

/* ===== HỆ BẢNG KÍNH MỜ — redesign ===== */
.gtw{background:linear-gradient(165deg,rgba(255,255,255,.74),rgba(255,255,255,.44) 55%,rgba(255,255,255,.58));border-radius:26px;box-shadow:0 18px 50px rgba(35,42,69,.15),inset 0 1px 0 rgba(255,255,255,.9);overflow:hidden;color:var(--txt)}
.gtw.compact{border-radius:20px}
.blsrch{display:flex;justify-content:center;margin:0 auto 10px}
.blsrch .srch{width:min(680px,100%);background:rgba(255,255,255,.62)}
.gtbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.7);background:rgba(255,255,255,.3);position:relative;z-index:3}
.gtbar .lab{font-size:9px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--mut)}
.cpill{border:1px solid rgba(255,255,255,.8);background:rgba(255,255,255,.5);color:var(--mut);border-radius:99px;padding:4px 10px;font-size:9.5px;font-weight:800;cursor:pointer;font-family:inherit;display:inline-flex;gap:5px;align-items:center;white-space:nowrap}
.cpill.on{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 4px 12px rgba(23,43,72,.22)}
.cpill.on::before{content:"✓";font-size:8px}
.cpill.hid{opacity:.55;text-decoration:line-through}
.gtb{overflow:auto;position:relative;z-index:1;max-height:var(--gth,none);overscroll-behavior-x:contain}
table.gt{width:100%;border-collapse:separate;border-spacing:0;font-size:11.5px}
.gt thead th{position:sticky;top:0;z-index:4;text-align:left;padding:11px 12px;font-size:9px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);white-space:nowrap;
 background:linear-gradient(180deg,rgba(255,255,255,.94),rgba(255,255,255,.72));backdrop-filter:blur(22px) saturate(1.4);border-bottom:1px solid rgba(255,255,255,.95);box-shadow:0 8px 18px rgba(35,42,69,.07);cursor:pointer;user-select:none}
.gt thead th:hover{color:var(--brand)}
.gt thead th.act{color:var(--brand);background:linear-gradient(180deg,rgba(255,255,255,.98),rgba(238,244,255,.85))}
.gt thead th.num{text-align:right}
.gt .sd{font-size:9px;opacity:.5;margin-left:3px}
.gt th.act .sd,.gt th.sorted .sd{opacity:1;color:var(--acc)}
.gt .fdot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--stL);margin-left:4px;box-shadow:0 0 0 3px rgba(50,116,247,.2)}
.gt tbody td{padding:11px 12px;border-bottom:1px solid rgba(255,255,255,.42);white-space:nowrap;color:var(--txt);background:transparent}
.gt tbody tr:nth-child(even) td{background:rgba(255,255,255,.3)}
.gt tbody tr{cursor:pointer;transition:background .12s}
.gt tbody tr:hover td{background:rgba(255,255,255,.68);box-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.6)}
.gt tbody tr.sel td{background:linear-gradient(90deg,rgba(238,77,45,.14),rgba(255,255,255,.55))}
.gt tbody tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--acc)}
.gt td.pin,.gt th.pin{position:sticky;left:0;z-index:3;background:linear-gradient(90deg,rgba(255,255,255,.92),rgba(255,255,255,.7));backdrop-filter:blur(18px) saturate(1.3);box-shadow:6px 0 14px rgba(35,42,69,.06)}
.gt th.pin{z-index:6}
.gt tbody tr.sel td.pin{background:linear-gradient(90deg,rgba(255,228,220,.95),rgba(255,255,255,.7))}
.gt td.sid{font-weight:800;color:var(--brand);font-family:ui-monospace,monospace;font-size:11px}
.gt td.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:800}
.gt td.wrapw{white-space:normal;max-width:230px;overflow:hidden;text-overflow:ellipsis;line-height:1.4}
.gt .mut{color:var(--mut);font-weight:600}
.gt .mini2{font-size:9px;font-weight:800;color:var(--mut)}
.aging{display:inline-flex;align-items:center;gap:5px;font-weight:800;font-size:10px;padding:3px 9px;border-radius:99px}
.aging .bar{width:26px;height:4px;border-radius:99px;background:rgba(23,43,72,.12);overflow:hidden}
.aging .bar i{display:block;height:100%;border-radius:99px}
.gtfoot{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:11px 14px;border-top:1px solid rgba(255,255,255,.85);background:linear-gradient(180deg,rgba(255,255,255,.42),rgba(255,255,255,.62));font-size:11px;font-weight:800;color:var(--brand);position:relative;z-index:2}
.gtfoot .sp{margin-left:auto;color:var(--mut);font-weight:700}
.pg{display:flex;gap:5px;align-items:center;justify-content:center;padding:9px 12px;flex-wrap:wrap}
.pg button{min-width:26px;height:26px;border-radius:9px;border:1px solid rgba(255,255,255,.8);background:rgba(255,255,255,.5);font-size:10px;font-weight:800;color:var(--ink);cursor:pointer;font-family:inherit}
.pg button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.pg button:disabled{opacity:.4;cursor:default}
.gpop{position:fixed;z-index:300;width:250px;background:rgba(255,255,255,.86);backdrop-filter:blur(24px) saturate(1.5);border:1.5px solid rgba(255,255,255,.95);border-radius:20px;box-shadow:0 26px 60px rgba(23,43,72,.28);padding:12px;display:none;flex-direction:column;gap:8px;color:var(--txt)}
.gpop.on{display:flex}
.gpop h4{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.gpop .opt{display:flex;align-items:center;gap:8px;padding:6px 7px;border-radius:10px;font-size:11px;font-weight:700;cursor:pointer}
.gpop .opt:hover{background:rgba(255,255,255,.8)}
.gpop .opt .bx{width:16px;height:16px;border-radius:5px;border:1.5px solid rgba(23,43,72,.25);display:grid;place-items:center;font-size:9px;color:#fff;background:rgba(255,255,255,.7);flex:none}
.gpop .opt.on .bx{background:var(--acc);border-color:var(--acc)}
.gpop .opt .c{margin-left:auto;font-size:9px;color:var(--mut);font-weight:800}
.gpop .lst{max-height:210px;overflow:auto;display:flex;flex-direction:column;gap:1px}
.gpop .row2{display:flex;gap:6px}
.hiddenTag{font-size:8.5px;font-weight:800;color:var(--stA);background:var(--stAb);padding:2px 6px;border-radius:99px}

/* ===== danh sách: lưới card 4:5 + sidebar lọc ===== */
.split2{flex:1;display:flex;min-height:0;overflow:hidden}
.fs{width:222px;flex:none;padding:14px;display:flex;flex-direction:column;gap:7px;border-right:var(--lineW) solid var(--line);background:var(--panel);overflow:auto}
.fs .sec2{font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-top:7px}
.fbtn{display:flex;align-items:center;gap:8px;border:var(--lineW) solid var(--line);background:var(--card);border-radius:14px;padding:8px 11px;font-size:11px;font-weight:700;cursor:pointer;color:var(--txt);font-family:inherit;width:100%;text-align:left}
.fbtn.on{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc);background:var(--stOb);color:var(--stO)}
.fbtn .nb{margin-left:auto;font-size:9px;font-weight:800;color:var(--mut)}
.dotst{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:11px}
.dotst i{width:8px;height:8px;border-radius:50%;font-style:normal}
.fgwrap{flex:1;min-width:0;overflow:auto;padding:14px 16px 26px;display:flex;flex-direction:column;gap:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:13px}
.gcard{background:var(--card);border-radius:var(--r2);overflow:hidden;cursor:pointer;box-shadow:var(--shadow);transition:transform .14s;border:1px solid rgba(255,255,255,.75)}
.gcard .ph{aspect-ratio:4/5;display:grid;place-items:center;font-size:56px;position:relative;background:var(--ph)}
.gcard .ph .chip{position:absolute;top:9px;left:9px}
.gcard .ph .kd{position:absolute;top:9px;right:9px;font-size:8.5px;font-weight:800;background:rgba(23,43,72,.55);color:#fff;padding:3px 8px;border-radius:99px;letter-spacing:.05em;backdrop-filter:blur(8px)}
.gcard .ct{padding:10px 12px;display:flex;flex-direction:column;gap:3px;position:relative;z-index:1}
.gcard .ct b{font-size:10.5px;color:var(--brand);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gcard .ct p{font-size:10.5px;color:var(--txt);font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gcard .ct small{font-size:9px;color:var(--mut);font-weight:700}
.days{font-size:9px;font-weight:800;padding:2px 7px;border-radius:99px;background:rgba(23,43,72,.08);color:var(--ink);align-self:flex-start}
.days.hot{background:var(--stAb);color:var(--stA)}

/* ===== chi tiết (drawer) ===== */
.drawer{position:absolute;top:0;right:0;bottom:0;width:400px;z-index:20;display:flex;flex-direction:column;transform:translateX(105%);transition:transform .25s;border-top-left-radius:var(--r);border-bottom-left-radius:var(--r)}
.drawer.open{transform:none}
.dhead{display:flex;align-items:center;gap:7px;padding:12px 14px;border-bottom:var(--lineW) solid var(--line)}
.dhead h3{font-size:13px;font-weight:800;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dbody{flex:1;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:11px}
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.strip figure{position:relative;aspect-ratio:4/5;border-radius:16px;display:grid;place-items:center;font-size:30px;border:1px solid rgba(255,255,255,.8);background:var(--phBox);cursor:zoom-in;overflow:hidden}
.strip figcaption{position:absolute;left:0;right:0;bottom:0;font-size:8.5px;font-weight:800;color:#fff;background:linear-gradient(180deg,transparent,rgba(23,43,72,.72));padding:12px 6px 5px;text-align:center}
.info{display:flex;flex-direction:column;gap:5px;font-size:11px;color:var(--txt)}
.info .r{display:flex;justify-content:space-between;gap:8px;padding:6px 9px;border-radius:11px;background:rgba(255,255,255,.34)}
.info .r b{font-weight:800;color:var(--brand)}
.info .r span{color:var(--ink);text-align:right;max-width:62%;font-weight:600}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:11px;padding:7px 0;border-bottom:1px dashed rgba(255,255,255,.8)}
.kv b{font-weight:800;color:var(--brand)}
.kv span{color:var(--ink);text-align:right;max-width:64%;font-weight:600;white-space:normal}
.tl{background:rgba(255,255,255,.4);border:var(--lineW) solid var(--line);border-radius:16px;padding:10px 12px;flex:1;min-height:120px;overflow:auto}
.tl h4{font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);margin-bottom:7px;display:flex;align-items:center;gap:6px}
.tl .ev{padding:8px 0;border-top:1px solid rgba(255,255,255,.7);font-size:10.5px;line-height:1.45;position:relative;padding-left:14px}
.tl .ev:first-of-type{border-top:none}
.tl .ev::before{content:"";position:absolute;left:2px;top:13px;width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 3px rgba(238,77,45,.16)}
.tl .ev .t{font-weight:800}
.tl .ev .m{color:var(--mut);font-size:9.5px}
.dock{padding:10px 14px;border-top:var(--lineW) solid var(--line);display:flex;flex-direction:column;gap:7px}
.rrow{display:flex;gap:7px}
.rrow .inp{padding:9px 14px;font-size:12px}

/* ===== Role — bảng người dùng + công tắc (đã duyệt, giữ nguyên) ===== */
.utbl{width:100%;border-collapse:separate;border-spacing:0;font-size:11.5px}
.utbl th{text-align:left}
.utbl th:last-child{text-align:center}
.utbl td{text-align:left}
.utbl td:last-child{text-align:center}
.pgroup{margin-top:12px}
.phead{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:800;color:var(--brand);border-bottom:1px solid var(--line);padding-bottom:5px;margin-bottom:2px}
.phead i{font-style:normal}
.prow2{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line)}
.prow2:last-child{border-bottom:none}
.prow2 span{flex:1;min-width:0}
.prow2 b{display:block;font-size:11px}
.prow2 small{color:var(--mut);font-size:9px;font-weight:600}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:10px;font-weight:700;color:var(--mut);align-items:center}

/* ===== thanh lý / in mã ===== */
.cartchips{display:flex;gap:7px;flex-wrap:wrap}
.carttot{display:flex;justify-content:space-between;font-size:12.5px;font-weight:800;padding:10px 14px;background:rgba(255,255,255,.42);border-radius:14px}
.pcard{flex:1;min-width:150px;border:1.5px solid rgba(255,255,255,.85);background:var(--card);border-radius:20px;padding:14px;cursor:pointer;text-align:left;font-family:inherit;color:var(--txt);backdrop-filter:blur(20px)}
.pcard b{font-size:12.5px;font-weight:800;display:block}
.pcard small{font-size:10px;color:var(--mut);font-weight:600;display:block;margin-top:3px;line-height:1.4}
.pcard.on{border-color:var(--acc);box-shadow:0 10px 28px rgba(238,77,45,.2),inset 0 0 0 1px var(--acc);background:var(--stOb)}
.pcard.on b{color:var(--stO)}
.pstep{display:flex;gap:6px;align-items:center;font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.pstep .st{padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:rgba(255,255,255,.4)}
.pstep .st.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.bigslot{aspect-ratio:4/5;max-height:200px;border-radius:20px;border:2.5px dashed rgba(255,255,255,.9);display:flex;flex-direction:column;gap:7px;align-items:center;justify-content:center;font-size:30px;color:var(--mut);cursor:pointer;background:var(--card);width:100%}
.bigslot.full{border-style:solid;background:var(--phBox);color:var(--txt)}
.slots3{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.slotlab{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin-bottom:5px}
.stgrid{display:flex;gap:6px;flex-wrap:wrap}
.stbtn{border:1.5px solid rgba(255,255,255,.85);background:rgba(255,255,255,.45);border-radius:99px;padding:8px 14px;font-size:11px;font-weight:800;cursor:pointer;font-family:inherit;color:var(--ink)}
.stbtn.on{background:var(--brand);color:#fff;border-color:var(--brand)}

/* ===== mobile ===== */
.bnav{display:none;z-index:30;border-top:var(--lineW) solid var(--line);background:var(--panel);backdrop-filter:blur(14px)}
.stage[data-device=mobile] .bnav{display:grid;grid-template-columns:repeat(5,1fr);padding:5px 5px 12px}
.stage[data-device=mobile] .side{display:none}
.stage[data-device=mobile] .hdr{grid-template-columns:1fr auto;padding:8px 10px}
.stage[data-device=mobile] .hdr .srch{grid-column:1/-1;order:3}
.stage[data-device=mobile] .blsrch{margin:0 0 10px}
.stage[data-device=mobile] .blsrch .srch{display:flex;width:100%}
.stage[data-device=mobile] .dhead h3{font-size:14px;white-space:normal;word-break:break-word}
.stage[data-device=mobile] .acts .uchip span{display:none}
.stage[data-device=mobile] .deskOnly{display:none!important}
.stage[data-device=mobile] .fs{display:none}
.stage[data-device=mobile] .drawer{width:auto;left:0;right:0;top:auto;bottom:0;height:82%;border-radius:26px 26px 0 0;border-left:none;border-top:1px solid rgba(255,255,255,.9);transform:translateY(105%)}
.stage[data-device=mobile] .drawer.open{transform:none}
.stage[data-device=mobile] .rbar{gap:6px 8px;padding:8px 10px}
.stage[data-device=mobile] .rbar .cap{order:9;flex:1 0 100%;font-size:9px;line-height:1.3}
.stage[data-device=mobile] .gtw{border-radius:20px}
.stage[data-device=mobile] .gtb{max-height:none}
.stage[data-device=mobile] .mtxWrap{max-width:none}
.bn{display:flex;flex-direction:column;align-items:center;gap:2px;border:none;background:transparent;color:var(--mut);font-size:8.5px;font-weight:800;padding:5px 2px;cursor:pointer;font-family:inherit}
.bn i{font-style:normal;font-size:15px}
.bn.on{color:var(--acc)}

/* ===== modal / toast / chat / lightbox / cam ===== */
.mask{position:fixed;inset:0;background:rgba(15,20,30,.5);backdrop-filter:blur(6px);z-index:200;display:none;align-items:center;justify-content:center;padding:16px}
.mask.on{display:flex}
.modal{background:linear-gradient(180deg,rgba(255,255,255,.88),rgba(255,255,255,.72));color:var(--txt);border:1.5px solid rgba(255,255,255,.92);border-radius:var(--r);width:min(520px,100%);max-height:86vh;overflow:auto;padding:19px;box-shadow:0 30px 90px rgba(0,0,0,.35);backdrop-filter:blur(26px) saturate(1.5)}
.modal h2{font-size:14.5px;font-weight:800;margin-bottom:3px}
.modal .sub{font-size:11px;color:var(--mut);font-weight:600;margin-bottom:12px;line-height:1.5}
.modal .close{float:right;border:none;background:transparent;color:var(--mut);font-size:16px;cursor:pointer}
.pick{flex:1;min-width:130px;border:1.5px solid rgba(255,255,255,.85);background:rgba(255,255,255,.45);border-radius:20px;padding:15px 12px;text-align:left;cursor:pointer;font-family:inherit;color:var(--txt)}
.pick:hover{border-color:var(--acc)}
.pick i{font-style:normal;display:block;font-size:20px;margin-bottom:5px}
.pick b{font-size:12px}
.pick small{display:block;color:var(--mut);font-size:9.5px;font-weight:600;margin-top:2px;line-height:1.4}
.ehead{display:flex;align-items:center;gap:8px;margin:0 0 10px;padding-bottom:8px;border-bottom:1px solid rgba(23,43,72,.1)}
.ehead h2{margin:0;font-size:15px;flex:1}
.ehead .hact{display:flex;gap:6px;flex:none}
.coderow{display:flex;gap:8px;align-items:center}
.coderow .inp{flex:1;min-width:0}
.codebtn{flex:none;padding:8px 12px}
.codebtn.ok{background:var(--acc);color:#fff;border-color:var(--acc)}
.msg.ok{color:var(--stR)}
.chatBox{display:flex;flex-direction:column;gap:8px;max-height:340px}
.chatList{flex:1;overflow:auto;display:flex;flex-direction:column;gap:7px;padding:3px}
.bub{max-width:84%;align-self:flex-start;background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.9);border-radius:15px 15px 15px 4px;padding:9px 12px;font-size:11.5px;line-height:1.45}
.bub .who{font-size:9px;font-weight:800;color:var(--mut);margin-bottom:2px}
.bub.me{align-self:flex-end;border-radius:15px 15px 4px 15px;background:var(--stLb)}
.bub.ad{background:var(--stRb)}
.bub .rp{margin-top:5px;padding-left:9px;border-left:2px solid rgba(23,43,72,.15);font-size:10.5px;color:var(--ink)}
.chatIn{display:flex;gap:7px}
.chatIn input{flex:1;border:var(--lineW) solid var(--line);border-radius:99px;background:var(--inp);color:var(--txt);padding:9px 13px;font-size:11.5px;font-family:inherit}
.calWrap{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.cal{background:rgba(255,255,255,.42);border:1px solid rgba(255,255,255,.85);border-radius:18px;padding:10px}
.cal h5{font-size:10.5px;font-weight:800;text-align:center;margin-bottom:7px;color:var(--brand)}
.cal .wd,.cal .gd{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal .wd span{font-size:8px;font-weight:800;color:var(--mut);text-align:center;padding:2px 0}
.cal .gd button{aspect-ratio:1/1;border:none;background:transparent;font-size:10px;font-weight:700;color:var(--ink);border-radius:9px;cursor:pointer;font-family:inherit}
.cal .gd button:hover{background:rgba(238,77,45,.14)}
.cal .gd button.in{background:rgba(50,116,247,.18);border-radius:0}
.cal .gd button.ed{background:var(--brand);color:#fff;border-radius:9px}
.cal .gd button.ed2{background:var(--acc);color:#fff;border-radius:9px}
.cal .gd button.out{opacity:.25}
.camView{position:relative;aspect-ratio:4/3;border-radius:20px;background:radial-gradient(120% 120% at 50% 0%,#22304a,#0b0f16);overflow:hidden;display:grid;place-items:center;color:#cfe1ff;font-size:11px;font-weight:700;text-align:center;padding:16px}
.camView .frame{position:absolute;width:56%;height:46%;border:2px solid rgba(255,255,255,.85);border-radius:14px}
.camView .frame::after{content:"";position:absolute;left:6px;right:6px;height:2px;background:var(--acc);box-shadow:0 0 12px var(--acc);animation:scanl 2.1s ease-in-out infinite}
@keyframes scanl{0%,100%{top:6px}50%{top:calc(100% - 8px)}}
#lb{position:fixed;inset:0;background:rgba(10,14,22,.86);backdrop-filter:blur(10px);z-index:300;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px}
#lb.on{display:flex}
#lbImg{width:min(560px,80vw);aspect-ratio:4/5;border-radius:24px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.4);display:grid;place-items:center;font-size:120px;transition:transform .18s}
#lbCap{color:#dbe6ff;font-size:11.5px;font-weight:800}
#lb .tools{display:flex;gap:7px}
#lb .tools button{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;border-radius:99px;padding:8px 15px;font-size:12px;font-weight:800;cursor:pointer;font-family:inherit}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);background:#232a45;color:#fff;font-size:11.5px;font-weight:700;padding:10px 18px;border-radius:99px;z-index:400;transition:transform .25s;box-shadow:0 12px 40px rgba(0,0,0,.3);max-width:90vw;text-align:center}
#toast.on{transform:translateX(-50%)}
/* ===== LIQUID GLASS (iOS 26) — lens blur + specular edge + sheen + depth ===== */
:root,.stage{
 --lens:blur(28px) saturate(1.95) brightness(1.02);
 --lens2:blur(16px) saturate(1.7);
 --film:linear-gradient(168deg,rgba(255,255,255,.58),rgba(255,255,255,.26) 48%,rgba(255,255,255,.44));
 --edge:linear-gradient(148deg,rgba(255,255,255,.98),rgba(255,255,255,.30) 28%,rgba(255,255,255,.08) 54%,rgba(255,255,255,.78));
 --depth:0 1px 2px rgba(23,43,72,.06),0 10px 24px rgba(23,43,72,.10),0 26px 56px rgba(23,43,72,.10);
 --spring:cubic-bezier(.16,1,.3,1);
 --pageBg:radial-gradient(640px 430px at 16% 6%,#c7d4ff,transparent 72%),radial-gradient(560px 400px at 90% 2%,#ffcede,transparent 70%),radial-gradient(760px 500px at 64% 44%,#d3f0ff,transparent 74%),radial-gradient(620px 420px at 22% 94%,#ffe0b6,transparent 72%),radial-gradient(700px 460px at 86% 98%,#b8f0da,transparent 72%),linear-gradient(150deg,#f6f8ff,#eef2fb 55%,#f4f8ff)}
.app::before{inset:-16%;will-change:transform;animation:drift 38s ease-in-out infinite alternate}
@keyframes drift{0%{transform:scale(1.03) translate3d(-1.4%,-1%,0)}100%{transform:scale(1.1) translate3d(1.8%,1.5%,0)}}
.modal,.pcard,.cal,.tl,.bigslot,.fs{position:relative}
.gtw::before,.panelBox::before,.gcard::before,.modal::before,.drawer::before,.gpop::before,.pcard::before,.cal::before,.tl::before,.bigslot::before,.carttot::before,.fs::before,.strip figure::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.2px;background:var(--edge);
 -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
 -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;z-index:4}
.gtw::after,.panelBox::after,.modal::after,.drawer::after,.pcard::after,.cal::after,.tl::after,.carttot::after,.bigslot::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:0;opacity:.72;
 background:radial-gradient(130% 74% at 6% -12%,rgba(255,255,255,.78),rgba(255,255,255,0) 58%),radial-gradient(80% 56% at 100% -4%,rgba(255,255,255,.42),rgba(255,255,255,0) 55%),linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,0) 34%)}
.gcard::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:3;
 background:radial-gradient(240px 170px at var(--mx,50%) var(--my,-30%),rgba(255,255,255,.62),rgba(255,255,255,0) 62%),linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 30%);
 opacity:.5;transition:opacity .4s var(--spring)}
.gcard:hover::after{opacity:1}
.pcard::before,.pick::before{z-index:1}
.panelBox,.gcard,.gtw,.carttot,.pcard,.cal,.tl,.bigslot,.drawer,.modal,.gpop,.fs,.strip figure,.srch,.pill,.abtn,.uchip,.btn,.cpill,.pg button,.stbtn,.pick,.fbtn,.bub,.legend,.gtbar,.gtfoot,.msg,.days,.chip,.aging,.inp,.label46{border-color:rgba(255,255,255,.66)}
.panelBox,.gcard,.carttot,.pcard,.bigslot,.pick,.cal,.tl,.legend{background:var(--film);box-shadow:var(--depth)}
.gtw{background:linear-gradient(168deg,rgba(255,255,255,.52),rgba(255,255,255,.20) 52%,rgba(255,255,255,.38));box-shadow:var(--depth)}
.gtbar{background:linear-gradient(180deg,rgba(255,255,255,.52),rgba(255,255,255,.26));border-bottom:1px solid rgba(255,255,255,.6)}
.gtfoot{background:linear-gradient(0deg,rgba(255,255,255,.56),rgba(255,255,255,.24));border-top:1px solid rgba(255,255,255,.7)}
.gt thead th{background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(255,255,255,.66));-webkit-backdrop-filter:blur(26px) saturate(2) brightness(1.02);backdrop-filter:blur(26px) saturate(2) brightness(1.02);box-shadow:inset 0 1px 0 rgba(255,255,255,.98),inset 0 -1px 0 rgba(255,255,255,.5),0 10px 22px rgba(23,43,72,.08)}
.gt td.pin,.gt th.pin{background:linear-gradient(90deg,rgba(255,255,255,.94),rgba(255,255,255,.72));backdrop-filter:blur(22px) saturate(1.9)}
.gcard,.pcard,.panelBox,.gtw,.btn,.pill,.cpill,.pg button,.stbtn,.fbtn,.pick,.abtn,.uchip,.navi,.bn,.tchip,.chip,.days,.aging,.modal,.drawer,.gpop{transition:transform .4s var(--spring),box-shadow .35s var(--spring),background .3s,opacity .3s,-webkit-backdrop-filter .3s,backdrop-filter .3s}
.btn,.pill,.cpill,.pg button,.stbtn,.fbtn,.abtn,.uchip,.pick,.chip,.days,.aging,.inp,.srch,.label46{box-shadow:inset 0 1px 0 rgba(255,255,255,.9),inset 0 0 0 1px rgba(255,255,255,.28),inset 0 -6px 12px rgba(255,255,255,.22),0 3px 10px rgba(23,43,72,.07)}

.hdr{background:linear-gradient(180deg,rgba(255,255,255,.74),rgba(255,255,255,.44));-webkit-backdrop-filter:var(--lens);backdrop-filter:var(--lens);box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 10px 26px rgba(23,43,72,.07)}

.side{background:linear-gradient(178deg,rgba(23,43,72,.80),rgba(16,30,53,.90));-webkit-backdrop-filter:blur(30px) saturate(1.8);backdrop-filter:blur(30px) saturate(1.8);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset -1px 0 0 rgba(255,255,255,.12)}
.navi.on{background:linear-gradient(180deg,rgba(255,255,255,.24),rgba(255,255,255,.09));box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 6px 16px rgba(0,0,0,.16)}
.navi:active,.bn:active,.btn:active,.pill:active,.cpill:active,.pg button:active,.stbtn:active,.fbtn:active,.pick:active,.abtn:active{transform:scale(.94)}
.gcard:active{transform:scale(.975)}
.gcard:hover{-webkit-backdrop-filter:blur(26px) saturate(2.1) brightness(1.05);backdrop-filter:blur(26px) saturate(2.1) brightness(1.05);box-shadow:var(--depth),0 18px 40px rgba(238,77,45,.16)}
.btn.pri{background:linear-gradient(180deg,rgba(240,86,45,.97),rgba(223,55,22,.9));border-color:rgba(255,140,110,.7);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -8px 16px rgba(120,22,0,.16),0 10px 26px rgba(238,77,45,.34)}

.btn.green{background:linear-gradient(180deg,rgba(23,168,92,.95),rgba(9,128,66,.92));box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -8px 16px rgba(0,60,30,.16),0 10px 24px rgba(13,154,80,.26)}

function printFeed(code){code=String(code||'').trim();
 if(!/^(Box|Item)\.\d{2}-\d{2}-\d{4}\.\d+$/.test(code)){S.pn.hint='Chưa đúng định dạng — cần Box.… hoặc Item.… (ngày-tháng-năm.số).';render();return}
 var desk=S.device==='pc';S.pn.codes=[];S.pn.last='';
 S.pn.hint='Đúng định dạng — '+(desk?('đang tự in '+code+'…'):('đã gửi '+code+' tới trạm in…'));render();
 setTimeout(function(){
  S.pn.hint=desk?('Đã in: <b>'+code+'</b> (khổ 4x6in).'):('Đã gửi: <b>'+code+'</b> tới trạm in (laptop mở tab In Mã sẽ tự in).');
  if(desk)S.pn.last=code;render()},desk?900:500)}
function printBulkGo(kind){var codes=[];for(var i=0;i<10;i++)codes.push(kind+'.13-10-2026.'+(seq++));
 S.pn.kind=kind;S.pn.mode='bulk';S.pn.codes=codes;S.pn.last='';S.pn.hint='Server đang sinh 10 mã '+kind+'…';
 $('maskKind').classList.remove('on');render();
 var desk=S.device==='pc';
 setTimeout(function(){
  S.pn.hint=desk?('Đã giữ chỗ 10 mã '+kind+' — tự in '+codes[0]+' → '+codes[9]+' (1 lệnh in, khổ 4x6in).')
   :('Đã gửi 10 mã '+kind+' tới trạm in ('+codes[0]+' → '+codes[9]+') — chờ laptop in.');
  if(desk)S.pn.last=codes[0];render()},1300)}

 cartScanVal:function(code,quiet){var it=find(code),c=S.cart;
  if(!c.codes.length&&S.tab!=='liq'){S.tab='liq';render()}
  if(!it){c.msg='Không Có: '+code;c.ok=false}
  else if(it.status==='thanh_ly'){c.msg='Đã Thanh Lý: '+code;c.ok=false}
  else if(it.status==='da_tim_bill'){c.msg='Đã Resolve: '+code;c.ok=false}
  else if(it.status!=='chua_xu_ly'){c.msg='Không cho thanh lý ('+(STLBL[it.status]||it.status)+'): '+code;c.ok=false}
  else if(c.codes.indexOf(code)>=0){c.msg='Trùng (đã có trong danh sách): '+code;c.ok=false}
  else{c.codes.push(code);c.msg='Thành công: '+code;c.ok=true;c.step=1}

 popOpt:function(el){el.classList.toggle('on');el.querySelector('.bx').textContent=el.classList.contains('on')?'✓':''},
 blClrF:function(el){S.bl.f[el.dataset.id]=[];$('gpop').classList.remove('on');S.bl.page=1;render()},
 blOkF:function(el){var g=$('gpop'),picked=[];
  g.querySelectorAll('.opt').forEach(function(o){if(o.classList.contains('on'))picked.push(o.dataset.v)});
  S.bl.f[el.dataset.id]=picked;$('gpop').classList.remove('on');S.bl.page=1;render()},
 blClrS:function(el){S.bl.s[el.dataset.id]='';$('gpop').classList.remove('on');S.bl.page=1;render()},
 blOkS:function(el){var g=$('gpop'),i=$('popQ');S.bl.s[el.dataset.id]=i?i.value.trim():'';
  $('gpop').classList.remove('on');S.bl.page=1;render()},
 blRow:function(el){blDetail(el.dataset.id)},
 blPage:function(el){var id=el.dataset.id,pages=Math.max(1,Math.ceil(blFiltered().length/BL_PAGE));
  if(id==='n')S.bl.page=Math.min(pages,S.bl.page+1);else if(id==='-1')S.bl.page=Math.max(1,S.bl.page-1);else S.bl.page=+id;
  render();$('vFlow').scrollTop=0},
 blCopy:function(el){toast('⧉ Đã copy '+el.dataset.id+' (mock clipboard)')},
 /* role */
 addUser:function(){var i=$('newEmail'),v=i?i.value.trim().toLowerCase():'';
  if(!isAdm()){toast('Cần quyền ADMIN.');return}
  if(!v){toast('Nhập email cần thêm.');return}
  if(USERS.filter(function(u){return u.email===v}).length){toast('Email đã có trong danh sách.');return}
  USERS.push({email:v,role:'ADMIN'});if(i)i.value='';
  render();toast('Đã thêm '+v+' (ADMIN).')},
 delUser:function(el){var u=USERS[+el.dataset.id];if(!u)return;
  if(u.email===ME()){toast('Không tự xóa chính mình.');return}
  if(u.role==='ADMIN'&&USERS.filter(function(x){return x.role==='ADMIN'}).length<=1){toast('Không thể xóa ADMIN cuối cùng.');return}
  USERS.splice(+el.dataset.id,1);render();toast('Đã xóa '+u.email+'.')}
};
function openEditFor(code,presetSt){var it=find(code);if(!it)return;
 EM={code:code,st:presetSt||null,bill:it.bill||'',reason:'',photos:0,desc:it.desc,note:it.note||''};
 renderEdit();if(presetSt){var r=$('emReason');if(r)setTimeout(function(){r.focus()},120)}}

/* ================= EVENTS ================= */
document.addEventListener('click',function(e){var el=e.target.closest('[data-act]');
 if(!el){if(!$('gpop').contains(e.target))$('gpop').classList.remove('on');return}
 var fn=A[el.dataset.act];if(!fn)return;e.stopPropagation();fn(el,e)});
document.addEventListener('input',function(e){var t=e.target;
 if(t.id==='q'){S.q=t.value;S.page=1;render();
  var i=$('q');if(i&&i!==document.activeElement){i.focus();i.setSelectionRange(i.value.length,i.value.length)}}
 if(t.id==='cartIn')return;
 if(t.id==='cmCode'){var c=S.cm;c.code=t.value.trim();var hm=$('cmCodeHint'),bb=document.querySelector('[data-act="cmCodeEdit"]');
  var ok=cmCodeOk(c.kind,c.code);if(hm){hm.className='msg'+(ok?' ok':' er');hm.textContent=ok?'Mã hợp lệ — ấn Ok để hoàn tất.':'Mã phải đúng dạng '+(c.kind==='Box'?'Box.(ngày-tháng-năm).(số)':'Item.(ngày-tháng-năm).(số)')}
  if(bb)bb.disabled=!ok}});
document.addEventListener('keydown',function(e){
 if(e.key==='Escape'){closeDetail();$('gpop').classList.remove('on');
  ['maskCreate','maskEdit','maskRange','maskCam','maskFb','maskIntro','maskLeave','maskKind'].forEach(function(m){$(m).classList.remove('on')});
  $('lb').classList.remove('on');return}
 var t=e.target;if(e.key!=='Enter'||!/INPUT|TEXTAREA/.test(t.tagName))return;
 if(t.id==='blQ'){A.blKwGo();return}
if(t.id==='billIn'){A.resolveConfirm();return}
 if(t.id==='scanPrint'){A.printFeed();return}
 if(t.id==='scanLiq'||t.id==='cartIn'){var v=t.value.trim();t.value='';if(v)A.cartScanVal(v);return}
 if(t.id==='liqCode'){A.cartConfirm();return}
 if(t.id==='newEmail'){A.addUser();return}
 if(t.id==='fbIn'){A.fbSend();return}
 if(t.id==='popQ'&&$('gpop').dataset.kind==='search'){A.blOkS({dataset:{id:$('gpop').dataset.key}});return}});
$('lb').addEventListener('wheel',function(e){e.preventDefault();lbZoom(e.deltaY<0?1.15:1/1.15)});

/* ================= INIT ================= */
$('mockNote').innerHTML='<b>Mẫu 5 · Liquid Glass</b> — nút, logic và dữ liệu lấy theo app đang chạy: 5 tab, drawer hồ sơ, Create 3 bước, Edit (ADMIN đổi trạng thái + ảnh, Staff chỉ Mô tả + Ghi chú), Display Range, camera, Backlog 16 cột đúng dữ liệu sheet, lô thanh lý 2 bước, In Mã (trạm in chạy ngầm — không có bảng hàng đợi), Role chỉ ADMIN/STAFF, sidebar thu gọn kiểu rail. Không thêm nút nào ngoài app thật.';
document.addEventListener('pointermove',function(e){
 var t=e.target&&e.target.closest?e.target.closest('.gcard,.pcard,.pick'):null;if(!t)return;
 var r=t.getBoundingClientRect();
 t.style.setProperty('--mx',((e.clientX-r.left)/r.width*100).toFixed(1)+'%');
 t.style.setProperty('--my',((e.clientY-r.top)/r.height*100).toFixed(1)+'%')},true);
setDevice('pc');S.tab='list';render();
})();
</script>
