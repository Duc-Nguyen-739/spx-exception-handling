<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPX Exception Handling — 5 mẫu Frost Glass (chức năng & tên như app hiện tại)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Be Vietnam Pro',system-ui,-apple-system,sans-serif;background:#12151b;color:#dde3ee;-webkit-font-smoothing:antialiased}
#bar{position:sticky;top:0;z-index:99;background:rgba(18,21,27,.94);backdrop-filter:blur(12px);border-bottom:1px solid #262b35;padding:9px 14px 8px}
#bar .row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
#bar .lab{font-size:10px;font-weight:800;letter-spacing:.06em;color:#7e8798;text-transform:uppercase}
.tchip{border:1px solid #2b313d;background:#1a1f28;color:#b9c2d4;font-size:10.5px;font-weight:700;padding:5px 10px;border-radius:99px;cursor:pointer;font-family:inherit}
.tchip.on{background:#43506a;color:#fff;border-color:#5b6c92}
.tchip:hover{border-color:#54637c}
#devBox{margin-left:auto}
.dbtn{border:1px solid #2b313d;background:#1a1f28;color:#b9c2d4;font-size:10.5px;font-weight:700;padding:5px 12px;cursor:pointer;font-family:inherit}
.dbtn:first-of-type{border-radius:99px 0 0 99px}.dbtn:last-of-type{border-radius:0 99px 99px 0;border-left:none}
.dbtn.on{background:#dfe4f2;color:#12151b;border-color:#dfe4f2}
#mockNote{width:100%;font-size:11px;color:#8b93a6;margin-top:2px}
#mockNote b{color:#fff}
#stageWrap{padding:20px 14px 36px;display:flex;justify-content:center}

/* ===== stage — Frost Glass (chốt) ===== */
.stage{position:relative;width:100%;max-width:1400px;
 --bg:transparent;--card:rgba(255,255,255,.62);--panel:rgba(255,255,255,.55);--line:rgba(255,255,255,.85);--txt:#172b48;--mut:#8b94a6;--ink:#303844;--brand:#172b48;--acc:#ee4d2d;--inp:rgba(255,255,255,.78);--r:26px;--r2:18px;--lineW:1px;--blur:18px;--shadow:0 8px 32px rgba(35,42,69,.10);
 --sideBg:rgba(23,43,72,.82);--sideTxt:#c3cfe4;--stO:#ee4d2d;--stOb:rgba(255,245,240,.9);--stR:#0d9a50;--stRb:rgba(233,250,240,.92);--stL:#3274f7;--stLb:rgba(238,244,255,.92);--phBox:rgba(240,241,244,.9);--phItem:rgba(237,241,247,.9);
 --pageBg:radial-gradient(1000px 560px at 12% -8%,#dfe4ff,transparent),radial-gradient(860px 520px at 95% 6%,#ffe3f1,transparent),radial-gradient(980px 640px at 60% 112%,#d9f8ef,transparent),#f2f4fa;color:var(--txt)}
/* lớp hiệu ứng glass */
.app{background:transparent}
.card,.panelBox,.qrow,.sitem,.gcard,.hrow,.deskbox,.tblwrap,.logline,.cchip,.jobrow,.fbtn,.heroBox{backdrop-filter:blur(var(--blur)) saturate(1.35);-webkit-backdrop-filter:blur(var(--blur)) saturate(1.35)}
.panelBox,.qrow,.sitem,.gcard,.hrow,.deskbox,.heroBox,.fbtn,.jobrow,.tblwrap{border:1px solid rgba(255,255,255,.75);position:relative}
.panelBox::after,.deskbox::after,.heroBox::after,.gcard::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(135deg,rgba(255,255,255,.55),rgba(255,255,255,0) 38%);opacity:.6}
.gcard::after{bottom:auto;height:50%}
.gcard:hover,.hrow:hover{transform:translateY(-3px);box-shadow:0 16px 40px rgba(238,77,45,.14)}
.deskbox,.heroBox{border:1.5px solid transparent;background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(135deg,rgba(255,255,255,.95),rgba(255,255,255,.35) 45%,rgba(255,190,160,.75)) border-box}
.deskbox input,.heroBox input{box-shadow:0 0 0 4px rgba(238,77,45,.10)}
.deskbox input:focus,.heroBox input:focus{outline:none;box-shadow:0 0 0 6px rgba(238,77,45,.16)}
.inp:focus{outline:none;border-color:rgba(238,77,45,.55);box-shadow:0 0 0 4px rgba(238,77,45,.10)}
.chip{backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 4px 14px rgba(23,43,72,.10)}
.btn{backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:transform .12s,box-shadow .15s}
.btn:hover{transform:translateY(-1px)}
.btn.pri{box-shadow:0 8px 22px rgba(238,77,45,.32);position:relative;overflow:hidden}
.btn.pri::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-20deg);animation:sheen 4.5s ease-in-out infinite}
@keyframes sheen{0%,72%{left:-60%}100%{left:130%}}
.drawer{backdrop-filter:blur(24px) saturate(1.4);-webkit-backdrop-filter:blur(24px) saturate(1.4);background:linear-gradient(180deg,rgba(255,255,255,.78),rgba(255,255,255,.62));border-left:1px solid rgba(255,255,255,.9)}
.srch{backdrop-filter:blur(12px);box-shadow:0 4px 18px rgba(35,42,69,.08)}
.side{backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3)}
.stage[data-device=mobile]{max-width:430px}
.stage[data-device=mobile] .app{width:390px;height:844px;border-radius:40px;border:10px solid #0b0e13;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.app{position:relative;overflow:hidden;background:var(--bg);height:calc(100vh - 108px);min-height:620px;display:flex;border-radius:var(--r);border:1px solid rgba(23,43,72,.1);isolation:isolate}
.app::before{content:"";position:absolute;inset:0;background:var(--pageBg);z-index:-1}
/* biến thể kính theo mẫu */
.stage[data-mock=m2]{--r:20px;--r2:13px;--blur:14px;--line:rgba(255,255,255,.7)}
.stage[data-mock=m4]{--r:22px;--r2:15px;--blur:16px}
.stage[data-mock=m5]{--blur:26px;--r:34px;--r2:24px;--card:rgba(255,255,255,.5)}
.stage[data-mock=m5] .gcard .ph{aspect-ratio:4/5;font-size:56px}
.stage[data-mock=m5] .app::before{filter:saturate(1.15)}

/* ===== shell ===== */
.side{flex:none;width:212px;background:var(--sideBg);color:var(--sideTxt);display:flex;flex-direction:column;padding:12px 9px;gap:2px;position:relative;z-index:6;overflow:auto}
.side .brand{display:flex;gap:9px;align-items:center;padding:4px 8px 12px}
.side .logo{width:28px;height:28px;flex:none;border-radius:9px;background:var(--acc);color:#fff;font-weight:800;font-size:10.5px;display:grid;place-items:center}
.side .bt{font-size:11.5px;font-weight:800;color:#fff;line-height:1.2}
.side .bt small{display:block;font-size:8.5px;font-weight:600;color:var(--sideTxt);letter-spacing:.05em;text-transform:uppercase}
.side .sec{margin-top:9px;padding:4px 10px;font-size:8.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:rgba(255,255,255,.35)}
.navi{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:10px;color:var(--sideTxt);font-size:11px;font-weight:700;cursor:pointer;border:none;background:transparent;width:100%;text-align:left;font-family:inherit}
.navi i{font-style:normal;width:17px;text-align:center;font-size:12.5px}
.navi:hover{color:#fff;background:rgba(255,255,255,.06)}
.navi.on{color:#fff;background:rgba(255,255,255,.13)}
.navi .nb{margin-left:auto;font-size:8.5px;background:rgba(255,255,255,.12);padding:1px 6px;border-radius:99px}
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.hdr{display:grid;grid-template-columns:1fr minmax(0,440px) 1fr;align-items:center;gap:10px;padding:9px 14px;background:var(--panel);border-bottom:var(--lineW) solid var(--line);backdrop-filter:blur(var(--blur));z-index:5}
.hdr .hh{font-size:12.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:7px;color:var(--brand)}
.hdr .hh .lg{width:23px;height:23px;flex:none;border-radius:7px;background:var(--acc);color:#fff;font-weight:800;font-size:9px;display:grid;place-items:center}
.srch{display:flex;align-items:center;gap:8px;background:var(--inp);border:1.5px solid var(--line);border-radius:99px;padding:3px 5px 3px 12px}
.srch input{flex:1;min-width:0;border:none;background:transparent;font-size:12px;font-weight:600;color:var(--txt);font-family:inherit;padding:6px 0}
.srch input:focus{outline:none}
.acts{display:flex;gap:6px;justify-content:flex-end;align-items:center}
.abtn{width:32px;height:32px;border-radius:99px;border:var(--lineW) solid var(--line);background:var(--panel);font-size:13px;cursor:pointer;position:relative;color:var(--ink)}
.uchip{display:flex;align-items:center;gap:6px;border:var(--lineW) solid var(--line);background:var(--panel);border-radius:99px;padding:3px 10px 3px 3px;font-size:10.5px;font-weight:800;color:var(--ink)}
.uchip .av{width:23px;height:23px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:9px;font-weight:800}
.content{flex:1;overflow:auto;position:relative;display:flex;flex-direction:column;min-height:0}
.view{flex:1;overflow:auto;padding:14px 16px 26px;display:none;flex-direction:column;gap:10px}
.view.on{display:flex}

/* ===== shared bits ===== */
.btn{border:var(--lineW) solid var(--line);background:var(--panel);color:var(--ink);border-radius:99px;padding:8px 14px;font-size:11px;font-weight:800;cursor:pointer;font-family:inherit;white-space:nowrap}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.navy{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.green{background:var(--stR);border-color:var(--stR);color:#fff}
.btn:disabled{opacity:.45;cursor:default;transform:none!important}
.btn.mini{padding:5px 10px;font-size:10px}
.btn.big{padding:13px 22px;font-size:13px;border-radius:99px}
.pill{border:var(--lineW) solid var(--line);background:var(--panel);color:var(--mut);border-radius:99px;padding:6px 12px;font-size:10.5px;font-weight:800;cursor:pointer;font-family:inherit;display:inline-flex;gap:5px;align-items:center}
.pill .dt{width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.panelBox{background:var(--card);border:var(--lineW) solid var(--line);border-radius:var(--r2);padding:15px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:11px;color:var(--txt)}
.panelBox h3{font-size:13px;font-weight:800}
.ctx{font-size:10px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.inp{border:1.5px solid var(--line);border-radius:99px;background:var(--inp);color:var(--txt);padding:11px 16px;font-size:13px;font-family:inherit;font-weight:700;width:100%}
.chip{font-size:9.5px;font-weight:800;padding:4px 9px;border-radius:99px}
.sO{background:var(--stOb);color:var(--stO)}.sR{background:var(--stRb);color:var(--stR)}.sL{background:var(--stLb);color:var(--stL)}
.dotst{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:11px}
.dotst i{width:8px;height:8px;border-radius:50%;font-style:normal}
.scanrow{display:flex;gap:8px}
.tblwrap{background:var(--card);border:var(--lineW) solid var(--line);border-radius:var(--r2);overflow:auto;box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:9px 11px;font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);border-bottom:var(--lineW) solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--panel);z-index:1}
td{padding:9px 11px;border-top:1px solid var(--line);white-space:nowrap;color:var(--txt)}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--bg)}
td.sid{font-weight:800;color:var(--brand)}
td.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.label46{background:#fff;color:#111;border:1px solid #d8dce3;border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:5px;align-items:center;width:180px}
.label46 .cd{font-size:12px;font-weight:800}
.label46 .sub{font-size:8px;text-transform:uppercase;letter-spacing:.1em;color:#667}
.qrBox{width:90px;height:90px;color:#111}
.labelsGrid{display:flex;gap:9px;flex-wrap:wrap}
.empty{padding:36px 16px;text-align:center;color:var(--mut);font-size:12px;font-weight:700}
.pills{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.pills .sep{width:1px;height:18px;background:var(--line);margin:0 3px}

/* ===== danh sách: lưới card (m1/m5) + sidebar lọc ===== */
.split2{flex:1;display:flex;min-height:0;overflow:hidden}
.fs{width:225px;flex:none;padding:14px;display:flex;flex-direction:column;gap:7px;border-right:var(--lineW) solid var(--line);background:var(--panel);overflow:auto}
.fs .sec2{font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-top:7px}
.fbtn{display:flex;align-items:center;gap:8px;border:var(--lineW) solid var(--line);background:var(--card);border-radius:12px;padding:8px 11px;font-size:11px;font-weight:700;cursor:pointer;color:var(--txt);font-family:inherit;width:100%;text-align:left}
.fbtn.on{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc);background:var(--stOb);color:var(--stO)}
.fbtn .nb{margin-left:auto;font-size:9px;font-weight:800;color:var(--mut)}
.fgwrap{flex:1;min-width:0;overflow:auto;padding:14px 16px 26px;display:flex;flex-direction:column;gap:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px}
.stage[data-mock=m5] .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.gcard{background:var(--card);border:1px solid rgba(255,255,255,.75);border-radius:var(--r2);overflow:hidden;cursor:pointer;box-shadow:var(--shadow);transition:transform .14s}
.gcard .ph{aspect-ratio:1/1;display:grid;place-items:center;font-size:46px;background:var(--ph);position:relative}
.gcard .ph .chip{position:absolute;top:8px;left:8px}
.gcard .ph .kd{position:absolute;top:8px;right:8px;font-size:8.5px;font-weight:800;background:rgba(23,43,72,.55);color:#fff;padding:3px 8px;border-radius:99px;letter-spacing:.05em}
.gcard .ct{padding:9px 11px;display:flex;flex-direction:column;gap:3px;position:relative;z-index:1}
.gcard .ct b{font-size:10.5px;color:var(--brand);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gcard .ct p{font-size:10px;color:var(--txt);font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gcard .ct small{font-size:9px;color:var(--mut);font-weight:700}

/* ===== hàng ngang (m4) / danh sách ngăn (m3) ===== */
.hrow{display:flex;align-items:center;gap:12px;background:var(--card);border:var(--lineW) solid var(--line);border-radius:14px;padding:9px 13px;box-shadow:var(--shadow)}
.hrow .th{width:52px;height:52px;flex:none;border-radius:11px;display:grid;place-items:center;font-size:24px;background:var(--ph)}
.hrow .tx{flex:1;min-width:0}
.hrow .tx b{font-size:11.5px;display:block}
.hrow .tx span{font-size:10px;color:var(--mut);font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow .ops{display:flex;gap:6px;flex:none;flex-wrap:wrap;justify-content:flex-end}
.splitwrap{flex:1;display:flex;min-height:0;overflow:hidden}
.splist{width:330px;flex:none;border-right:var(--lineW) solid var(--line);overflow:auto;padding:10px;display:flex;flex-direction:column;gap:6px;background:var(--panel)}
.sitem{border:var(--lineW) solid var(--line);background:var(--card);border-radius:11px;padding:9px 11px;cursor:pointer;font-size:11px}
.sitem b{display:block;font-size:11px;color:var(--txt)}
.sitem span{color:var(--mut);font-size:9.5px;font-weight:600}
.sitem.sel{border-color:var(--acc);box-shadow:inset 3px 0 0 var(--acc)}
.scase{flex:1;overflow:auto;padding:16px 20px;display:flex;flex-direction:column;gap:13px;min-width:0}
.hero{max-width:760px;margin:2px auto 0;width:100%}
.heroBox{background:var(--card);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:9px;box-shadow:var(--shadow)}
.heroBox input{border:2px solid var(--acc);border-radius:14px;background:var(--inp);color:var(--txt);padding:15px 20px;font-size:16px;font-weight:800;font-family:inherit;width:100%}
.recentRow{display:flex;gap:7px;overflow-x:auto;padding:3px 2px}

/* ===== chi tiết (drawer + inline) ===== */
.drawer{position:absolute;top:0;right:0;bottom:0;width:390px;z-index:20;display:flex;flex-direction:column;transform:translateX(105%);transition:transform .25s}
.drawer.open{transform:none}
.stage[data-device=mobile] .drawer{width:auto;left:0;top:auto;height:80%;border-radius:24px 24px 0 0;border-left:none;border-top:1px solid rgba(255,255,255,.9);transform:translateY(105%)}
.dhead{display:flex;align-items:center;gap:7px;padding:11px 13px;border-bottom:var(--lineW) solid var(--line)}
.dhead h3{font-size:12.5px;font-weight:800;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dbody{flex:1;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:11px}
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.strip .im{aspect-ratio:1/1;border-radius:11px;display:grid;place-items:center;font-size:28px;border:var(--lineW) solid var(--line);background:var(--phBox);cursor:zoom-in}
.info{display:flex;flex-direction:column;gap:5px;font-size:11px;color:var(--txt)}
.info .r{display:flex;justify-content:space-between;gap:8px}
.info .r b{font-weight:800}
.info .r span{color:var(--mut);text-align:right;max-width:62%}
.tl{background:var(--bg);border:var(--lineW) solid var(--line);border-radius:11px;padding:9px 11px;flex:1;min-height:130px;overflow:auto}
.tl h4{font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);margin-bottom:7px}
.tl .ev{padding:7px 0;border-top:1px solid var(--line);font-size:10.5px;line-height:1.45}
.tl .ev:first-of-type{border-top:none}
.tl .ev .t{font-weight:800}
.tl .ev .m{color:var(--mut);font-size:9.5px}
.dock{padding:9px 13px;border-top:var(--lineW) solid var(--line);display:flex;flex-direction:column;gap:7px}
.rrow{display:flex;gap:7px}
.rrow .inp{padding:9px 14px;font-size:12px}
.msg{font-size:10px;font-weight:700;color:var(--stR)}

/* ===== Role — ma trận quyền ===== */
.mtxWrap{max-width:920px;margin:0 auto;width:100%}
.mtx{width:100%;border-collapse:collapse;font-size:11.5px}
.mtx td{border-top:1px solid var(--line);padding:10px;white-space:normal}
.mtx .act b{display:block;font-size:11.5px}
.mtx .act small{color:var(--mut);font-size:9.5px;font-weight:600}
.mtx .c{text-align:center;width:92px}
.ck{width:26px;height:26px;border-radius:8px;border:1.5px solid var(--line);background:var(--inp);display:inline-grid;place-items:center;cursor:pointer;font-size:13px;font-weight:800;color:transparent;font-family:inherit;vertical-align:middle}
.ck.on{background:var(--stR);border-color:var(--stR);color:#fff}
.ck.no{color:var(--mut);background:var(--bg)}
.ck.lock{cursor:default;opacity:.92}
.ck:disabled{cursor:not-allowed;opacity:.55}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:10px;font-weight:700;color:var(--mut);align-items:center}
.legend .ck{width:20px;height:20px;font-size:10px}

/* ===== thanh lý / in mã ===== */
.cartchips{display:flex;gap:7px;flex-wrap:wrap}
.cchipm{display:flex;gap:6px;align-items:center;background:var(--card);border:var(--lineW) solid var(--line);border-radius:99px;padding:6px 8px 6px 13px;font-size:10.5px;font-weight:800}
.cchipm button{border:none;background:var(--stOb);color:var(--stO);width:19px;height:19px;border-radius:50%;cursor:pointer;font-size:9px;font-weight:800}
.carttot{display:flex;justify-content:space-between;font-size:12.5px;font-weight:800;padding:10px 14px;background:var(--bg);border-radius:12px;border:var(--lineW) solid var(--line)}
.jobrow{display:flex;align-items:center;gap:10px;background:var(--card);border:var(--lineW) solid var(--line);border-radius:11px;padding:9px 13px;font-size:11px;font-weight:700}
textarea.inp{border-radius:16px;min-height:84px;resize:vertical;font-size:12px;padding:12px 15px}

/* ===== mobile ===== */
.bnav{display:none;z-index:30;border-top:var(--lineW) solid var(--line);background:var(--panel);backdrop-filter:blur(14px)}
.stage[data-device=mobile] .bnav{display:grid;grid-template-columns:repeat(5,1fr);padding:5px 5px 12px}

 S.q=v;render();toast('Lọc danh sách theo “'+v.slice(0,20)+'”')}

var A={
 mock:function(el){setMock(el.dataset.id)},
 me:function(el){setMe(el.dataset.id)},
 device:function(el){setDevice(el.dataset.id)},
 tab:function(el){setTab(el.dataset.id)},
 f:function(el){S.f=el.dataset.id;if(S.tab!=='list')setTab('list');else render()},
 kind:function(el){S.kind=el.dataset.id;render()},
 open:function(el){openDetail(el.dataset.id)},
 openInline:function(el){S.sel=el.dataset.id;S.rz='idle';S.ed=null;render()},
 closeDetail:function(){closeDetail();render()},
 zoom:function(){toast('Lightbox mock: zoom ＋/－ · pan · Esc')},
 /* resolve */
 resolveStart:function(){if(!can('resolve'))return;S.rz='form';paintDetail();var i=$('billIn');if(i)i.focus()},
 resolveConfirm:function(){var it=find(S.sel);if(!it)return;var el=$('billIn');if(!el)return;var v=el.value.trim();
  if(!/^SPX\w+$/.test(v)){if($('rzMsg')){$('rzMsg').style.color='var(--stO)';$('rzMsg').textContent='Bill phải dạng SPXVN…'}return}
  resolveBill(it,v);S.rz='idle';paintDetail();render()},
 quickResolve:function(el){S.sel=el.dataset.id;openDetail(el.dataset.id);A.resolveStart()},
 stMove:function(el){var it=find(el.dataset.id);if(!it||!isAdm())return;
  it.status=el.dataset.dir==='-1'&&it.status==='thanh_ly'?'da_tim_bill':'chua_xu_ly';
  addHist(it,'ADMIN đổi trạng thái → '+STLBL[it.status]);paintDetail();renderSide();toast('Đã lùi trạng thái (chỉ ADMIN)')},
 quickLiq:function(el){var it=find(el.dataset.id);if(!it||!isAdm())return;it.status='thanh_ly';addHist(it,'ADMIN thanh lý nhanh');paintDetail();renderSide();toast('Đã Thanh lý '+it.code)},
 noteEdit:function(){S.ed=S.sel;paintDetail()},
 noteCancel:function(){S.ed=null;paintDetail()},
 noteSave:function(){var it=find(S.sel);if(!it)return;
  if($('dDesc'))it.desc=$('dDesc').value.trim()||it.desc;
  if($('dNote'))it.note=$('dNote').value.trim();
  addHist(it,'Sửa mô tả/ghi chú');S.ed=null;paintDetail();render();toast('Đã lưu mô tả/ghi chú ✓')},
 /* in mã */
 printOne:function(el){S.pn.codes=[el.dataset.id||S.sel];setTab('print');toast('Tem '+(el.dataset.id||S.sel)+' đã nạp vào In Mã')},
 pkind:function(el){S.pn.kind=el.dataset.id;render()},
 printSample:function(){S.pn.codes=ITEMS.filter(function(i){return i.kind===S.pn.kind}).slice(0,10).map(function(i){return i.code});render();toast('Đã lấy '+S.pn.codes.length+' mã '+S.pn.kind+' gần nhất')},
 printGo:function(){var raw=$('printIn').value.split(/[\s,;]+/).filter(Boolean);
  var ok=raw.filter(function(c){return find(c)}),bad=raw.filter(function(c){return !find(c)});
  S.pn.codes=ok;render();
  if(!ok.length)toast('Không có mã hợp lệ'+(bad.length?' · bỏ: '+bad[0]:''));
  else toast('Xem trước '+ok.length+' tem 4×6in'+(bad.length?' · bỏ '+bad.length+' mã lạ':''))},
 printSend:function(){if(!can('print')){toast('Staff chưa được quyền In Mã');return}toast('✓ Đã gửi '+S.pn.codes.length+' lệnh in 4×6in tới máy nhiệt (mock)')},
 /* giỏ thanh lý */
 cartAdd:function(el){var c=el.dataset.id,it=find(c);
  if(!it||!can('liqAdd'))return;
  if(it.status==='thanh_ly'){toast(c+' đã Thanh Lý — bỏ qua');return}
  if(S.cart.codes.indexOf(c)>=0){toast('Đã có trong giỏ');return}
  S.cart.codes.push(c);toast('＋ '+c+' vào lô ('+S.cart.codes.length+')');renderSide();if(S.tab==='list')render()},
 cartMock:function(){var cand=ITEMS.filter(function(it){return it.status!=='thanh_ly'&&S.cart.codes.indexOf(it.code)<0});
  if(!cand.length){toast('Hết đơn chưa thanh lý');return}S.cart.codes.push(cand[0].code);render();renderSide()},
 cartDel:function(el){S.cart.codes=S.cart.codes.filter(function(c){return c!==el.dataset.id});render();renderSide()},
 cartNext:function(){if(S.cart.codes.length){S.cart.step=2;render()}},
 cartBack:function(){S.cart.step=1;render()},
 cartConfirm:function(){if(!can('liq')){toast('Chỉ ADMIN Confirm chốt lô (quyền “liq”)');return}
  var v=$('cartCode').value.trim();
  if(!/^SPX\w+$/.test(v)){toast('MÃ THANH LÝ bắt buộc dạng SPXVN…');return}
  S.cart.codes.forEach(function(code){var it=find(code);if(it){it.status='thanh_ly';it.bill=v;addHist(it,'Thanh lý lô '+v)}});
  var n=S.cart.codes.length;S.cart={codes:[],step:1};render();renderSide();
  toast('✓ Đã thanh lý '+n+' đơn · biên lai lô '+v)},
 /* create modal */
 openCreate:function(){openCreate()},
 closeCreate:function(){S.cm.open=false;renderCreate()},
 cmKind:function(el){S.cm.kind=el.dataset.id;S.cm.code=(S.cm.code||el.dataset.id+'.13-10-2026.'+(seq++));S.cm.photos=0;S.cm.step=2;renderCreate()},
 cmBack:function(){S.cm.step=1;renderCreate()},
 cmPhoto:function(el){var c=S.cm,i=+el.dataset.id,need=c.kind==='Box'?2:1;
  if(i<c.photos)c.photos=i;else if(c.photos<need+1)c.photos=i+1;renderCreate()},
 cmConfirm:function(){var c=S.cm;c.desc=($('cmDesc')&&$('cmDesc').value.trim())||'';c.note=($('cmNote')&&$('cmNote').value.trim())||'';
  var need=c.kind==='Box'?2:1;
  if(c.photos<need||(c.kind==='Box'&&!c.desc)){toast('Thiếu ảnh bắt buộc'+(c.kind==='Box'?' hoặc mô tả':''));return}
  ITEMS.unshift(mk(c.code,c.kind,'chua_xu_ly','',c.desc||'(không mô tả)',c.note,ME(),nowT(),0,c.kind==='Box'?'📦':'🏷'));
  addHist(ITEMS[0],'Tạo mới');c.done=c.code;c.step=3;renderCreate();renderSide();toast('Đã tạo '+c.code+' ✓')},
 cmPrint:function(){S.pn.codes=[S.cm.done];S.cm.open=false;renderCreate();setTab('print');toast('Tem '+S.cm.done+' nạp vào In Mã')},
 cmMore:function(){S.cm={open:true,step:1,kind:'Box',photos:0,desc:'',note:'',code:'',done:''};renderCreate()},
 /* hero m4 */
 heroMock:function(el){var v=el.dataset.id==='bill'?'SPXVN'+Math.floor(1e8+Math.random()*9e8):(Math.random()<.5?'Box.':'Item.')+'13-10-2026.'+Math.floor(3+Math.random()*9);
  $('heroIn').value=v;A.heroGo()},
 heroGo:function(){var v=$('heroIn').value.trim();if(!v)return;$('heroIn').value='';heroRoute(v)},
 /* role */
 perm:function(el){if(!isAdm())return;var k=el.dataset.id;S.sp[k]=!S.sp[k];
  render();toast((S.sp[k]?'✓ Mở':'– Khóa')+' quyền STAFF: '+(PERMS.filter(function(p){return p[0]===k})[0][1]||k))},
 toggleRole:function(el){if(!(isAdm()&&can('role'))){toast('Staff không đổi được vai trò');return}
  USERS[+el.dataset.id].role=USERS[+el.dataset.id].role==='ADMIN'?'STAFF':'ADMIN';render();toast('Đã đổi vai trò')},
 /* chat */
 openChat:function(){renderChat();$('maskChat').classList.add('on')},
 closeModal:function(el){$('mask'+el.dataset.id[0].toUpperCase()+el.dataset.id.slice(1)).classList.remove('on')},
 fbSend:function(){var v=$('chatIn').value.trim();if(!v)return;
  FEEDBACK.push({id:9,t:'13/10 '+new Date().toTimeString().slice(0,5),who:isAdm()&&can('adminReply')?'Admin':ME(),me:true,txt:v});$('chatIn').value='';renderChat()},
 fbReply:function(el){var f=FEEDBACK.filter(function(x){return x.id==el.dataset.id})[0];if(!f)return;
  FEEDBACK.push({id:10,t:'13/10 '+new Date().toTimeString().slice(0,5),who:isAdm()&&can('adminReply')?'Admin':ME(),me:true,txt:'Reply: '});$('chatIn').value='';renderChat();$('chatIn').focus()}
};
function renderChat(){$('chatList').innerHTML=FEEDBACK.map(function(f){
 return '<div class="bub'+(f.me?' me':'')+(f.who==='Admin'?' ad':'')+'"><div class="who">'+esc(f.who)+' · '+f.t+'</div>'+esc(f.txt)+(f.me?'':'<div style="margin-top:4px"><button class="btn mini" data-act="fbReply" data-id="'+f.id+'">Reply</button></div>')+'</div>'}).join('')}
var USERS=[{email:'admin.mock@spxexpress.com',role:'ADMIN'},{email:'duc.nguyenvan05@spxexpress.com',role:'ADMIN'},{email:'son.nguyenngoc@spxexpress.com',role:'STAFF'},{email:'lan.tran@spxexpress.com',role:'STAFF'},{email:'tuan.pham@spxexpress.com',role:'STAFF'}];

/* ================= events ================= */
document.addEventListener('click',function(e){var el=e.target.closest('[data-act]');if(!el)return;
 var fn=A[el.dataset.act];if(!fn)return;e.stopPropagation();fn(el,e)});
document.addEventListener('input',function(e){var t=e.target;
 if(t.id==='q'){S.q=t.value;render();
  var i=$('q');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}}});
document.addEventListener('keydown',function(e){
 if(e.key==='Escape'){closeDetail();$('maskCreate').classList.remove('on');$('maskChat').classList.remove('on');return}
 var t=e.target;
 if(e.key!=='Enter'||!/INPUT|TEXTAREA/.test(t.tagName))return;
 if(t.id==='heroIn'){A.heroGo();return}
 if(t.id==='billIn'){A.resolveConfirm();return}
 if(t.id==='cartIn'){var v=t.value.trim();t.value='';if(v){if(!find(v)){toast('Không có mã '+v);return}A.cartAdd({dataset:{id:v}})}return}
 if(t.id==='cartCode'){A.cartConfirm();return}
 if(t.id==='chatIn'){A.fbSend();return}
 if(t.id==='dDesc'||t.id==='dNote'){A.noteSave();return}});

/* init */
setDevice('pc');setTab('list');setMock('m1');
})();
</script>
</body>
