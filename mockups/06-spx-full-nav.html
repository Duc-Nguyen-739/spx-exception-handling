<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPX Exception Handling — Mockup v6 (nav đủ + fix ray trắng)</title>
<style>
*{box-sizing:border-box}
:root{--spx:#ee4d2d;--spx-coral:#ff7a50;--spx-peach:#ffb59e;--navy:#172b48}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f3f4f7;color:#2b3440;font-size:13px}
.app{display:flex;min-height:100vh}
/* sidebar full chiều cao */
.dash-side{flex:0 0 250px;width:250px;max-width:250px;position:sticky;top:0;height:100vh;overflow:hidden;background:#141c28;color:#e8ddcf;border-right:1px solid rgba(255,95,46,.3);padding:12px 16px 16px;display:flex;flex-direction:column;gap:10px;font-size:12.5px;transition:width .32s ease,flex-basis .32s ease,padding .32s ease}
.brand{display:flex;align-items:center;gap:10px;padding:2px 0 10px;border-bottom:1px solid rgba(255,95,46,.18);white-space:nowrap;overflow:hidden}
.spx-logo{height:28px;width:auto;display:block;flex:none}
.title{font-size:11.5px;font-weight:800;letter-spacing:.4px;color:#fff;line-height:1.35}
.nav{display:grid;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;border:none;background:transparent;color:#a89c8d;font-size:12.5px;font-weight:700;padding:10px 12px;border-radius:10px;cursor:pointer;font-family:inherit;text-align:left;min-height:44px;white-space:nowrap;border-left:3px solid transparent}
.nav button.on{background:rgba(255,95,46,.12);color:#fff;border-left-color:var(--spx)}
.side-head{display:flex;align-items:center;justify-content:space-between;gap:8px;white-space:nowrap}
.side-head-t{font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--spx-peach)}
.dash-collapse{width:27px;height:27px;border-radius:9px;border:1px solid rgba(255,95,46,.35);background:rgba(255,95,46,.1);color:var(--spx-peach);font-size:13px;cursor:pointer;display:grid;place-items:center;line-height:1;flex:none}
.dash-group{border-bottom:1px dashed rgba(255,95,46,.18);padding-bottom:8px}
.dash-fhead{width:100%;display:flex;justify-content:space-between;align-items:center;background:none;border:0;color:#e8ddcf;font-weight:700;font-size:12.5px;padding:8px 0;cursor:pointer;font-family:inherit;text-align:left;min-height:44px;white-space:nowrap}
.dash-body{display:grid;gap:2px;max-height:0;overflow:hidden;transition:max-height .28s ease;padding:0}
.dash-group.open .dash-body{max-height:320px;padding-top:4px}
.dash-opt{display:flex;align-items:center;gap:8px;font-size:12px;padding:9px 8px;border-radius:8px;color:#a89c8d;cursor:pointer;min-height:44px;white-space:nowrap}
.dash-cnt{margin-left:auto;font-size:10px;font-weight:700;background:rgba(255,95,46,.12);padding:1px 7px;border-radius:99px}
.dash-clear{margin-top:auto;width:100%;padding:10px 0;border-radius:10px;border:1px dashed rgba(255,95,46,.3);background:none;color:#a89c8d;font-size:11.5px;font-weight:700;cursor:pointer;min-height:44px;white-space:nowrap}
/* ray icon khi thu (desktop) */
.railbox{display:none}
.app.rail .dash-side{flex:0 0 64px;width:64px;max-width:64px;min-width:64px;padding:10px 0 12px;align-items:center;gap:6px}
.app.rail .brand{border-bottom:0;padding:2px 0 6px}
.app.rail .brand .spx-logo{height:auto;width:44px}
.app.rail .title,.app.rail .nav,.app.rail .side-head,.app.rail #filterWrap,.app.rail .dash-clear{display:none}
.app.rail .railbox{display:flex;flex-direction:column;align-items:center;gap:2px;flex:1;width:100%;overflow-y:auto}
.railbox button{width:48px;height:44px;border:none;background:transparent;color:#8b98ab;font-size:17px;cursor:pointer;border-radius:10px;border-left:3px solid transparent}
.railbox button:hover{color:#fff;background:rgba(255,95,46,.1)}
.railbox button.on{color:#fff;border-left-color:var(--spx);background:rgba(255,95,46,.12)}
.railbox .expand{margin-top:auto;color:var(--spx-peach)}
@media(min-width:1400px){.dash-side{flex-basis:300px;width:300px;max-width:300px}.app.rail .dash-side{flex-basis:64px;width:64px;max-width:64px;min-width:64px}}
@media(max-width:1100px){.dash-side{flex-basis:218px;width:218px;max-width:218px}.app.rail .dash-side{flex-basis:64px;width:64px;max-width:64px;min-width:64px}}
/* cột phải + header gọn */
.maincol{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:8px;background:#0d111a;color:#fff;padding:6px 12px;position:sticky;top:0;z-index:50}
.hamb{display:none;border:1px solid #2b3648;background:#1a2230;color:#fff;border-radius:8px;font-size:15px;padding:7px 11px;cursor:pointer;min-width:44px;min-height:44px}
.hsearch{flex:1;max-width:420px;display:flex;align-items:center;gap:6px;background:#1a2230;border:1px solid #2b3648;border-radius:8px;padding:6px 10px;color:#8b98ab}
.hsearch input{flex:1;border:none;background:transparent;color:#fff;font-size:12.5px;outline:none;min-height:32px}
.hbtn{border:1px solid #2b3648;background:#1a2230;color:#fff;border-radius:8px;padding:7px 11px;font-size:12px;font-weight:800;cursor:pointer;min-height:44px}
.hbtn.create{background:var(--spx);border-color:var(--spx)}
.view{flex:1;display:none;flex-direction:column;gap:12px;padding:12px 16px 20px}
.view.on{display:flex}
.card{background:#fff;border:1px solid #e8ebf0;border-radius:12px;padding:12px 14px}
.scanbar{display:flex;gap:8px;align-items:center}
.scanbar input{flex:1;border:1px solid #e2e6ec;border-radius:9px;padding:10px 12px;font-size:13px;min-height:44px}
.btn{border-radius:9px;padding:10px 16px;font-size:12.5px;font-weight:800;cursor:pointer;border:1px solid #e2e6ec;background:#fff;min-height:44px}
.btn.primary{background:var(--spx);border-color:var(--spx);color:#fff}
.btn.small{padding:7px 12px;min-height:36px;font-size:11.5px}
.btn.ghost{border:none;background:transparent;color:#2f80ed}
.pills{display:flex;gap:7px;flex-wrap:wrap}
.pill{border:1px solid #e2e6ec;background:#fff;border-radius:99px;padding:9px 15px;font-size:11.5px;font-weight:800;cursor:pointer;min-height:44px}
.pill.on{background:var(--navy);color:#fff;border-color:transparent}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.cell{border:1px solid #e8ebf0;border-radius:12px;overflow:hidden;background:#fff}
.cell .img{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;font-size:30px;background:linear-gradient(135deg,#eef1f6,#e2e8f1);cursor:pointer}
.cell .body{padding:8px 10px;border-top:1px solid #f3f4f7;font-size:11px;display:grid;gap:5px}
.cell .code{font-family:Consolas,monospace;font-weight:700}
.cell .desc{color:#5b6b7f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.badge{font-size:10px;font-weight:800;padding:3px 8px;border-radius:7px;background:#fff5f0;color:var(--spx)}
.badge.resolve{background:#e9faf0;color:#0d9a50}
.badge.liq{background:#eef4ff;color:#3274f7}
.days{font-size:10px;font-weight:800;color:#97a0ad}
.days.hot{color:#f79009}
.note{font-size:12px;color:#5b6b7f}
.empty{background:#fff;border:1px dashed #e2e6ec;border-radius:12px;padding:26px;text-align:center;color:#97a0ad}
.backrow{display:flex;align-items:center;gap:8px}
.cnt{background:#fff5f0;border:1px solid #ffd9cd;border-radius:12px;padding:10px 14px;display:flex;align-items:center;gap:12px}
.cnt b{font-size:26px;font-weight:800;color:var(--spx)}
.cnt small{font-size:11px;color:#b06a52;font-weight:600}
#liqList{list-style:none;padding:0;margin:0;display:grid;gap:8px}
#liqList li{background:#fff;border:1px solid #e8ebf0;border-radius:10px;padding:9px 12px;display:flex;gap:10px;align-items:center;font-size:12px}
#liqList li span{flex:1;font-family:Consolas,monospace;font-size:11px}
.field{margin:10px 0}
.field label{display:block;font-weight:800;margin-bottom:5px;font-size:11px;color:var(--navy)}
.field input{border:1px solid #e2e6ec;border-radius:9px;padding:10px 12px;font-size:13px;width:100%;min-height:44px}
table.users{width:100%;border-collapse:collapse;background:#fff;border:1px solid #e8ebf0;border-radius:12px;overflow:hidden;font-size:12px}
table.users td,table.users th{padding:10px 12px;text-align:left;border-bottom:1px solid #f3f4f7}
table.users th{font-size:10px;color:#97a0ad}
.st{display:inline-block;font-size:10px;font-weight:800;padding:4px 9px;border-radius:8px;background:#eef4ff;color:#3274f7}
.st.adm{background:#fff5f0;color:var(--spx)}
.modal{position:fixed;inset:0;background:rgba(20,30,45,.45);display:none;align-items:center;justify-content:center;z-index:500;padding:16px}
.modal.open{display:flex}
.dialog{background:#fff;border-radius:14px;padding:20px;max-width:360px;width:100%;text-align:center}
.dialog p{font-size:13.5px;font-weight:700;margin:0 0 16px}
.dialog .row{display:flex;gap:8px}
.dialog .row .btn{flex:1}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#141c28;color:#fff;padding:10px 16px;border-radius:9px;font-size:12.5px;display:none;z-index:600;max-width:90vw}
#spin{position:fixed;inset:0;background:rgba(15,20,30,.35);display:none;align-items:center;justify-content:center;z-index:550;color:#fff;font-weight:800}
@media(max-width:900px){
.hamb{display:grid;place-items:center}
.dash-side{position:fixed;top:0;left:0;bottom:0;height:100dvh;z-index:300;width:min(320px,85vw);max-width:min(320px,85vw);border-radius:0 16px 16px 0;transform:translateX(-100%);transition:transform .3s ease}
.app.rail .dash-side{flex:none;width:min(320px,85vw);max-width:min(320px,85vw);padding:12px 16px 16px;align-items:stretch}
.app.rail .title,.app.rail .nav,.app.rail .side-head,.app.rail #filterWrap,.app.rail .dash-clear{display:block}
.app.rail .railbox{display:none}
.app.mini .dash-side{transform:translateX(-100%);pointer-events:none}
.app:not(.mini) .dash-side{transform:translateX(0)}
.app:not(.mini)::after{content:'';position:fixed;inset:0;z-index:290;background:rgba(0,0,0,.55)}
.view{padding:10px 10px 16px}
.grid{grid-template-columns:repeat(2,1fr);gap:8px}
.topbar{flex-wrap:wrap}
.hsearch{order:5;flex-basis:100%;max-width:none}
}
</style>
</head>

    <span class="title"><span id="brandTitle" style="color:#fff">EXCEPTION HANDLING</span></span></div>
<div class="nav" id="mainNav">
<button data-view="list" class="on">🏠 Danh sách</button>
<button data-view="liq">📤 Thanh lý</button>
<button data-view="role">👥 Role</button>
</div>
<div id="filterWrap" style="display:contents">
<div class="side-head"><span class="side-head-t">Bộ lọc</span><button type="button" class="dash-collapse" onclick="toggleSide()" title="Thu gọn thành ray icon" aria-label="Thu gọn thành ray icon">«</button></div>
<div class="dash-group open">
<button type="button" class="dash-fhead" onclick="toggleGroup(this)"><span>● Trạng thái</span><span>▾</span></button>
<div class="dash-body" id="fStatus"></div>
</div>
<div class="dash-group open">
<button type="button" class="dash-fhead" onclick="toggleGroup(this)"><span>📋 Loại</span><span>▾</span></button>
<div class="dash-body" id="fKind"></div>
</div>
<button type="button" class="dash-clear" onclick="clearFilters()">✕ Xóa tất cả lọc</button>
</div>
<div class="railbox" id="railbox" aria-label="Ray icon"></div>
</aside>
<div class="maincol">
<div class="topbar">
<button class="hamb" onclick="toggleSide()" aria-label="Mở điều hướng">☰</button>
<div class="hsearch">⌕ <input id="q" placeholder="Tìm mã Box/Item, mô tả, bill…"></div>
<button class="hbtn create" onclick="goView('liq')">＋ Create</button>
<button class="hbtn" onclick="demoRefresh()">⟳</button>
</div>
<section class="view on" id="view-list">
<div class="card"><div class="scanbar"><input id="scan" placeholder="Nhập mã để tìm… (Enter lọc ngay)"><button class="btn primary" onclick="applySearch()">Search</button></div></div>
<div class="pills" id="pills"></div>
<div class="grid" id="grid"></div>
<div class="note" id="count"></div>
</section>
<section class="view" id="view-liq">
<div class="backrow"><button class="btn ghost" onclick="backFromLiq()">‹ Màn hình chính</button></div>
<div class="card"><div class="scanbar"><input id="scanLiq" placeholder="Quét mã đơn vào lô thanh lý… (Enter thêm)"><button class="btn primary" onclick="liqAddScan()">Thêm</button></div></div>
<div class="cnt" id="liqCnt" style="display:none"><b id="liqCount">0</b><small>mã trong lô · trùng / đã Resolve / đã Thanh lý bị chặn</small></div>
<ul id="liqList"></ul>
<div class="card">
<div class="field"><label>MÃ THANH LÝ (SPXVN…) *</label><input id="liqCode" placeholder="SPXVN…" style="font-family:Consolas,monospace"></div>
<button class="btn primary" style="width:100%" onclick="liqDone()">Confirm</button>
</div>
</section>
<section class="view" id="view-role">
<div class="card">
<div class="field"><label>THÊM ADMIN (email công ty)</label></div>
<div class="scanbar"><input id="newEmail" placeholder="email…"><button class="btn primary" onclick="addUser()">Thêm</button></div>
</div>
<div class="card"><table class="users" id="usersTable"></table></div>
<div class="note">Demo phân quyền: ADMIN sửa mọi đơn, STAFF chỉ tạo/Resolve/Thanh lý đơn Lưu kho.</div>
</section>
</div>
</div>
<div class="modal" id="confirmModal"><div class="dialog">
<p id="confirmText">Bạn muốn hủy task này chứ?</p>
<div class="row"><button class="btn primary" onclick="confirmLeave()">Confirm</button><button class="btn" onclick="closeModal()">Cancel</button></div>
</div></div>
<div id="spin">Đang tải…</div>
<div id="toast"></div>
<script>
var DATA=[
{code:'Box.06-10-2026.1',kind:'Box',desc:'Thùng 12 áo thun hoàn, seal còn nguyên',note:'Kệ B2',status:'chua_xu_ly',bill:'',days:0,by:'duc.nguyenvan05'},
{code:'Item.06-10-2026.2',kind:'Item',desc:'Khăn màu đỏ',note:'',status:'da_tim_bill',bill:'SPXVN123456789',days:0,by:'duc.nguyenvan05'},
{code:'Box.01-10-2026.21',kind:'Box',desc:'Thùng 8 giày thể thao, 1 hộp móp',note:'Kệ B2',status:'chua_xu_ly',bill:'',days:5,by:'son.nguyenngoc'},
{code:'Item.01-10-2026.3',kind:'Item',desc:'Áo khoác đen không bill',note:'Kệ A1',status:'chua_xu_ly',bill:'',days:5,by:'duc.nguyenvan05'},
{code:'Box.05-10-2026.21',kind:'Box',desc:'Thùng 12 áo thun hoàn chờ thanh lý',note:'Kệ C3',status:'thanh_ly',bill:'SPXVN998877665',days:1,by:'son.nguyenngoc'},
{code:'Item.04-10-2026.7',kind:'Item',desc:'Tai nghe bluetooth trắng',note:'Kệ A1',status:'da_tim_bill',bill:'SPXVN112233445',days:2,by:'duc.nguyenvan05'},
{code:'Box.03-10-2026.5',kind:'Box',desc:'Thùng mỹ phẩm, seal rách',note:'Kệ B1',status:'da_tim_bill',bill:'SPXVN556677889',days:3,by:'son.nguyenngoc'}
];
var USERS=[
{email:'admin.mock@spxexpress.com',role:'ADMIN'},
{email:'duc.nguyenvan05@spxexpress.com',role:'ADMIN'},
{email:'son.nguyenngoc@spxexpress.com',role:'STAFF'}
];
var LBL={chua_xu_ly:'Lưu kho',da_tim_bill:'Resolve',thanh_ly:'Thanh lý'};
var CLS={chua_xu_ly:'',da_tim_bill:'resolve',thanh_ly:'liq'};
var F={status:'',kinds:{Box:true,Item:true},q:''};
var LIQ=[];
var VIEW='list';
function isMobile(){return window.matchMedia&&window.matchMedia('(max-width: 900px)').matches;}
function toggleSide(){var a=document.getElementById('app');if(!a)return;if(isMobile()){a.classList.toggle('mini');}else{a.classList.toggle('rail');}syncFilterWrap();}
function syncFilterWrap(){var a=document.getElementById('app');var w=document.getElementById('filterWrap');if(!w)return;var rail=a&&a.classList.contains('rail')&&!isMobile();w.style.display=(VIEW==='list'&&!rail)?'contents':'none';}
function toggleGroup(b){var g=b.closest('.dash-group');if(g)g.classList.toggle('open');}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(function(){t.style.display='none';},2200);}
function counts(){var c={all:DATA.length,open:0,resolve:0,liq:0,Box:0,Item:0};DATA.forEach(function(d){if(d.status==='chua_xu_ly')c.open++;if(d.status==='da_tim_bill')c.resolve++;if(d.status==='thanh_ly')c.liq++;if(d.kind==='Box')c.Box++;else c.Item++;});return c;}
function goView(v){
VIEW=v;
document.querySelectorAll('#mainNav button').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-view')===v);});
document.querySelectorAll('.view').forEach(function(s){s.classList.toggle('on',s.id==='view-'+v);});
syncFilterWrap();
renderRail();
if(isMobile())document.getElementById('app').classList.add('mini');
}
document.querySelectorAll('#mainNav button').forEach(function(b){b.onclick=function(){goView(b.getAttribute('data-view'));};});
var RAILNAV=[['list','🏠','Danh sách'],['liq','📤','Thanh lý'],['role','👥','Role']];
function renderRail(){
var r=document.getElementById('railbox');if(!r)return;r.innerHTML='';
RAILNAV.forEach(function(o){
var b=document.createElement('button');b.textContent=o[1];b.title=o[2];
if(VIEW===o[0])b.classList.add('on');
b.onclick=function(){goView(o[0]);};
r.appendChild(b);});
var e=document.createElement('button');e.className='expand';e.textContent='»';e.title='Mở lại';
e.onclick=function(){document.getElementById('app').classList.remove('rail');};
r.appendChild(e);
}
function renderFilters(){
var c=counts();
var st=document.getElementById('fStatus');st.innerHTML='';
[['','Tất cả',c.all],['chua_xu_ly','Lưu kho',c.open],['da_tim_bill','Resolve',c.resolve]].forEach(function(o){
var l=document.createElement('label');l.className='dash-opt';
l.innerHTML='<input type="radio" name="st"'+(F.status===o[0]?' checked':'')+'> '+o[1]+' <span class="dash-cnt">'+o[2]+'</span>';
l.querySelector('input').onchange=function(){F.status=o[0];renderAll();};
st.appendChild(l);});
var k=document.getElementById('fKind');k.innerHTML='';
['Box','Item'].forEach(function(kind){
var l=document.createElement('label');l.className='dash-opt';
l.innerHTML='<input type="checkbox"'+(F.kinds[kind]?' checked':'')+'> '+kind+' <span class="dash-cnt">'+c[kind]+'</span>';
l.querySelector('input').onchange=function(e){F.kinds[kind]=e.target.checked;renderAll();};
k.appendChild(l);});
var p=document.getElementById('pills');p.innerHTML='';
[['','Tất cả',c.all],['chua_xu_ly','Lưu kho',c.open],['da_tim_bill','Resolve',c.resolve]].forEach(function(o){
var b=document.createElement('button');b.className='pill'+(F.status===o[0]?' on':'');b.textContent=o[1]+' '+o[2];
b.onclick=function(){F.status=o[0];renderAll();};p.appendChild(b);});
renderRail();
}
function visible(){
var q=F.q.toLowerCase();
return DATA.filter(function(d){
if(F.status&&d.status!==F.status)return false;
if(!F.kinds[d.kind])return false;
if(!q)return true;
return (d.code+' '+d.desc+' '+(d.bill||'')+' '+d.kind).toLowerCase().indexOf(q)>=0;
});
}
function renderGrid(){
var g=document.getElementById('grid');g.innerHTML='';
var list=visible();
if(!list.length){g.innerHTML='<div class="empty">Không tìm thấy đơn nào.</div>';}
list.forEach(function(d){
var el=document.createElement('div');el.className='cell';
var hot=(d.days>3&&d.status==='chua_xu_ly')?' hot':'';
var act=(d.status==='chua_xu_ly')?'<button class="btn small" data-act="resolve">Resolve</button>':'';
el.innerHTML='<div class="img" data-act="view">📦</div><div class="body"><span class="code">'+d.code+'</span><span class="desc">'+d.desc+'</span><div class="row"><span class="badge '+CLS[d.status]+'">'+LBL[d.status]+'</span><span class="days'+hot+'">'+d.days+' ngày</span></div><div class="row"><span class="desc">'+(d.bill||d.note||d.by||'')+'</span>'+act+'</div></div>';
el.querySelector('[data-act="view"]').onclick=function(){toast(d.code+' · '+d.desc+(d.bill?(' · '+d.bill):''));};
var rb=el.querySelector('[data-act="resolve"]');
if(rb)rb.onclick=function(){var bill=prompt('Nhập mã bill xử lý cho '+d.code+':','');if(!bill)return;d.status='da_tim_bill';d.bill=bill;renderAll();toast('Đã Resolve '+d.code);};
g.appendChild(el);});
document.getElementById('count').textContent='Hiển thị '+list.length+'/'+DATA.length+' đơn.';
}
function renderAll(){renderFilters();renderGrid();}
function applySearch(){F.q=document.getElementById('scan').value.trim();document.getElementById('q').value=F.q;renderAll();}
function clearFilters(){F={status:'',kinds:{Box:true,Item:true},q:''};document.getElementById('scan').value='';document.getElementById('q').value='';renderAll();toast('Đã xóa lọc');}
function demoRefresh(){var s=document.getElementById('spin');s.style.display='flex';setTimeout(function(){s.style.display='none';renderAll();toast('Đã làm mới (dữ liệu mẫu)');},500);}
function findItem(code){for(var i=0;i<DATA.length;i++)if(DATA[i].code===code)return DATA[i];return null;}
function renderLiq(){
var ul=document.getElementById('liqList');ul.innerHTML='';
LIQ.forEach(function(cd,i){
var li=document.createElement('li');li.innerHTML='<span>'+cd+'</span>';
var b=document.createElement('button');b.className='btn small';b.textContent='✕ Xóa';
b.onclick=function(){LIQ.splice(i,1);renderLiq();};
li.appendChild(b);ul.appendChild(li);});
document.getElementById('liqCount').textContent=LIQ.length;
document.getElementById('liqCnt').style.display=LIQ.length?'flex':'none';
}
function liqAdd(code){
code=String(code||'').trim();if(!code)return;
var it=findItem(code);
if(!it){toast('Không Có: '+code);return;}
if(it.status==='thanh_ly'){toast('Đã Thanh lý: '+code);return;}
if(it.status==='da_tim_bill'){toast('Đã Resolve: '+code);return;}
if(it.status!=='chua_xu_ly'){toast('Không cho thanh lý: '+code);return;}
if(LIQ.indexOf(code)>=0){toast('Trùng (đã có trong lô): '+code);return;}
LIQ.push(code);renderLiq();toast('Thành công: '+code);
}
function liqAddScan(){var inp=document.getElementById('scanLiq');liqAdd(inp.value);inp.value='';inp.focus();}
function liqDone(){
var lc=document.getElementById('liqCode').value.trim();
if(!LIQ.length){toast('Chưa scan mã nào.');return;}
if(!lc){toast('Vui lòng nhập mã thanh lý.');return;}
if(lc.toUpperCase().indexOf('SPXVN')<0){toast('Mã thanh lý phải chứa SPXVN.');return;}
LIQ.forEach(function(cd){var it=findItem(cd);if(it&&it.status==='chua_xu_ly'){it.status='thanh_ly';it.bill=lc.toUpperCase();}});
toast('Đã thanh lý '+LIQ.length+' mã ('+lc.toUpperCase()+').');
LIQ=[];document.getElementById('liqCode').value='';renderLiq();renderAll();
}
function backFromLiq(){
if(LIQ.length){document.getElementById('confirmText').textContent='Lô đang có '+LIQ.length+' mã. Bạn muốn hủy task này chứ?';document.getElementById('confirmModal').classList.add('open');}
else{goView('list');}
}
function confirmLeave(){LIQ=[];renderLiq();document.getElementById('confirmModal').classList.remove('open');goView('list');toast('Đã hủy lô thanh lý.');}
function closeModal(){document.getElementById('confirmModal').classList.remove('open');}
function renderUsers(){
var t=document.getElementById('usersTable');t.innerHTML='<tr><th>Email</th><th>Quyền</th><th></th></tr>';
USERS.forEach(function(u,i){
var tr=document.createElement('tr');
tr.innerHTML='<td>'+u.email+'</td><td><span class="st'+(u.role==='ADMIN'?' adm':'')+'">'+u.role+'</span></td>';
var td=document.createElement('td');var b=document.createElement('button');b.className='btn small';b.textContent='Xóa';
b.onclick=function(){USERS.splice(i,1);renderUsers();toast('Đã xóa '+u.email);};
td.appendChild(b);tr.appendChild(td);t.appendChild(tr);});
}
function addUser(){
var inp=document.getElementById('newEmail');var em=inp.value.trim().toLowerCase();
if(!em||em.indexOf('@')<0){toast('Nhập email cần thêm.');return;}
USERS.push({email:em,role:'ADMIN'});inp.value='';renderUsers();toast('Đã thêm '+em);
}
document.getElementById('scan').addEventListener('keydown',function(e){if(e.key==='Enter')applySearch();});
document.getElementById('scanLiq').addEventListener('keydown',function(e){if(e.key==='Enter')liqAddScan();});
document.getElementById('q').addEventListener('keydown',function(e){if(e.key==='Enter'){document.getElementById('scan').value=e.target.value;applySearch();}});
(function(){var app=document.getElementById('app');if(!app)return;var mq=window.matchMedia?window.matchMedia('(max-width: 900px)'):null;var sync=function(){if(mq&&mq.matches){app.classList.add('mini');app.classList.remove('rail');}else{app.classList.remove('mini');}syncFilterWrap();};sync();if(mq&&mq.addEventListener)mq.addEventListener('change',sync);app.addEventListener('click',function(e){if(app.classList.contains('mini'))return;if(mq&&!mq.matches)return;var t=e.target;if(t&&t.closest&&!t.closest('.dash-side,.hamb'))app.classList.add('mini');});})();
renderAll();renderLiq();renderUsers();
</script>
</body>
</html>
