<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPX Exception Handling — Gallery 10 mẫu vận hành (khổ thao tác mới)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Be Vietnam Pro',system-ui,-apple-system,sans-serif;background:#12151b;color:#dde3ee;-webkit-font-smoothing:antialiased}
#bar{position:sticky;top:0;z-index:99;background:rgba(18,21,27,.94);backdrop-filter:blur(12px);border-bottom:1px solid #262b35;padding:9px 14px 8px}
#bar .row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
#bar .lab{font-size:10px;font-weight:800;letter-spacing:.06em;color:#7e8798;text-transform:uppercase}
.tchip{border:1px solid #2b313d;background:#1a1f28;color:#b9c2d4;font-size:10.5px;font-weight:700;padding:5px 10px;border-radius:99px;cursor:pointer;font-family:inherit}
.tchip.on{background:#43506a;color:#fff;border-color:#5b6c92}
.tchip:hover{border-color:#54637c}
#devBox{margin-left:auto}
.dbtn{border:1px solid #2b313d;background:#1a1f28;color:#b9c2d4;font-size:10.5px;font-weight:700;padding:5px 12px;cursor:pointer;font-family:inherit}
.dbtn:first-of-type{border-radius:99px 0 0 99px}.dbtn:last-of-type{border-radius:0 99px 99px 0;border-left:none}
.dbtn.on{background:#dfe4f2;color:#12151b;border-color:#dfe4f2}
#flowNote{width:100%;font-size:11px;color:#8b93a6;margin-top:2px}
#flowNote b{color:#fff}
#stageWrap{padding:20px 14px 36px;display:flex;justify-content:center}

/* ===== stage ===== */
.stage{position:relative;width:100%;max-width:1400px;
 --bg:#f5f6f9;--card:#fff;--panel:#fff;--line:#e6e9ef;--txt:#172b48;--mut:#97a0ad;--ink:#303844;--brand:#172b48;--acc:#ee4d2d;--inp:#fff;--r:20px;--r2:14px;--lineW:1px;--blur:0px;--shadow:0 1px 5px rgba(23,43,72,.06);
 --sideBg:#172b48;--sideTxt:#9fb0c9;--stO:#ee4d2d;--stOb:#fff5f0;--stR:#0d9a50;--stRb:#e9faf0;--stL:#3274f7;--stLb:#eef4ff;--pageBg:#f5f6f9;--phBox:#f0f1f4;--phItem:#edf1f7;color:var(--txt)}
.stage[data-pal=frost]{--pageBg:radial-gradient(900px 500px at 12% -8%,#dfe4ff,transparent),radial-gradient(800px 480px at 95% 8%,#ffe9f2,transparent),radial-gradient(900px 600px at 60% 110%,#d9f8ef,transparent),#f5f6f9;--card:rgba(255,255,255,.62);--panel:rgba(255,255,255,.55);--line:rgba(255,255,255,.8);--blur:16px;--bg:transparent;--shadow:0 8px 32px rgba(35,42,69,.10);--r:24px;--r2:16px}
.stage[data-pal=navy]{--pageBg:#f2f4f8;--panel:#172b48;--line:#dfe4ec;--txt:#1d2b40;--acc:#d8492b;--inp:#f4f6fa;--r:16px;--r2:10px;--sideBg:#101f36;--stOb:#fdeee8}
.stage[data-pal=navy] .hdr,.stage[data-pal=navy] .flowbar{color:#fff;border-color:#2b4066}
.stage[data-pal=navy] .hh{color:#fff!important}
.stage[data-pal=navy] .srch{background:#22375a;border-color:#33507c}
.stage[data-pal=navy] .srch input{color:#e8eefb}
.stage[data-pal=navy] .abtn,.stage[data-pal=navy] .uchip,.stage[data-pal=navy] .btn{background:#22375a;color:#dbe5f7;border-color:#33507c}
.stage[data-pal=navy] .btn.pri,.stage[data-pal=navy] .btn.navy{background:var(--acc);border-color:var(--acc);color:#fff}
.stage[data-pal=navy] .btn.navy{background:#5d79a6;border-color:#5d79a6}
.stage[data-pal=navy] .pill{background:#22375a;color:#9fb4d4;border-color:#33507c}
.stage[data-pal=graphite]{--pageBg:linear-gradient(160deg,#20293f,#181f30 60%,#1b2436);--card:rgba(255,255,255,.065);--panel:rgba(24,31,48,.72);--line:rgba(255,255,255,.12);--blur:15px;--bg:transparent;--txt:#dfe6f2;--mut:#8b98b0;--brand:#cfe0ff;--acc:#f0654a;--inp:rgba(255,255,255,.08);--shadow:0 8px 30px rgba(0,0,0,.35);--sideBg:rgba(15,20,33,.8);--sideTxt:#8b98b0;--stO:#f2a65a;--stOb:rgba(242,166,90,.14);--stR:#5fd39a;--stRb:rgba(95,211,154,.13);--stL:#7aa5f2;--stLb:rgba(122,165,242,.14);--phBox:#2a3450;--phItem:#28324c}
.stage[data-pal=graphite] .btn{color:#dfe6f2}
.stage[data-pal=graphite] .pill.on{color:#101623}
.stage[data-pal=graphite] .pill[data-k=""].on{background:#cfe0ff}
.stage[data-device=mobile]{max-width:430px}
.stage[data-device=mobile] .app{width:390px;height:844px;border-radius:40px;border:10px solid #0b0e13;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.app{position:relative;overflow:hidden;background:var(--bg);height:calc(100vh - 108px);min-height:620px;display:flex;border-radius:var(--r);border:1px solid rgba(23,43,72,.1);isolation:isolate}
.app::before{content:"";position:absolute;inset:0;background:var(--pageBg);z-index:-1}

/* ===== shell ===== */
.side{flex:none;width:212px;background:var(--sideBg);color:var(--sideTxt);display:flex;flex-direction:column;padding:12px 9px;gap:2px;position:relative;z-index:6;overflow:auto}
.side .brand{display:flex;gap:9px;align-items:center;padding:4px 8px 12px}
.side .logo{width:28px;height:28px;flex:none;border-radius:9px;background:var(--acc);color:#fff;font-weight:800;font-size:10.5px;display:grid;place-items:center}
.side .bt{font-size:11.5px;font-weight:800;color:#fff;line-height:1.2}
.side .bt small{display:block;font-size:8.5px;font-weight:600;color:var(--sideTxt);letter-spacing:.05em;text-transform:uppercase}
.side .sec{margin-top:9px;padding:4px 10px;font-size:8.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:rgba(255,255,255,.35)}
.navi{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:10px;color:var(--sideTxt);font-size:11px;font-weight:700;cursor:pointer;border:none;background:transparent;width:100%;text-align:left;font-family:inherit}
.navi i{font-style:normal;width:17px;text-align:center;font-size:12.5px}
.navi:hover{color:#fff;background:rgba(255,255,255,.06)}
.navi.on{color:#fff;background:rgba(255,255,255,.13)}
.navi .nb{margin-left:auto;font-size:8.5px;background:rgba(255,255,255,.12);padding:1px 6px;border-radius:99px}
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.hdr{display:grid;grid-template-columns:1fr minmax(0,440px) 1fr;align-items:center;gap:10px;padding:9px 14px;background:var(--panel);border-bottom:var(--lineW) solid var(--line);backdrop-filter:blur(var(--blur));z-index:5}
.hdr .hh{font-size:12.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:7px;color:var(--brand)}
.hdr .hh .lg{width:23px;height:23px;flex:none;border-radius:7px;background:var(--acc);color:#fff;font-weight:800;font-size:9px;display:grid;place-items:center}
.srch{display:flex;align-items:center;gap:8px;background:var(--inp);border:1.5px solid var(--line);border-radius:99px;padding:3px 5px 3px 12px}
.srch input{flex:1;min-width:0;border:none;background:transparent;font-size:12px;font-weight:600;color:var(--txt);font-family:inherit;padding:6px 0}
.srch input:focus{outline:none}
.acts{display:flex;gap:6px;justify-content:flex-end;align-items:center}
.abtn{width:32px;height:32px;border-radius:99px;border:var(--lineW) solid var(--line);background:var(--panel);font-size:13px;cursor:pointer;position:relative;color:var(--ink)}
.abtn .dot{position:absolute;top:5px;right:6px;width:6px;height:6px;background:var(--acc);border-radius:50%;border:1.5px solid var(--panel)}
.uchip{display:flex;align-items:center;gap:6px;border:var(--lineW) solid var(--line);background:var(--panel);border-radius:99px;padding:3px 10px 3px 3px;font-size:10.5px;font-weight:800;color:var(--ink)}
.uchip .av{width:23px;height:23px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:9px;font-weight:800}
.flowbar{display:flex;align-items:center;gap:10px;padding:7px 14px;background:var(--panel);border-bottom:var(--lineW) solid var(--line);font-size:11px;font-weight:700;color:var(--ink);backdrop-filter:blur(var(--blur))}
.flowbar .fnum{width:21px;height:21px;border-radius:7px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:10px;font-weight:800;flex:none}
.flowbar .steps{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}
.fstep{font-size:8.5px;font-weight:800;letter-spacing:.03em;padding:3px 8px;border-radius:99px;background:var(--bg);border:var(--lineW) solid var(--line);color:var(--mut)}
.fstep.hot{background:var(--stOb);color:var(--stO);border-color:transparent}
.content{flex:1;overflow:auto;position:relative;display:flex;flex-direction:column;min-height:0}
.view{flex:1;overflow:auto;padding:14px 16px 26px;display:none;flex-direction:column;gap:10px}
.view.on{display:flex}

/* ===== shared bits ===== */
.btn{border:var(--lineW) solid var(--line);background:var(--panel);color:var(--ink);border-radius:99px;padding:8px 14px;font-size:11px;font-weight:800;cursor:pointer;font-family:inherit;white-space:nowrap}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.navy{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.green{background:var(--stR);border-color:var(--stR);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.btn.mini{padding:5px 10px;font-size:10px}
.btn.big{padding:13px 22px;font-size:13px;border-radius:99px}
.pill{border:var(--lineW) solid var(--line);background:var(--panel);color:var(--mut);border-radius:99px;padding:6px 12px;font-size:10.5px;font-weight:800;cursor:pointer;font-family:inherit;display:inline-flex;gap:5px;align-items:center}
.pill .dt{width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.panelBox{background:var(--card);border:var(--lineW) solid var(--line);border-radius:var(--r2);padding:15px;box-shadow:var(--shadow);backdrop-filter:blur(var(--blur));display:flex;flex-direction:column;gap:11px;color:var(--txt)}
.panelBox h3{font-size:13px;font-weight:800}
.ctx{font-size:10px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.inp{border:1.5px solid var(--line);border-radius:99px;background:var(--inp);color:var(--txt);padding:11px 16px;font-size:13px;font-family:inherit;font-weight:700;width:100%}
.inp:focus{outline:2px solid color-mix(in srgb,var(--acc) 40%,transparent)}
.chip{font-size:9.5px;font-weight:800;padding:4px 9px;border-radius:99px}
.sO{background:var(--stOb);color:var(--stO)}.sR{background:var(--stRb);color:var(--stR)}.sL{background:var(--stLb);color:var(--stL)}
.dotst{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:11px}
.dotst i{width:8px;height:8px;border-radius:50%;font-style:normal}
.scanrow{display:flex;gap:8px}
.tblwrap{background:var(--card);border:var(--lineW) solid var(--line);border-radius:var(--r2);overflow:auto;box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:9px 11px;font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);border-bottom:var(--lineW) solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--panel);z-index:1}
td{padding:9px 11px;border-top:1px solid var(--line);white-space:nowrap;color:var(--txt)}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--bg)}
td.sid{font-weight:800;color:var(--brand)}
td.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.del{border:none;background:transparent;color:var(--stO);font-weight:800;cursor:pointer;font-size:11px}
.label46{background:#fff;color:#111;border:1px solid #d8dce3;border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:5px;align-items:center;width:180px}
.label46 .cd{font-size:12px;font-weight:800}
.label46 .sub{font-size:8px;text-transform:uppercase;letter-spacing:.1em;color:#667}
.qrBox{width:90px;height:90px;color:#111}
.labelsGrid{display:flex;gap:9px;flex-wrap:wrap}
.empty{padding:36px 16px;text-align:center;color:var(--mut);font-size:12px;font-weight:700}

/* ===== drawer / sheet (kanban, grid fallbacks) ===== */
.drawer{position:absolute;top:0;right:0;bottom:0;width:380px;background:var(--panel);border-left:var(--lineW) solid var(--line);box-shadow:-12px 0 40px rgba(23,43,72,.1);z-index:20;display:flex;flex-direction:column;transform:translateX(105%);transition:transform .25s;backdrop-filter:blur(var(--blur))}
.drawer.open{transform:none}
.stage[data-device=mobile] .drawer{width:auto;left:0;top:auto;height:80%;border-radius:24px 24px 0 0;border-bottom:none;transform:translateY(105%)}
.dhead{display:flex;align-items:center;gap:7px;padding:11px 13px;border-bottom:var(--lineW) solid var(--line)}
.dhead h3{font-size:12.5px;font-weight:800;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dbody{flex:1;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:11px}
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.strip .im{aspect-ratio:1/1;border-radius:11px;display:grid;place-items:center;font-size:28px;border:var(--lineW) solid var(--line);background:var(--phBox)}
.info{display:flex;flex-direction:column;gap:5px;font-size:11px;color:var(--txt)}
.info .r{display:flex;justify-content:space-between;gap:8px}
.info .r b{font-weight:800}
.info .r span{color:var(--mut);text-align:right;max-width:62%}
.tl{background:var(--bg);border:var(--lineW) solid var(--line);border-radius:11px;padding:9px 11px;flex:1;min-height:150px;overflow:auto}
.tl h4{font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);margin-bottom:7px}
.tl .ev{padding:7px 0;border-top:1px solid var(--line);font-size:10.5px;line-height:1.45}
.tl .ev:first-of-type{border-top:none}
.tl .ev .t{font-weight:800}
.tl .ev .m{color:var(--mut);font-size:9.5px}
.dock{padding:9px 13px;border-top:var(--lineW) solid var(--line);display:flex;flex-direction:column;gap:7px}
.rrow{display:flex;gap:7px}
.rrow .inp{padding:9px 14px;font-size:12px}
.msg{font-size:10px;font-weight:700;color:var(--stR)}

/* ===== flow-specific ===== */
/* F1 scan desk */
.desk{max-width:720px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:13px;padding:8px 4px}
.deskbox{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:11px;box-shadow:var(--shadow)}
.deskbox input{border:2px solid var(--acc);border-radius:16px;background:var(--inp);color:var(--txt);padding:18px 22px;font-size:17px;font-weight:800;font-family:inherit;width:100%}
.desklog{display:flex;flex-direction:column;gap:6px}
.logline{display:flex;gap:9px;align-items:center;font-size:11px;font-weight:700;color:var(--txt);background:var(--card);border:var(--lineW) solid var(--line);border-radius:11px;padding:8px 12px}
.logline .tag{font-size:9px;font-weight:800;padding:2px 8px;border-radius:99px;flex:none}
/* F2 aging queue */
.qrow{display:flex;align-items:center;gap:12px;background:var(--card);border:var(--lineW) solid var(--line);border-radius:13px;padding:10px 14px;box-shadow:var(--shadow)}
.qrow .th{width:44px;height:44px;flex:none;border-radius:10px;display:grid;place-items:center;font-size:20px;background:var(--phBox)}
.qrow .tx{flex:1;min-width:0}
.qrow .tx b{font-size:11.5px;display:block}
.qrow .tx span{font-size:10px;color:var(--mut);font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agebar{width:96px;flex:none}
.agebar .b{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.agebar .b i{display:block;height:100%;border-radius:99px;background:var(--stO)}
.agebar small{font-size:9px;color:var(--mut);font-weight:800}
.qrow .ops{display:flex;gap:6px;flex:none}
/* F3 split desk */
.splitwrap{flex:1;display:flex;min-height:0;overflow:hidden}
.splist{width:340px;flex:none;border-right:var(--lineW) solid var(--line);overflow:auto;padding:10px;display:flex;flex-direction:column;gap:6px;background:var(--panel)}
.sitem{border:var(--lineW) solid var(--line);background:var(--card);border-radius:11px;padding:9px 11px;cursor:pointer;font-size:11px}
.sitem b{display:block;font-size:11px;color:var(--txt)}
.sitem span{color:var(--mut);font-size:9.5px;font-weight:600}
.sitem.sel{border-color:var(--acc);box-shadow:inset 3px 0 0 var(--acc)}
.scase{flex:1;overflow:auto;padding:16px 20px;display:flex;flex-direction:column;gap:13px;min-width:0}
.kbd{font-size:9.5px;color:var(--mut);font-weight:700}
.kbd kbd{background:var(--bg);border:var(--lineW) solid var(--line);border-radius:5px;padding:1px 6px;font-family:inherit}
/* F4 case timeline */
.chiprow{display:flex;gap:7px;overflow-x:auto;padding:4px 2px}
.cchip{flex:none;border:var(--lineW) solid var(--line);background:var(--card);border-radius:99px;padding:8px 14px;font-size:11px;font-weight:800;cursor:pointer;color:var(--txt);font-family:inherit}
.cchip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.casebig{max-width:780px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:13px}
.casebig .strip .im{font-size:40px}
/* F5 cart */
.cartwrap{max-width:780px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:12px}
.cartchips{display:flex;gap:7px;flex-wrap:wrap}
.cchipm{display:flex;gap:6px;align-items:center;background:var(--card);border:var(--lineW) solid var(--line);border-radius:99px;padding:6px 8px 6px 13px;font-size:10.5px;font-weight:800}
.cchipm button{border:none;background:var(--stOb);color:var(--stO);width:19px;height:19px;border-radius:50%;cursor:pointer;font-size:9px;font-weight:800}
.carttot{display:flex;justify-content:space-between;font-size:12.5px;font-weight:800;padding:10px 14px;background:var(--bg);border-radius:12px;border:var(--lineW) solid var(--line)}
/* F6 wizard */
.wiz{max-width:560px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:14px}
.wsteps{display:flex;gap:6px}
.wst{flex:1;height:5px;border-radius:99px;background:var(--line)}
.wst.on{background:var(--acc)}
.bigslot{aspect-ratio:1/1;max-height:230px;border-radius:var(--r);border:2.5px dashed var(--line);display:flex;flex-direction:column;gap:7px;align-items:center;justify-content:center;font-size:34px;color:var(--mut);cursor:pointer;background:var(--card);width:100%}
.bigslot.full{border-style:solid;background:var(--phBox);color:var(--txt)}
.slots3{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.slotlab{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
/* F7 print station */
.jobs{display:flex;flex-direction:column;gap:7px}
.jobrow{display:flex;align-items:center;gap:10px;background:var(--card);border:var(--lineW) solid var(--line);border-radius:11px;padding:9px 13px;font-size:11px;font-weight:700}
.jobst{font-size:9px;font-weight:800;padding:3px 9px;border-radius:99px}
.js-q{background:var(--stOb);color:var(--stO)}.js-p{background:var(--stLb);color:var(--stL)}.js-d{background:var(--stRb);color:var(--stR)}
/* F8 kanban */
.kan{flex:1;display:grid;grid-template-columns:repeat(3,minmax(220px,1fr));gap:11px;padding:13px 16px;align-content:start;overflow:auto}
.kcol{background:var(--bg);border:var(--lineW) solid var(--line);border-radius:var(--r2);display:flex;flex-direction:column;min-height:180px}
.khead{display:flex;align-items:center;gap:7px;padding:10px 12px;font-size:11px;font-weight:800;border-bottom:var(--lineW) solid var(--line)}
.khead .dt{width:7px;height:7px;border-radius:50%}
.khead b{margin-left:auto;font-size:9.5px;color:var(--mut);background:var(--card);border:var(--lineW) solid var(--line);padding:2px 7px;border-radius:99px}
.kbody{padding:8px;display:flex;flex-direction:column;gap:7px;overflow:auto}
.kc{background:var(--card);border:var(--lineW) solid var(--line);border-radius:11px;padding:8px 10px;font-size:10.5px;cursor:pointer;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:3px}
.kc p{color:var(--mut);font-weight:600;font-size:9.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kmv{display:flex;gap:5px;margin-top:2px}
.kmv button{border:var(--lineW) solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;font-size:9px;font-weight:800;padding:3px 7px;cursor:pointer;font-family:inherit}
/* F9 dashboard */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--card);border:var(--lineW) solid var(--line);border-radius:var(--r2);padding:13px 15px;box-shadow:var(--shadow);cursor:pointer}
.kpi b{font-size:21px;display:block;color:var(--txt)}
.kpi small{font-size:10px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.kpi.bo b{color:var(--stO)}.kpi.br b{color:var(--stR)}.kpi.bl b{color:var(--stL)}
.ghostrow{display:flex;align-items:center;gap:9px;font-size:10.5px}
.ghostrow .lab{width:74px;flex:none;font-weight:800;color:var(--mut)}
.ghostrow .b{flex:1;height:9px;border-radius:99px;background:var(--bg);border:var(--lineW) solid var(--line);overflow:hidden}
.ghostrow .b i{display:block;height:100%;background:var(--stO);border-radius:99px}
.ghostrow .n{width:26px;text-align:right;font-weight:800}
/* F10 gun */
.gunwrap{max-width:640px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:13px}
.gunres{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.gunres .code{font-size:19px;font-weight:800;letter-spacing:.01em}
.gungrid{display:grid;grid-template-columns:110px 1fr;gap:14px;align-items:start}
.gungrid .th{width:110px;height:110px;border-radius:14px;display:grid;place-items:center;font-size:44px;background:var(--phBox)}
.gunops{display:flex;gap:8px;flex-wrap:wrap}

/* ===== mobile ===== */
.bnav{display:none;z-index:30;border-top:var(--lineW) solid var(--line);background:var(--panel)}
.stage[data-device=mobile] .bnav{display:grid;grid-template-columns:repeat(5,1fr);padding:5px 5px 12px}
.stage[data-device=mobile] .side{display:none}
.stage[data-device=mobile] .hdr{grid-template-columns:1fr auto;padding:8px 10px}
.stage[data-device=mobile] .srch{display:none}
.stage[data-device=mobile] .acts .uchip span{display:none}
.stage[data-device=mobile] .splitwrap{flex-direction:column}
.stage[data-device=mobile] .splist{width:auto;max-height:190px;border-right:none;border-bottom:var(--lineW) solid var(--line)}
.stage[data-device=mobile] .kan{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(230px,82%);overflow-x:auto}
.stage[data-device=mobile] .slots3{grid-template-columns:1fr 1fr}
.stage[data-device=mobile] .gungrid{grid-template-columns:1fr}
.bn{display:flex;flex-direction:column;align-items:center;gap:2px;border:none;background:transparent;color:var(--mut);font-size:8.5px;font-weight:800;padding:5px 2px;cursor:pointer;font-family:inherit}
.bn i{font-style:normal;font-size:15px}
.bn.on{color:var(--acc)}
.bn.center .plus{width:40px;height:40px;margin-top:-13px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:19px;border:3px solid var(--panel)}
.stage[data-device=mobile] .deskOnly{display:none!important}

/* ===== modal / toast / chat ===== */
.mask{position:fixed;inset:0;background:rgba(15,20,30,.5);z-index:200;display:none;align-items:center;justify-content:center;padding:16px}
.mask.on{display:flex}
.modal{background:var(--panel);color:var(--txt);border:var(--lineW) solid var(--line);border-radius:var(--r);width:min(460px,100%);max-height:86vh;overflow:auto;padding:19px;box-shadow:0 30px 90px rgba(0,0,0,.35)}
.modal h2{font-size:14.5px;font-weight:800;margin-bottom:3px}

.pick{flex:1;min-width:110px;border:var(--lineW) solid var(--line);background:var(--bg);border-radius:var(--r2);padding:15px 10px;text-align:center;cursor:pointer;font-family:inherit;color:var(--txt)}
.pick:hover{border-color:var(--acc)}
.pick i{font-style:normal;display:block;font-size:21px;margin-bottom:5px}

.bub.ad{align-self:flex-end;background:var(--stRb);border-color:transparent;border-radius:13px 13px 4px 13px}
.chatIn{display:flex;gap:7px}
.chatIn input{flex:1;border:var(--lineW) solid var(--line);border-radius:99px;background:var(--inp);color:var(--txt);padding:9px 13px;font-size:11.5px;font-family:inherit}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);background:#232a45;color:#fff;font-size:11.5px;font-weight:700;padding:10px 18px;border-radius:99px;z-index:400;transition:transform .25s;box-shadow:0 12px 40px rgba(0,0,0,.3);max-width:90vw;text-align:center}

 return '<div class="ctx">Sắp theo tuổi tồn · '+rows.length+' đơn · Resolve & thêm lô ngay trên dòng</div>'+

 '<div class="tx"><b>'+it.code+' '+chip(it)+'</b><span>'+esc(it.desc)+(it.note?' · '+esc(it.note):'')+'</span></div>'+
 '<div class="agebar"><div class="b"><i style="width:'+Math.min(100,it.days*14)+'%'+(it.days>=3?';background:var(--stO)':'')+'"></i></div><small>'+it.days+' ngày</small></div>'+

/* F6 wizard */
R.wizard=function(){var w=S.wiz;
 var stepH='<div class="wiz"><div class="wsteps">'+[1,2,3].map(function(i){return '<div class="wst'+(w.step>=i?' on':'')+'"></div>'}).join('')+'</div>';
 if(w.step===1)return stepH+'<div class="panelBox"><h3>Bước 1 · Loại đơn</h3><div style="display:flex;gap:9px"><button class="pick'+''+'" data-act="wizKind" data-id="Box"><i>📦</i><b>BOX</b><br><small style="color:var(--mut)">2 ảnh bắt buộc</small></button><button class="pick" data-act="wizKind" data-id="Item"><i>🏷</i><b>ITEM</b><br><small style="color:var(--mut)">1 ảnh sản phẩm</small></button></div></div></div>';
 if(w.step===2){var need=w.kind==='Box'?2:1;
  var slots='';for(var i=0;i<need;i++){var lab=w.kind==='Box'?['Ngoại quan','Sản phẩm'][i]:'Sản phẩm';var full=i<w.photos;
   slots+='<div><div class="slotlab">'+lab+' '+(full?'✓':'— bắt buộc')+'</div><div class="bigslot'+(full?' full':'')+'" data-act="wizPhoto" data-id="'+i+'">'+(full?'🖼':'📷 Chụp')+'</div></div>'}
  var extra=need<3?'<div><div class="slotlab">Ảnh phụ (tùy chọn)</div><div class="bigslot'+(w.photos>need?' full':'')+'" data-act="wizPhoto" data-id="'+need+'">'+(w.photos>need?'🖼':'＋')+'</div></div>':'';
  return stepH+'<div class="panelBox"><h3>Bước 2 · Ảnh '+w.kind+' · '+w.code+'</h3><div class="slots3">'+slots+extra+'</div>'+
  '<button class="btn pri" style="width:100%" data-act="wizNext" '+(w.photos<need?'disabled':'')+'>Tiếp · mô tả →</button></div></div>'}
 if(w.step===3)return stepH+'<div class="panelBox"><h3>Bước 3 · Xác nhận</h3>'+
  '<div class="field"><div class="ctx">MÃ ĐƠN (server cấp — Sửa để ghi đè)</div><div class="rrow"><input class="inp" value="'+esc(w.code)+'" readonly style="flex:1"><button class="btn" data-act="wizNoop">Sửa</button></div></div>'+
  '<div class="ctx">MÔ TẢ'+(w.kind==='Box'?' (bắt buộc với Box)':'')+'</div><input class="inp" id="wDesc" value="'+esc(w.desc)+'">'+
  '<div class="ctx">GHI CHÚ</div><input class="inp" id="wNote" value="'+esc(w.note)+'">'+
  '<button class="btn pri" style="width:100%;margin-top:4px" data-act="wizConfirm">Confirm tạo '+w.kind+'</button></div>'+
  (w.done?'<div class="panelBox" style="border-color:var(--stR)"><h3 style="color:var(--stR)">Đã tạo '+esc(w.done)+' ✓</h3><div style="display:flex;gap:8px"><button class="btn" data-act="wizPrint">🖨 In Mã</button><button class="btn navy" data-act="wizMore">＋ Tạo tiếp</button></div></div>':'')+'</div>';
 return stepH+'</div>'};

 '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-act="stationJob">📱 Giả lập job từ điện thoại</button><button class="btn pri" data-act="stationPoll">↻ Poll + xử lý 1 bước</button></div></div>'+
 '<div class="panelBox" style="max-width:820px;margin:12px auto 0;width:100%"><h3>In 10 mã liên tiếp</h3><div style="display:flex;gap:7px"><button class="pill'+(S.bulkKind!=='Item'?' on':'')+'" data-act="bulkK" data-id="Box">Box</button><button class="pill'+(S.bulkKind==='Item'?' on':'')+'" data-act="bulkK" data-id="Item">Item</button></div><button class="btn pri" data-act="stationBulk">Lấy 10 mã & in</button>'+

 return '<div class="kan">'+order.map(function(st){var c=STK[st];
  var its=ITEMS.filter(function(it){return it.status===st});

/* F9 dash */
R.dash=function(){var c={o:0,r:0,l:0};ITEMS.forEach(function(it){if(it.status==='chua_xu_ly')c.o++;if(it.status==='da_tim_bill')c.r++;if(it.status==='thanh_ly')c.l++});
 var buckets=[0,0,0,0];ITEMS.forEach(function(it){var b=Math.min(3,Math.floor(it.days/2));buckets[b]++});
 var acts=[];ITEMS.forEach(function(it){it.hist.forEach(function(h){acts.push({t:h.t,e:h.e,m:h.m,c:it.code})})});acts.sort(function(a,b){return a.t<b.t?1:-1});
 return '<div style="max-width:900px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:12px">'+
 '<div class="kpis"><div class="kpi bo" data-act="flow" data-id="aging"><b>'+c.o+'</b><small>Đang Lưu kho</small></div><div class="kpi br"><b>'+c.r+'</b><small>Resolve kỳ này</small></div><div class="kpi bl"><b>'+c.l+'</b><small>Đã thanh lý</small></div><div class="kpi"><b>2</b><small>Job chờ trạm in</small></div></div>'+
 '<div class="panelBox"><h3>Tuổi tồn kho</h3>'+['0–1 ngày','2–3','4–5','6+'].map(function(l,i){return '<div class="ghostrow"><span class="lab">'+l+'</span><div class="b"><i style="width:'+(buckets[i]/ITEMS.length*100)+'%"></i></div><span class="n">'+buckets[i]+'</span></div>'}).join('')+'</div>'+
 '<div class="panelBox"><h3>Hoạt động realtime</h3>'+acts.slice(0,8).map(function(a){return '<div class="logline" style="background:transparent;border:none;padding:2px 0"><b style="font-size:10.5px">'+esc(a.m)+'</b><span style="color:var(--mut);font-size:9.5px">'+a.c+' · '+a.t.slice(11)+'</span></div>'}).join('')+'</div>'+
 '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn pri" data-act="flow" data-id="desk">🎯 Tiếp nhận</button><button class="btn" data-act="flow" data-id="cart">🛒 Lập lô thanh lý</button><button class="btn" data-act="flow" data-id="station">🖨 Trạm in</button><button class="btn" data-act="flow" data-id="role">🛡 Quyền</button></div></div>'};
/* F10 gun */
R.gun=function(){var it=S.gunCode?find(S.gunCode):null;
 return '<div class="gunwrap"><div class="scanrow"><input class="inp" id="gunIn" placeholder="Bắn mã đơn hoặc mô tả…" style="font-size:15px;padding:15px 20px"><button class="btn pri big" data-act="gunFind">Tìm</button></div>'+
 (it?'<div class="gunres">'+
 '<div style="display:flex;align-items:center;gap:9px"><span class="code">'+it.code+'</span>'+chip(it)+'</div>'+
 '<div class="gungrid"><div class="th" style="background:var(--ph'+(it.kind==='Box'?'Box':'Item')+')">'+it.e+'</div>'+
 '<div style="font-size:11.5px;display:flex;flex-direction:column;gap:6px">'+
 '<div><span class="ctx">Vị trí</span><br><b>'+esc(it.note||'(không ghi)')+'</b></div>'+
 '<div><span class="ctx">Mô tả</span><br>'+esc(it.desc)+'</div>'+
 '<div><span class="ctx">Tạo</span><br>'+it.at+' · '+it.days+' ngày trước</div>'+
 (it.bill?'<div><span class="ctx">Bill</span><br><b style="color:var(--brand)">'+esc(it.bill)+'</b></div>':'')+'</div></div>'+
 '<div class="gunops">'+(it.status==='chua_xu_ly'?'<button class="btn pri" data-act="open" data-id="'+it.code+'">Resolve / Hồ sơ</button><button class="btn" data-act="cartAdd" data-id="'+it.code+'">＋ Vào lô thanh lý</button>':'<button class="btn" data-act="open" data-id="'+it.code+'">Mở hồ sơ</button>')+'<button class="btn navy" data-act="gunPrint" data-id="'+it.code+'">🖨 In lại mã</button></div>'+
 '<div class="ctx">Bắn mã khác để đổi kết quả · Esc xóa</div></div>':'<div class="empty">Chưa có kết quả — bắn mã VD <b>Box.13-10-2026.1</b> hoặc <b>SPXVN123456789</b> (bill → tự tìm đơn)</div>')+
 '<div class="ctx" style="text-align:center">Mẹo: súng = Enter tự động, không cần bấm nút Tìm</div></div>'};
/* std tabs */
R.backlog=function(){var rows=BACKLOG.slice(0,10);
 return '<div class="ctx">Backlog — sheet read-only · Tổng COGS <b>'+fmt(rows.reduce(function(a,r){return a+r.cogs},0))+' ₫</b> · 42 dòng · phân trang 50</div>'+
 '<div class="tblwrap"><table><thead><tr><th>Shipment ID</th><th>Product</th><th>Return</th><th>Buyer</th><th>Status</th><th>Aging</th><th style="text-align:right">COGS</th></tr></thead><tbody>'+
 rows.map(function(r){return '<tr><td class="sid">'+r.sid+'</td><td>'+r.prod+'</td><td>'+r.ret+'</td><td>'+r.buyer+'</td><td><span class="chip '+(r.status==='Đủ'?'sR':r.status==='Thiếu'?'sO':'sL')+'">'+r.status+'</span></td><td>'+r.aging+' ngày</td><td class="num">'+fmt(r.cogs)+' ₫</td></tr>'}).join('')+'</tbody></table></div>'};
R.role=function(){return '<div class="panelBox" style="max-width:640px;margin:0 auto;width:100%"><h3>🛡 Quyền truy cập</h3><div class="ctx">Đăng nhập: '+ME+' (ADMIN)</div>'+
 USERS.map(function(u,i){return '<div class="qrow" style="cursor:default"><div class="tx" style="font-size:11.5px;font-weight:800">'+esc(u.email)+'</div><span class="chip '+(u.role==='ADMIN'?'sO':'sL')+'">'+u.role+'</span><button class="btn mini" data-act="toggleRole" data-id="'+i+'">'+(u.role==='ADMIN'?'→ STAFF':'→ ADMIN')+'</button></div>'}).join('')+'</div>'};

/* shared detail parts */
function headRow(it){return '<div style="display:flex;align-items:center;gap:9px;flex-wrap:wrap"><b style="font-size:15px">'+it.code+'</b>'+chip(it)+'<span style="margin-left:auto;display:flex;gap:6px"><button class="btn mini" data-act="printFromDetail" data-id="'+it.code+'">🖨 In Mã</button><button class="btn mini" data-act="closeDetail">✕ Đóng</button></span></div>'}
function imgStrip(it){var n=it.kind==='Box'?2:1,s='';for(var i=0;i<n;i++)s+='<div class="im" data-act="zoom" style="background:var(--ph'+(it.kind==='Box'?'Box':'Item')+')">'+it.e+'</div>';return s}
function infoRows(it){return '<div class="info"><div class="r"><b>Tạo lúc</b><span>'+it.at+' · '+it.days+' ngày</span></div><div class="r"><b>Người tạo</b><span>'+esc(it.by.split('@')[0])+'</span></div><div class="r"><b>Mô tả</b><span>'+esc(it.desc)+'</span></div>'+(it.note?'<div class="r"><b>Vị trí</b><span>'+esc(it.note)+'</span></div>':'')+(it.bill?'<div class="r"><b>Bill</b><span style="font-weight:800;color:var(--brand)">'+esc(it.bill)+'</span></div>':'')+'</div>'}
function timeline(it){return '<div class="tl"><h4>Chi tiết trạng thái ('+it.hist.length+')</h4>'+it.hist.map(function(h){return '<div class="ev"><div class="t">'+esc(h.m)+'</div><div class="m">'+esc(h.t)+' · '+esc(h.e)+'</div></div>'}).join('')+'</div>'}
function dock(it){if(it.status!=='chua_xu_ly')return '';
 if(S.rz==='form')return '<div class="dock"><div class="rrow"><input class="inp" id="billIn" placeholder="Mã bill SPXVN…"><button class="btn navy" data-act="resolveConfirm">Confirm</button></div><div class="msg" id="rzMsg"></div></div>';
 return '<div class="dock"><button class="btn pri" style="width:100%" data-act="resolveStart">Resolve</button></div>'}
/* drawer (used by aging/case/kanban/open action when not inline) */
function openDetail(code){S.sel=code;S.rz='idle';
 if(S.flow==='split'||S.flow==='case'){render();return}
 var it=find(code);if(!it)return;
 $('drawer').innerHTML='<div class="dhead"><h3>'+it.code+'</h3><button class="abtn" style="width:26px;height:26px;font-size:11px" data-act="closeDetail">✕</button></div>'+
 '<div class="dbody"><div class="strip">'+imgStrip(it)+'</div>'+infoRows(it)+timeline(it)+'</div>'+dock(it);
 $('drawer').classList.add('open')}
function closeDetail(){$('drawer').classList.remove('open')}

/* ================= dispatch ================= */
function render(){renderSide();renderHdr();renderBnav();
 var v=$('vFlow');v.className='view on';v.innerHTML=(R[S.flow]||R.desk)();
 if(S.flow==='split'){var i=v.querySelector('.sitem.sel');if(i)i.scrollIntoView({block:'nearest'})}
}
function setFlow(id){S.flow=id;render();
 var f=FLOWS[id];$('flowNote').innerHTML='<b>'+f[0]+'</b> — '+f[2];
 document.querySelectorAll('#bar .tchip:not(.pal)').forEach(function(c){c.classList.toggle('on',c.dataset.id===id)})}
function setPal(p){S.pal=p;$('stage').setAttribute('data-pal',p);
 document.querySelectorAll('.tchip.pal').forEach(function(c){c.classList.toggle('on',c.dataset.id===p)})}
function setDevice(d){S.device=d;$('stage').setAttribute('data-device',d);
 document.querySelectorAll('.dbtn').forEach(function(c){c.classList.toggle('on',(d==='pc')===/PC/.test(c.textContent))})}

/* ================= actions ================= */
function logScan(tag,k,c){S.scanlog.unshift({tag:tag,k:k,c:c,t:nowT()});S.scanlog=S.scanlog.slice(0,6)}
function resolveBill(it,bill){it.status='da_tim_bill';it.bill=bill;addHist(it,'Resolve · bill '+bill);toast('Đã Resolve '+it.code+' ✓');render()}
function autoRoute(v){
 if(/^SPX\w+$/.test(v)){/* bill */
  var m=ITEMS.filter(function(x){return x.bill===v})[0];
  if(m){logScan('BILL·đã Resolve','O',m.code);toast('Bill khớp đơn '+m.code+' (đã Resolve)');openDetail(m.code);return}
  var c=visible().filter(function(x){return x.status==='chua_xu_ly'})[0];
  if(c){resolveBill(c,v);logScan('BILL→Resolve','R',c.code);if(S.flow==='desk')render();return}
  toast('Không còn đơn Lưu kho để gán bill');return}
 var it=find(v);
 if(it){logScan('MỞ HỒ SƠ',STK[it.status],v);openDetail(v);return}
 if(/^(Box|Item)\./.test(v)){var kind=v.split('.')[0];
  S.wiz={step:3,kind:kind,desc:'',note:'',code:v,photos:0,done:'',fromScan:true};
  logScan('MÃ MỚI→Tạo','O',v);setFlow('wizard');toast('Mã mới — sang Wizard xác nhận thông tin');return}
 S.q=v;render();toast('Không trùng mã — lọc danh sách theo “'+v.slice(0,20)+'”')}

var A={
 flow:function(el){setFlow(el.dataset.id)},
 pal:function(el){setPal(el.dataset.id)},
 device:function(el){setDevice(el.dataset.id)},
 open:function(el){openDetail(el.dataset.id)},
 closeDetail:function(){closeDetail();render()},
 zoom:function(){toast('Lightbox mock: zoom ＋/－ · pan · Esc')},
 wizNoop:function(){},
 /* desk */
 deskIn:function(el){},
 deskMock:function(el){var t=el.dataset.id;var v;
  if(t==='new')v='Box.13-10-2026.'+seq++;
  else if(t==='exist')v=visible().filter(function(x){return x.status==='chua_xu_ly'})[0].code;
  else if(t==='cam')v='Item.13-10-2026.cam'+Math.floor(Math.random()*9);
  else v='SPXVN'+Math.floor(1e8+Math.random()*9e8);
  $('deskIn').value=v;A.deskGo()},
 deskGo:function(){var v=$('deskIn').value.trim();if(!v)return;$('deskIn').value='';autoRoute(v)},
 /* split nav */
 navSel:function(dir){var rows=visible();if(!rows.length)return;
  var i=rows.map(function(x){return x.code}).indexOf(S.sel);
  i=Math.max(0,Math.min(rows.length-1,(i<0?0:i+dir)));openDetail(rows[i].code)},
 /* resolve */
 resolveStart:function(){S.rz='form';render();if($('drawer').classList.contains('open'))refreshDrawerForm()},
 resolveConfirm:function(){var it=find(S.sel);if(!it)return;var el=$('billIn')||($('deskIn')&&null);
  if(!el)return;var v=el.value.trim();
  if(!/^SPX\w+$/.test(v)){if($('rzMsg')){$('rzMsg').style.color='var(--stO)';$('rzMsg').textContent='Bill phải dạng SPXVN…'}return}
  resolveBill(it,v);S.rz='idle';closeDetail();render()},
 printFromDetail:function(el){var c=el.dataset.id||S.sel;S.bulkCodes=[];setFlow('station');toast('Tem '+c+' đưa vào trạm in')},
 /* aging + gun -> cart */
 cartAdd:function(el){var c=el.dataset.id,it=find(c);
  if(!it)return;if(it.status!=='chua_xu_ly'){toast(c+' đã '+STLBL[it.status]+' — bỏ qua');return}
  if(S.cart.codes.indexOf(c)>=0){toast('Đã có trong giỏ');return}
  S.cart.codes.push(c);toast('＋ '+c+' vào giỏ ('+S.cart.codes.length+')');render()},
 cartMock:function(){var cand=ITEMS.filter(function(it){return it.status==='chua_xu_ly'&&S.cart.codes.indexOf(it.code)<0});
  if(!cand.length){toast('Hết mã Lưu kho');return}S.cart.codes.push(cand[0].code);render()},
 cartDel:function(el){S.cart.codes=S.cart.codes.filter(function(c){return c!==el.dataset.id});render()},
 cartNext:function(){if(S.cart.codes.length){S.cart.step=2;render()}},
 cartBack:function(){S.cart.step=1;render()},
 cartConfirm:function(){var v=$('cartCode').value.trim();
  if(!/^SPX\w+$/.test(v)){toast('MÃ THANH LÝ bắt buộc dạng SPXVN…');return}
  S.cart.codes.forEach(function(code){var it=find(code);if(it){it.status='thanh_ly';it.bill=v;addHist(it,'Thanh lý lô '+v)}});
  var n=S.cart.codes.length,cs=S.cart.codes.slice();S.cart={codes:[],liqCode:'',step:1};render();
  toast('✓ Đã thanh lý '+n+' đơn · biên lai lô '+v)},
 /* wizard */
 wizKind:function(el){S.wiz.kind=el.dataset.id;S.wiz.code=el.dataset.id+'.13-10-2026.'+(seq++);S.wiz.photos=0;S.wiz.step=2;render()},
 wizPhoto:function(el){var w=S.wiz;var i=+el.dataset.id;
  if(i<w.photos)w.photos=i;else if(w.photos<3)w.photos=i+1;render()},
 wizNext:function(){if(S.wiz.photos>0){S.wiz.step=3;render()}},
 wizBackTo:function(){S.wiz.step=1;render()},
 wizConfirm:function(){var w=S.wiz;w.desc=($('wDesc')&&$('wDesc').value.trim())||w.desc||'';w.note=($('wNote')&&$('wNote').value.trim())||w.note||'';
  if(w.kind==='Box'&&!w.desc){toast('Box bắt buộc Mô tả');return}
  ITEMS.unshift(mk(w.code,w.kind,'chua_xu_ly','',w.desc||'(không mô tả)',w.note,ME,nowT(),0,w.kind==='Box'?'📦':'🏷'));
  addHist(ITEMS[0],'Tạo mới'+(w.fromScan?' (từ quét quầy)':''));
  w.done=w.code;w.step=3;logScan('TẠO MỚI','O',w.code);render();toast('Đã tạo '+w.code+' ✓')},
 wizPrint:function(){setFlow('station');toast('Đưa tem '+S.wiz.done+' vào trạm in')},
 wizMore:function(){S.wiz={step:1,kind:'Box',desc:'',note:'',code:'',photos:0,done:''};render()},
 /* station */
 stationJob:function(){PRINTQ++;S.jobs.unshift({id:'J-0'+PRINTQ,code:S.bulkKind+'.'+'13-10-2026.'+(seq++),from:'phone · duc.nguyenvan05',state:'q'});render()},
 stationPoll:function(){var cur=S.jobs.filter(function(j){return j.state==='p'})[0];
  if(cur){cur.state='d';S.jobs.push(cur);S.jobs=S.jobs.filter(function(j,i2){return j!==cur||true});toast('Job '+cur.id+' in xong — ack');render();return}
  var nx=S.jobs.filter(function(j){return j.state==='q'})[0];
  if(!nx){toast('Không có job — nghỉ 10s rồi poll tiếp (mock)');return}
  nx.state='p';render();toast('Claim '+nx.id+' → đang in…')},
 bulkK:function(el){S.bulkKind=el.dataset.id;render()},
 stationBulk:function(){var cs=[];for(var i=0;i<10;i++)cs.push((S.bulkKind||'Box')+'.13-10-2026.'+(90+i));S.bulkCodes=cs;render();toast('Giữ chỗ 10 mã + in 1 lệnh 4×6in')},
 /* kanban */
 kanMove:function(el){var it=find(el.dataset.id);if(!it)return;
  var order=['chua_xu_ly','da_tim_bill','thanh_ly'];
  var d=+el.dataset.dir,i=order.indexOf(it.status)+d;
  if(d>0&&it.status==='chua_xu_ly'){openDetail(it.code);S.rz='form';refreshDrawerForm();toast('Resolve cần bill — nhập vào ô dưới');return}
  if(d<0){toast('Đổi ngược trạng thái = ADMIN trong modal Edit (mock chặn)');return}
  i=Math.max(0,Math.min(2,i));it.status=order[i];addHist(it,'Chuyển → '+STLBL[order[i]]);render()},
 /* gun */
 gunFind:function(){var v=$('gunIn').value.trim();if(!v)return;
  if(/^SPX\w+$/.test(v)){var m=ITEMS.filter(function(x){return x.bill===v})[0];
   if(m){S.gunCode=m.code;render();toast('Bill → đơn '+m.code);return}
   toast('Bill chưa khớp đơn nào');return}
  var it=find(v);
  if(!it)it=visible().filter(function(x){return x.desc.toLowerCase().indexOf(v.toLowerCase())>=0})[0];
  S.gunCode=it?it.code:null;render();if(!it)toast('Không tìm thấy “'+v.slice(0,20)+'”')},
 gunPrint:function(el){setFlow('station');S.jobs.unshift({id:'J-0'+(++PRINTQ),code:el.dataset.id,from:'tab In Mã',state:'q'});render()},
 /* misc */
 toggleRole:function(el){var u=USERS[+el.dataset.id];u.role=u.role==='ADMIN'?'STAFF':'ADMIN';render();toast(u.email+' → '+u.role)},
 openChat:function(){renderChat();$('maskChat').classList.add('on')},
 closeModal:function(el){$(('mask')+(el.dataset.id[0].toUpperCase()+el.dataset.id.slice(1))).classList.remove('on')},
 fbSend:function(){var v=$('chatIn').value.trim();if(!v)return;
  FEEDBACK.push({id:9,t:'13/10 '+new Date().toTimeString().slice(0,5),who:ME,me:true,txt:v});$('chatIn').value='';renderChat()}
};
function refreshDrawerForm(){var d=$('drawer').querySelector('.dock');
 var html='<div class="dock"><div class="rrow"><input class="inp" id="billIn" placeholder="Mã bill SPXVN…"><button class="btn navy" data-act="resolveConfirm">Confirm</button></div><div class="msg" id="rzMsg"></div></div>';
 if(d)d.outerHTML=html;else $('drawer').insertAdjacentHTML('beforeend',html);
 var i=$('billIn');if(i)i.focus()}
function renderChat(){$('chatList').innerHTML=FEEDBACK.map(function(f){
 return '<div class="bub'+(f.me?' me':'')+(f.who==='Admin'?' ad':'')+'"><div class="who">'+esc(f.who)+' · '+f.t+'</div>'+esc(f.txt)+(f.me?'':'<div style="margin-top:4px"><button class="btn mini" data-act="fbReply" data-id="'+f.id+'">Reply</button></div>')+'</div>'}).join('')}
S.bulkKind='Box';

/* ================= events ================= */
document.addEventListener('click',function(e){var el=e.target.closest('[data-act]');if(!el)return;
 var fn=A[el.dataset.act];if(!fn)return;e.stopPropagation();fn(el,e)});
document.addEventListener('input',function(e){var t=e.target;
 if(t.id==='q'){S.q=t.value;if(S.flow==='split'||S.flow==='aging'||S.flow==='desk')render();
  var i=$('q');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}}
 if(t.id==='deskIn'&&t.value){/* live */}});
document.addEventListener('keydown',function(e){
 if(e.key==='Escape'){$('drawer').classList.remove('open');if($('gunIn')){$('gunIn').value='';S.gunCode=null;render()}
  ['chat','create'].forEach(function(m){var mm=$('mask'+m[0].toUpperCase()+m.slice(1));if(mm&&mm.classList.contains('on'))mm.classList.remove('on')});return}
 var inField=/INPUT|TEXTAREA/.test(document.activeElement.tagName);
 if(e.key==='ArrowDown'&&!inField&&S.flow==='split'){e.preventDefault();A.navSel(1);return}
 if(e.key==='ArrowUp'&&!inField&&S.flow==='split'){e.preventDefault();A.navSel(-1);return}
 if(inField)return;
 if(S.flow==='split'&&(e.key==='j'||e.key==='J')){A.navSel(1);return}
 if(S.flow==='split'&&(e.key==='k'||e.key==='K')){A.navSel(-1);return}
 if(S.flow==='split'&&(e.key==='r'||e.key==='R')){if(S.sel){A.resolveStart()}return}
 var t=e.target;
 if(t.id==='billIn'&&e.key==='Enter'){A.resolveConfirm();return}});
document.addEventListener('keydown',function(e){if(e.key!=='Enter')return;var t=e.target;if(!/INPUT/.test(t.tagName))return;
 if(t.id==='deskIn'){A.deskGo();return}
 if(t.id==='billIn'){A.resolveConfirm();return}
 if(t.id==='cartIn'){var v=t.value.trim();t.value='';if(v){if(!find(v)){toast('Không có mã '+v);return}A.cartAdd({dataset:{id:v}})}return}
 if(t.id==='gunIn'){A.gunFind();return}
 if(t.id==='cartCode'){A.cartConfirm();return}});
/* flow meta for standard tabs */
FLOWS.backlog=['Backlog','Đối soát','Tab chuẩn hiện tại của app — sheet đọc 1 batch, giữ nguyên để đối chiếu với các luồng mới.'];
FLOWS.role=['Role','Phân quyền','Tab chuẩn — bảng user + đổi vai trò, chỉ ADMIN thêm được ADMIN.'];

/* init */
setPal('quiet');setDevice('pc');setFlow('desk');
})();
</script>
</body>
